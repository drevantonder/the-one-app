# The edition this build is: The One App. Another edition is this code built with its own config.toml
# (CONFIG=path/to/config.toml), kept in its own repo; nothing else in the code names the product.
name = "The One App"
cli = "one"
port = 4747
accent = "#9E6E06"
# Where `one update` and `one release` get the code, and the installer the releases.
repo = "drevantonder/the-one-app"
# Nodes and the installer take only releases signed by this key (OpenSSH, Ed25519). Its private half stays with the
# publisher: `one update` and `one release` run release_signer to get it, and keep it only in memory.
release_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJxXC8FYsJQXptCREC6fvoYzO1sNLdOHtbsAnmUTljCM"
release_signer = "ssh mac \"op read 'op://van-tonder-nosudo/The One App release key/private key?ssh-format=openssh'\""
# Every folder in apps/ ships built into each release, for any install to add. These are the ones a new install
# deploys and installs in global; each `one update` deploys the release's version of every one an install has.
apps = ["board", "repos", "apps", "devices"]
# The apps every agent needs from the start: MCP's instructions carry their guide in full (the rest come with search),
# and `one mcp --code` keeps their tools as tools, beside search and execute.
always_on = ["board"]
# Artwork, relative to this file: the app icon (1024px), the menu bar template (18pt, with an @2x),
# and the logo the apps show inside themselves.
icon = "icons/AppIcon.png"
menubar = "icons/MenuBarIcon.png"
logo = "icons/Logo.png"

# An install's settings until its admins change them in Settings (SPEC.md, "setting"). Every install has:
# store, the app the shells' App Store opens (an ordinary app, whose screens add apps to pages with ctx.install);
# push, the sidecar phones register their push tokens with and apps push through (sidecars/push), empty for off;
# made_here, what the App Store calls the apps made in the install, beside the ones built in; and join_domain, the
# email domain people may join with by signing in, where the work-email join sidecar runs (sidecars/workjoin).
[settings]
store = "apps"
push = "push"
made_here = "Made here"
join_domain = ""
