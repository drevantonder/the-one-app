# The white label this build is: The One App. Another white label is this code built with its own config.toml
# (CONFIG=path/to/config.toml), kept in its own repo; nothing else in the code names the product.
name = "The One App"
cli = "one"
port = 4747
# What the App Store calls the apps made in the install, beside the ones built in.
made_here = "Made here"
# Where `one update` and `one release` get the code, and the installer the releases.
repo = "drevantonder/the-one-app"
# Nodes and the installer take only releases signed by this key (OpenSSH, Ed25519). Its private half stays with the
# publisher: `one update` and `one release` run release_signer to get it, and keep it only in memory.
release_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJxXC8FYsJQXptCREC6fvoYzO1sNLdOHtbsAnmUTljCM"
release_signer = "op read 'op://van-tonder-nosudo/The One App release key/private key?ssh-format=openssh'"
# Every folder in apps/ ships built into each release, and a new install has them all, for anyone to add to their own
# page. These are the ones it also installs in global; each `one update` deploys the release's version of every one an install has.
apps = ["board", "repos", "apps", "device-activity"]
# The apps every agent needs from the start: MCP's instructions carry their guide in full (the rest come with search),
# and `one mcp --code` keeps their tools as tools, beside search and execute.
always_on = ["board"]
# How people sign in, which is also what opens their keys at the kernel's vault: "passkey", whose PRF output opens them,
# or "google", for a workplace whose people sign in with their Google account at join_domain every time, and join by
# doing so: the vault then opens their keys itself, so whoever controls the kernel can read the install's data.
sign_in = "passkey"
join_domain = ""
# Where the install's relay is made (a Cloudflare location hint: wnam, enam, sam, weur, eeur, apac, oc, afr or me), near
# its people, since every packet between devices that can't reach each other directly goes through it; empty for
# wherever its first request came from.
relay_location = "oc"
# Artwork, relative to this file: the app icon (1024px), the menu bar template (18pt, with an @2x),
# and the logo the apps show inside themselves.
icon = "icons/AppIcon.png"
menubar = "icons/MenuBarIcon.png"
logo = "icons/Logo.png"
# Where the native apps' pushes come from, each empty until the white label has it (and those apps get no notifications
# till then): Android's, the white label's Firebase project's google-services.json (relative to this file), with an
# Android app whose package is app.<cli>.android; Windows', its Microsoft Entra app registration's Application (client) ID
# and its service principal's Object ID, which WNS knows the Windows app by once Microsoft maps its package to them. The
# kernel sends with their secrets (FCM_ACCOUNT, WNS_*).
firebase = ""
wns_app = ""
wns_object = ""

# An install's settings until its admins change them in Settings (`setting` entries). Every install has store, the app
# the shells' App Store opens (an ordinary app, whose screens add apps to pages with ctx.install).
[settings]
store = "apps"
