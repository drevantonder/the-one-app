# The custom build this build is: The One App. Another custom build is this code built with its own config.toml
# (CONFIG=path/to/config.toml), kept in its own repo; nothing else in the code names the product.
name = "The One App"
cli = "one"
port = 4747
# What the App Store calls the apps made in the network, beside the ones built in.
made_here = "Made here"
# A custom build that serves one network (a workplace's) gives its address, so its native app never asks where;
# empty, the user types it.
address = ""
# Where `one-dev update` and `one-dev release` get the code, and the installer the releases.
repo = "drevantonder/the-one-app"
# Nodes and the installer take only releases signed by this key (OpenSSH, Ed25519). Its private half stays with the
# publisher: `one-dev update` and `one-dev release` run release_signer to get it, and keep it only in memory.
release_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJxXC8FYsJQXptCREC6fvoYzO1sNLdOHtbsAnmUTljCM"
release_signer = "op read 'op://van-tonder-nosudo/The One App release key/private key?ssh-format=openssh'"
# Every folder in apps/ ships built into each release, and a new network has them all, for anyone to add to their own
# page. These are the ones it also adds to global; each `one-dev update apps` deploys the release's version of every one a network has.
apps = ["repos", "apps"]
# The apps every agent needs from the start: MCP's instructions carry their guide in full (the rest come with search),
# and `one mcp --code` keeps their tools as tools, beside search and execute.
always_on = []
# A demo network for a store's reviewer, `<address>#<member's device key>`: a public key, so the app shows Try a Demo. Empty, none.
demo = ""
# A workplace's domain: where its users sign in with a provider's account, whose signed token must say it's at this
# domain (cloudflare/auth/worker.js). Empty for a network with no domain. Which providers a network has is its own
# (`providers` in its Workers' settings, each one's client beside their secrets).
join_domain = ""
# Where the network's relay is made (a Cloudflare location hint: wnam, enam, sam, weur, eeur, apac, oc, afr or me), near
# its users, since every packet between devices that can't reach each other directly goes through it; empty for
# wherever its first request came from.
relay_location = "oc"
# Artwork, relative to this file: the app icon (1024px), the menu bar template (18pt, with an @2x),
# and the logo the apps show inside themselves: the mark by itself, transparent, with no tile.
icon = "icons/AppIcon.png"
menubar = "icons/MenuBarIcon.png"
logo = "icons/Logo.png"
# Where the native apps' pushes come from, each empty until the custom build has it (and those apps get no notifications
# till then): Android's, the custom build's Firebase project's google-services.json (relative to this file), with an
# Android app whose package is app.<cli>.android; Windows', its Microsoft Entra app registration's Application (client) ID
# and its service principal's Object ID, which WNS knows the Windows app by once Microsoft maps its package to them. The
# push Worker sends with their secrets (FCM_ACCOUNT, WNS_*).
firebase = ""
wns_app = ""
wns_object = ""
# The iPhone app's bundle id, for a custom build that already has an app at Apple: its App Store Connect record, TestFlight
# testers and builds stay bound to the id they began with. Empty, app.<cli>.phone.
iphone = ""

# A network's settings until its admins change them in Settings (`setting` entries). Every network has store, the app
# the shells' App Store opens (an ordinary app, whose screens add apps to pages with ctx.add).
[settings]
store = "apps"
