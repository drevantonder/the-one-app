[package]
name = "client"
description = "One Core in a client: the device's key, reaching a server by key and asking it, what servers answered, and what an app's page is answered through."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
data-encoding = "2"
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# What this device is called, which its person is shown before they let it in.
gethostname = "1"
# Reading a folder as git would keep it, leaving out what its .gitignore files do, with no git needed.
ignore = "0.4"
# Reading the edge's clock from its `Date`, by which this device corrects its own (`ask` in `src/lib.rs`).
httpdate = "1"
iroh.workspace = true
# Asking the presigner at a network's address, with the TLS iroh reaches the relay there with.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2 = "0.11"
# Names the key file without replacing one that's there, on every system, a phone included.
tempfile = "3"
# What the client records of itself, with OpenTelemetry's own SDK, exported as OTLP (`src/telemetry.rs`).
async-trait = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
# A random part of each wait before it asks its network again, so devices that lost it together don't all ask at once.
fastrand = "2"
tokio.workspace = true

[build-dependencies]
serde_json.workspace = true

# What a phone is called, which only its system says (`name` in `src/lib.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "ios")'.dependencies]
dispatch2 = "0.3"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIDevice"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
