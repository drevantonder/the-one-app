# What the app runtime does with the network's bucket: says where it is, and moves the network's data to S3-compatible
# storage when an admin's `storage` setting says, through `api::AppRuntime`.
[package]
name = "bucket-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
bucket = { path = "..", features = ["machine"] }
api = { path = "../../api" }
scope = { path = "../../scope" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
