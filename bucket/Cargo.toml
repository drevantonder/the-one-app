# The bucket: a folder on a disk or S3-compatible storage, and the names of what's kept in it.
[package]
name = "bucket"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
key = { path = "../key" }
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
anyhow = "1"
blake3 = "1"
data-encoding = "2"
ed25519-dalek = "3"
rand = "0.8"
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"

[features]
# The bucket as a program on a machine reaches it: a folder, or S3 (`place`).
machine = ["dep:tokio", "dep:jiff", "dep:md-5"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["full"], optional = true }
jiff = { version = "0.2", optional = true }
md-5 = { version = "0.11", optional = true }
