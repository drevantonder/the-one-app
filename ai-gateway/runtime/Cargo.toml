[package]
name = "ai-gateway-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# What the app runtime does for AI Gateway: picks the model and whose key pays, holds a retryKey's answer, sends the call
# through the Vault's fill and says what it used, behind `Host`, which the app runtime implements.
[lib]
doctest = false

[dependencies]
ai-gateway = { path = ".." }
anyhow = "1"
# A retryKey's input is held to its first call's by hash.
blake3 = "1"
# A retryKey's answer is a row of the caller's own node database (`node/ai-gateway`), written in its transaction.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
