[package]
name = "ai-gateway-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# What the app runtime does for AI Gateway: runs `ctx.ai.run` and its tools as their `Host`, through `api::AppRuntime`:
# the keys that pay from the Vault's items, sent through its fill, the caller's own and Everyone's `node/ai-gateway`,
# a device's models through a service that declares `ai`, and each call's span in Insights.
[lib]
doctest = false

[dependencies]
ai-gateway = { path = ".." }
api = { path = "../../api" }
scope = { path = "../../scope" }
key = { path = "../../key" }
vault = { path = "../../vault" }
vault-runtime = { path = "../../vault/runtime" }
insights = { path = "../../insights" }
insights-runtime = { path = "../../insights/runtime" }
custom-build = { path = "../../custom-build" }
platform = { path = "../../platform", features = ["machine"] }
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
ureq = { version = "3", features = ["json"] }
