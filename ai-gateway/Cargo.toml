[package]
name = "ai-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
# Its tests run in the program's one test binary (tests/main.rs), against the stand-in they make.
autotests = false

# What every build has of AI Gateway, WebAssembly too: `ctx.ai.run`'s shapes, which model id runs where, the requests
# each place takes and the answers it gives (two translated: Google's and Anthropic's), whose key pays, a call's flow
# over the `Host` that runs it, and its tools' specs. Nothing here sends a request or holds a key: its hosts (the app
# runtime's, runtime/, and oned on Cloudflare's) send what this builds, filled by the Vault.
[lib]
doctest = false

[dependencies]
api = { path = "../api" }
key = { path = "../key" }
scope = { path = "../scope" }
vault = { path = "../vault" }
anyhow = "1"
# A retryKey's input is held to its first call's by hash.
blake3 = "1"
# A retryKey's answer is a row of the caller's own app runtime database (`node/ai-gateway`), written in its transaction.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
