# The network's Workers on Cloudflare as devices meet them: building and running them in workerd, deploying them
# (`one cloudflare`), Basin, and oned on Cloudflare's Worker (node/, which is oned on Cloudflare).
[package]
name = "oned-cloudflare"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
custom-build = { path = "../../custom-build" }
platform = { path = "../../platform", features = ["machine"] }
key = { path = "../../key" }
scope = { path = "../../scope" }
api = { path = "../../api" }
deploy = { path = "../../deploy" }
insights = { path = "../../insights" }
ai-gateway = { path = "../../ai-gateway" }
oned-update = { path = "../update", features = ["machine"] }
# The web client's files, the Workers' sources and oned on Cloudflare's WebAssembly this build carries.
ui = { path = "../../ui" }
# The guide the address serves (llms.txt).
mcp = { path = "../../api/mcp" }
anyhow = "1"
data-encoding = "2"
ed25519-dalek = "3"
# workerd runs as this program's child; on Unix it's killed with it.
libc = "0.2"
rand = "0.8"
# The notifications Worker's VAPID key is made with ring (src/workers.rs).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }
