# oned (`<cli>d`): a computer's always-on program, keeping its onet, its app runtime and its services running. The
# update path is oned/update/; the Workers' deploy and oned on Cloudflare, which is oned on Cloudflare, oned/cloudflare/.
[package]
name = "oned"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
custom-build = { path = "../custom-build" }
platform = { path = "../platform", features = ["machine"] }
key = { path = "../key" }
scope = { path = "../scope" }
api = { path = "../api" }
services = { path = "../services" }
device-logs = { path = "../device-logs" }
insights = { path = "../insights" }
oned-update = { path = "update", features = ["machine"] }
anyhow = "1"
# A service's part answers its program on a loopback (src/part.rs).
axum = "0.8"
data-encoding = "2"
ed25519-dalek = "3"
# Starting, waiting on and stopping its programs on Unix (src/part.rs).
libc = "0.2"
rand = "0.8"
# The release key, and signing the record with it (src/publish.rs).
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
