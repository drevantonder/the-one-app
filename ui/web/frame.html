<!doctype html>
<meta charset="utf-8">
<!-- What each app screen's frame loads (web.js): the screen's page, as its app runtime made it, is written in once the web
     client sends it. The frame is sandboxed without its own origin, so the screen can't reach the web client or its
     tokens; it talks only through the bridge's messages. Anywhere else (framed by another site without a sandbox,
     say) it has this origin, and does nothing. -->
<script>
  // A frame of a colour scheme its window isn't has an opaque canvas, the wrong colour until the screen is written in.
  const look = (l) => (document.documentElement.style.colorScheme = l === "automatic" ? "light dark" : l);
  look(location.hash.slice(1));
  if (self.origin === "null") {
    addEventListener("message", function take(e) {
      if (e.source !== parent) return;
      // @one/ui ahead of its screen, which is most of what a new frame costs, for a screen's page written without it
      // (screens.js's `spare`). A browser whose `document.open` clears its globals can't keep it there, so it's asked first.
      if (typeof e.data?.oneKit === "string") {
        document.head.append(Object.assign(document.createElement("script"), { textContent: e.data.oneKit }));
        document.open();
        document.close();
        look(location.hash.slice(1));
        addEventListener("message", take);
        parent.postMessage({ oneKitted: typeof OneUI === "object" }, "*");
        return;
      }
      if (typeof e.data?.oneLook === "string") return void look(e.data.oneLook);
      if (typeof e.data?.oneScreen !== "string") return;
      removeEventListener("message", take);
      document.open();
      document.write(e.data.oneScreen);
      document.close();
      requestAnimationFrame(() => requestAnimationFrame(() => parent.postMessage({ oneWritten: true }, "*")));
    });
    parent.postMessage({ oneFrame: true }, "*");
  }
</script>
