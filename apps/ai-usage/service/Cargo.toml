[package]
name = "one-ai-usage"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
one-service = { path = "../../../service" }
anyhow = "1"
data-encoding = "2"
# Providers give reset times as RFC 3339 timestamps.
jiff = "0.2"
# OpenCode keeps its sign-ins in SQLite, read here read-only.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
