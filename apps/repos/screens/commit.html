<div id="page"></div>
<script>
one.title(`Commit ${short(P.sha)}`);
let split = wide();
let data;

const badge = { added: "Added", deleted: "Deleted", renamed: "Renamed" };
const counts = (f) => `<span class="counts"><span class="add">+${f.additions.toLocaleString()}</span> <span class="del">−${f.deletions.toLocaleString()}</span></span>`;
const hl = (s, path) => one.highlight(s, path)[0] || "";

function unified(f) {
  let out = "";
  for (const h of f.hunks) {
    let a = h.a, b = h.b;
    out += `<tr class="d-hunk"><td class="ln"></td><td class="ln"></td><td class="dc">@@ −${h.a} +${h.b} @@</td></tr>`;
    for (const l of h.lines) {
      const t = l[0], s = l.slice(1);
      const cls = t === "+" ? "d-add" : t === "-" ? "d-del" : "";
      out += `<tr class="${cls}"><td class="ln" data-n="${t === "+" ? "" : a++}"></td><td class="ln" data-n="${t === "-" ? "" : b++}"></td><td class="dc"><span class="sign">${t === " " ? "" : t}</span>${hl(s, f.path)}</td></tr>`;
    }
  }
  return `<table class="diff unified">${out}</table>`;
}

function sideBySide(f) {
  let out = "";
  const cell = (n, s, cls) => (n === null ? `<td class="ln empty"></td><td class="dc empty"></td>` : `<td class="ln ${cls}" data-n="${n}"></td><td class="dc ${cls}">${hl(s, f.path)}</td>`);
  for (const h of f.hunks) {
    let a = h.a, b = h.b;
    out += `<tr class="d-hunk"><td class="ln"></td><td class="dc" colspan="3">@@ −${h.a} +${h.b} @@</td></tr>`;
    for (let i = 0; i < h.lines.length; ) {
      if (h.lines[i][0] === " ") {
        const s = h.lines[i++].slice(1);
        out += `<tr>${cell(a++, s, "")}${cell(b++, s, "")}</tr>`;
        continue;
      }
      const del = [], add = [];
      while (i < h.lines.length && h.lines[i][0] === "-") del.push(h.lines[i++].slice(1));
      while (i < h.lines.length && h.lines[i][0] === "+") add.push(h.lines[i++].slice(1));
      for (let k = 0; k < Math.max(del.length, add.length); k++)
        out += `<tr>${k < del.length ? cell(a++, del[k], "d-del") : cell(null)}${k < add.length ? cell(b++, add[k], "d-add") : cell(null)}</tr>`;
    }
  }
  return `<table class="diff split">${out}</table>`;
}

function body(f, k) {
  if (f.failed) return `<div class="file-note">${one.problem({ title: one.plain(f.failed).title, action: { label: "Try Again", run: () => load(k, true) } })}</div>`;
  if (f.binary) return `<div class="file-note muted">Binary file not shown.</div>`;
  if (f.too_big) return `<div class="file-note muted">This file is too big to diff here.</div>`;
  if (f.large && !f.hunks) return `<div class="file-note"><span>Large diff, ${(f.additions + f.deletions).toLocaleString()} lines.</span><button class="button" onclick="load(${k}, true)">Load diff</button></div>`;
  // Room for about what's coming, so the page doesn't jump as diffs come in above where someone's reading.
  if (!f.hunks) return `<div style="min-height:${Math.min(f.additions + f.deletions + 2, 30) * 20}px"></div>`;
  if (!f.hunks.length) return `<div class="file-note muted">${f.status === "renamed" ? "File renamed without changes." : f.old_mode !== f.new_mode ? "Only the file's mode changed." : "No changes to show."}</div>`;
  return `<div class="diff-scroll">${split ? sideBySide(f) : unified(f)}</div>`;
}

function file(d, f, k) {
  const at = f.status === "deleted" ? d.parents[0] : d.sha;
  const mode = f.old_mode && f.new_mode && f.old_mode !== f.new_mode ? `<span class="mode">${f.old_mode} → ${f.new_mode}</span>` : "";
  return `<section class="diff-file" id="f${k}">
    <header>
      <button class="tool fold" aria-label="Collapse" onclick="this.closest('section').classList.toggle('folded')">${one.icon("caret-down")}</button>
      <span class="diff-path">${f.old_path ? `${esc(f.old_path)} → ` : ""}${esc(f.path)}</span>
      ${badge[f.status] ? `<span class="badge ${f.status}">${badge[f.status]}</span>` : ""}${mode}
      ${counts(f)}
      ${at ? `<a class="tool" onclick="${go("file", { repo: d.repo, ref: at, path: f.path })}">View file</a>` : ""}
    </header>
    <div class="diff-body">${body(f, k)}</div>
  </section>`;
}

function redraw(k) {
  const el = document.querySelector(`#f${k} .diff-body`);
  if (el) el.innerHTML = body(data.files[k], k);
}

async function load(k, asked) {
  const f = data.files[k];
  f.failed = null;
  const el = document.querySelector(`#f${k} .diff-body`);
  const wait = () => !f.hunks && !f.failed && (el.innerHTML = one.loading("Loading diff"));
  const slow = asked ? wait() : setTimeout(wait, 400);
  try {
    Object.assign(f, await one.call("diff", { repo: P.repo, sha: P.sha, path: f.path }));
  } catch (err) {
    f.failed = err;
  }
  clearTimeout(slow);
  redraw(k);
}

// Files that wait (not the large ones) each load as they come near the screen.
const near = window.IntersectionObserver && new IntersectionObserver((all) => {
  for (const e of all) {
    if (!e.isIntersecting) continue;
    near.unobserve(e.target);
    load(+e.target.id.slice(1));
  }
}, { rootMargin: "800px 0px" });
function later() {
  data.files.forEach((f, k) => {
    if (!f.later || f.large || f.hunks) return;
    if (near) near.observe(document.getElementById("f" + k));
    else load(k);
  });
}

async function show() {
  const d = (data = await one.call("commit", { repo: P.repo, sha: P.sha }));
  const add = d.files.reduce((n, f) => n + f.additions, 0), del = d.files.reduce((n, f) => n + f.deletions, 0);
  const parents = d.parents.length
    ? `${plural(d.parents.length, "parent", "parents")} ${d.parents.map((p) => `<a onclick="${go("commit", { repo: d.repo, sha: p })}"><code>${short(p)}</code></a>`).join(" + ")}`
    : "No parents";
  setTimeout(later, 0);
  return `<div class="commit-head">
      <h1>${esc(d.subject)}</h1>
      ${d.body ? `<pre class="commit-body">${esc(d.body)}</pre>` : ""}
      <div class="commit-by">${avatar(d, "small")}<strong>${esc(d.author)}</strong> committed ${ago(d.time, { long: true })}</div>
      <div class="commit-meta">
        <span>commit <code>${short(d.sha)}</code>${one.copyButton(d.sha, { label: "" })}</span>
        <span>${parents}</span>
        <button class="button" onclick="${go("repo", { repo: d.repo, ref: d.sha })}">${one.icon("code")}Browse files</button>
      </div>
    </div>
    <div class="diff-summary">
      <span>${plural(d.files.length, "file", "files")} changed, ${counts({ additions: add, deletions: del })}</span>
      <div class="segmented narrow" role="group" aria-label="Diff layout"><button data-split="0" class="${split ? "" : "on"}">Unified</button><button data-split="1" class="${split ? "on" : ""}">Split</button></div>
    </div>
    ${d.files.length ? `<div class="list changed">${d.files.map((f, k) => `<a class="row plain" onclick="document.getElementById('f${k}').scrollIntoView({ behavior: 'smooth' })">
        ${one.icon(f.status === "added" ? "file" : f.status === "deleted" ? "x" : "git-diff", `row-icon ${f.status}`)}<div class="main"><div class="title"><span class="changed-path">${esc(f.path)}</span>${counts(f)}</div></div></a>`).join("")}</div>` : one.empty("This commit changes no files.")}
    ${d.files.map((f, k) => file(d, f, k)).join("")}`;
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-split]");
  if (!b) return;
  split = b.dataset.split === "1";
  document.querySelectorAll("[data-split]").forEach((x) => x.classList.toggle("on", x === b));
  data.files.forEach((f, k) => redraw(k));
});

one.render("#page", show, { loading: "Loading commit" });
</script>
