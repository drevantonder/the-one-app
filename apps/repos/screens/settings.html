<div id="page"></div>
<script>
// A repo's Settings, for its owners, as GitHub's: who pushes to it, its labels, and deleting it.
one.title("Settings");

const row = (screen, icon, title) => `<a class="row plain" onclick="${go(screen, { repo: P.repo })}">${one.icon(icon, "row-icon")}<div class="main"><div class="title"><span>${title}</span></div></div><div class="chev">›</div></a>`;

async function show() {
  const d = await one.call("issues", { repo: P.repo, page: 0 });
  const top = repoTabs({ ...d, repo: P.repo }, "settings");
  if (!d.yours) return top + one.empty(`Only the owners of ${esc(P.repo)} change its settings.`);
  return `${top}<div class="list">${row("collaborators", "users", "Collaborators")}${row("labels", "tag", "Labels")}</div>
    <h2 class="section">Danger Zone</h2>
    <div class="list"><a class="row plain danger-row" onclick="retire()">Delete Repository</a></div><div id="ask"></div>`;
}

async function retire() {
  await one.confirm("#ask", {
    title: `Delete ${P.repo}?`, detail: "No one can clone or push to it. You can restore it from Recently Deleted.", action: "Delete", danger: true,
    run: async () => {
      await one.call("delete", { repo: P.repo, confirm: true });
      one.open("repo", { repo: P.repo });
    },
  });
}

const draw = () => one.render("#page", show, { loading: "Loading" });
one.on("changed", draw);
draw();
</script>
