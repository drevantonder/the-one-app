<div id="top"></div>
<div id="page"></div>
<script>
// A repo's labels, as GitHub's Labels page: each with its colour, description and open issues; those who push to the
// repo make, change and delete them.
one.title("Labels");
let labels = [], push = false;

function row(l) {
  const open = l.open_issues ? `<span class="note">${plural(l.open_issues, "open issue", "open issues")}</span>` : "";
  return `<${push ? `a class="row plain label-row" data-name="${esc(l.name)}"` : 'div class="row plain label-row"'}>
    <div class="main"><div class="title"><span>${labelChip(l)}</span></div>${l.description ? `<div class="sub">${esc(l.description)}</div>` : ""}</div>
    ${open}${push ? '<div class="chev">›</div>' : ""}
  </${push ? "a" : "div"}>`;
}

function show() {
  if (!labels.length) return one.empty("No labels yet.", push ? { label: "New Label", run: () => edit() } : undefined);
  return (push ? `<div class="issues-bar"><span class="grow"></span><button class="button primary" data-new>New Label</button></div>` : "")
    + `<div class="list">${labels.map(row).join("")}</div>`;
}

const load = async () => {
  // Whether the caller pushes to the repo, which decides who manages its labels, comes with its issues.
  const [ls, is] = await Promise.all([one.call("labels", { repo: P.repo }), one.call("issues", { repo: P.repo, page: 0 })]);
  labels = ls;
  push = is.push;
  document.getElementById("top").innerHTML = repoTabs({ ...is, repo: P.repo }, "issues");
  return show();
};
const draw = () => one.render("#page", load, { loading: "Loading labels" });

// A label to make, or `l` to change: its name, colour and description; Delete for one that's there.
function edit(l) {
  const sheet = one.sheet({ title: l ? "Edit Label" : "New Label", done: "Cancel" });
  const color = l?.color || ["d73a4a", "0075ca", "a2eeef", "7057ff", "008672", "e4e669", "d876e3", "fbca04"][Math.floor(Math.random() * 8)];
  sheet.body.innerHTML = `<div class="list">
      <label class="row plain"><input class="field" id="l-name" placeholder="Name" aria-label="Name" maxlength="50" value="${esc(l?.name || "")}"></label>
      <label class="row plain"><input class="field" id="l-desc" placeholder="Description (optional)" aria-label="Description" maxlength="100" value="${esc(l?.description || "")}"></label>
      <div class="row plain color-field"><input type="color" id="l-color" aria-label="Colour" value="#${esc(color)}"><span id="l-preview"></span></div>
    </div>
    <div class="form-error" id="l-error"></div>
    <div class="composer-buttons">${l ? '<button class="button plain" id="l-delete" style="color:var(--danger)">Delete</button><span style="flex:1"></span>' : ""}<button class="button primary" id="l-save">${l ? "Save" : "Create Label"}</button></div>
    <div id="l-ask"></div>`;
  const $ = (id) => sheet.body.querySelector(id);
  const preview = () => ($("#l-preview").innerHTML = labelChip({ name: $("#l-name").value || "Label preview", color: $("#l-color").value.slice(1) }));
  $("#l-name").oninput = $("#l-color").oninput = preview;
  preview();
  const fail = (err) => ($("#l-error").innerHTML = one.problem({ title: one.plain(err).title }));
  $("#l-save").onclick = async (e) => {
    const name = $("#l-name").value.trim();
    if (!name) return $("#l-name").focus();
    const back = one.busy(e.target);
    try {
      await one.call("set_label", { repo: P.repo, name: l ? l.name : name, ...(l && name !== l.name ? { new_name: name } : {}), color: $("#l-color").value.slice(1), description: $("#l-desc").value.trim() });
      sheet.close();
      draw();
    } catch (err) {
      back();
      fail(err);
    }
  };
  if (l) $("#l-delete").onclick = () => one.confirm($("#l-ask"), {
    title: `Delete ${l.name}?`, detail: l.open_issues ? `It comes off the ${plural(l.open_issues, "open issue", "open issues")} that have it, and closed ones.` : "It comes off every issue that has it.", action: "Delete", danger: true,
    run: async () => {
      await one.call("delete_label", { repo: P.repo, name: l.name, confirm: true });
      sheet.close();
      draw();
    },
  });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest?.("#page [data-new], #page [data-name]");
  if (t) edit(labels.find((l) => l.name === t.dataset.name));
});
one.on("changed", draw);
draw();
</script>
