<div id="page"></div>
<script>
const at = P.path || "";
one.title(at ? at.split("/").pop() : P.repo.split("/").pop());

const icons = { tree: "folder", blob: "file", commit: "folder-dashed" };
// Each row's last commit, as last fetched: kept across redraws, so the columns don't blank while it's fetched again.
let latest = {};
const lastCommit = (d, c) => (c ? `<a onclick="event.stopPropagation();${go("commit", { repo: d.repo, sha: c.sha })}">${esc(c.subject)}</a>` : "");

function entry(d, e) {
  const path = (at ? at + "/" : "") + e.name;
  const open = e.type === "tree" ? go("repo", { repo: d.repo, ref: refOf(d), path }) : e.type === "blob" ? go("file", { repo: d.repo, ref: refOf(d), path }) : "";
  return `<a class="row plain entry ${e.type}" data-name="${esc(e.name)}" onclick="${open}">
    ${one.icon(icons[e.type], "entry-icon")}
    <span class="entry-name">${esc(e.name)}${e.type === "commit" ? ` <span class="muted">@ ${short(e.sha)}</span>` : ""}</span>
    <span class="entry-commit">${lastCommit(d, latest[e.name])}</span><span class="entry-when">${latest[e.name] ? esc(ago(latest[e.name].time, { long: true })) : ""}</span>
  </a>`;
}

// GitHub's README card; MDX's import and export lines, and lines that are only a component, are left out.
function readme(d) {
  if (!d.readme) return "";
  let text = d.readme.text;
  if (/\.mdx$/i.test(d.readme.name)) text = text.split("\n").filter((l) => !/^\s*(import|export)\s/.test(l) && !/^\s*<\/?[A-Z][\w.]*[^>]*\/?>\s*$/.test(l)).join("\n");
  const base = at ? at + "/" : "";
  const body = /\.(md|mdx|markdown)$/i.test(d.readme.name)
    ? one.markdown(text, {
        link: (href) => {
          const p = new URL(href, "file:///" + base).pathname.slice(1).replace(/\/$/, "");
          const path = decodeURIComponent(p);
          return `one.open(${/\.[\w]+$/.test(path) ? '"file"' : '"repo"'}, ${JSON.stringify({ repo: d.repo, ref: refOf(d), path })})`;
        },
      })
    : `<pre class="plain-readme">${esc(text)}</pre>`;
  return `<div class="readme" id="readme"><div class="readme-head">${one.icon("book")}<span>${esc(d.readme.name)}</span></div><div class="readme-body">${body}</div></div>`;
}

function head(d) {
  if (at) return repoTabs(d, "code");
  const clone = `git clone ${d.clone || address(d.repo)}`;
  const row = (screen, icon, title, note = "") => `<a class="row plain" onclick="${go(screen, { repo: d.repo })}">${one.icon(icon, "row-icon")}<div class="main"><div class="title"><span>${title}</span><span class="when">${note}</span></div></div><div class="chev">›</div></a>`;
  // On phones, the GitHub app's rows for what wide windows have as tabs.
  const rows = d.deleted ? "" : `<div class="list repo-links phone-only">${row("issues", "record", "Issues", d.open_issues ? d.open_issues.toLocaleString() : "")}${d.yours ? row("settings", "gear", "Settings") : ""}</div>`;
  const box = d.deleted ? "" : `<div class="clone"><code>${esc(clone)}</code>${one.copyButton(clone)}</div>${d.clone ? "" : `<p class="clone-where">${where}</p>`}`;
  return `${d.deleted ? "" : repoTabs(d, "code")}<div class="repo-head">
      <div class="repo-title${d.deleted ? "" : " phone-only"}"><span class="repo-icon">${one.icon("book")}</span><div>
        <div class="repo-owner">${esc(d.owner.name)}</div><h1>${esc(d.name)}</h1></div></div>
      ${d.from ? `<div class="muted small">Forked from <a onclick="${go("repo", { repo: d.from })}">${esc(d.from)}</a></div>` : ""}
      ${box}${rows}
    </div>`;
}

// A few names say more than a count; more than a few, the Branches screen lists them.
const few = (names) => (names.length <= 3 ? esc(names.join(", ")) : "");

function more(d) {
  if (at || d.empty) return "";
  return `<div class="list repo-links">
      <a class="row plain" onclick="${go("branches", { repo: d.repo })}">${one.icon("git-branch", "row-icon")}<div class="main"><div class="title"><span>Branches</span><span class="when">${few(d.branches)}</span></div></div><div class="chev">›</div></a>
      ${(d.forks || []).map((f) => `<a class="row plain" onclick="${go("repo", { repo: f })}">${one.icon("git-branch", "row-icon")}<div class="main"><div class="title"><span>Fork</span><span class="when">${esc(f)}</span></div></div><div class="chev">›</div></a>`).join("")}
      <a class="row plain" onclick="${go("history", { repo: d.repo, ref: refOf(d) })}">${one.icon("clock-counter-clockwise", "row-icon")}<div class="main"><div class="title"><span>Commits</span></div></div><div class="chev">›</div></a>
    </div>`;
}

// A deleted repo's owners erase it here; a repo that's there is deleted from its Settings.
function danger(d) {
  if (!d.deleted || !d.yours) return "";
  return `<div class="list danger-list"><a class="row plain danger-row" onclick="retire()">Erase Repository</a></div><div id="ask"></div>`;
}

async function retire() {
  document.getElementById("ask").scrollIntoView({ behavior: "smooth", block: "center" });
  await one.confirm("#ask", {
    title: `Erase ${P.repo} for good?`, detail: "Its branches and history are gone, and its name is free again.", action: "Erase", danger: true,
    run: async () => {
      await one.call("erase", { repo: P.repo, confirm: true });
      history.back();
    },
  });
}

async function restore(button) {
  button.disabled = true;
  button.innerHTML = '<span class="spinner small" aria-hidden="true"></span>Restore';
  await one.call("restore", { repo: P.repo }).catch(() => ((button.disabled = false), (button.textContent = "Restore")));
}

async function show() {
  const [d] = await Promise.all([one.call("tree", { repo: P.repo, ref: P.ref, path: at }), based]);
  if (d.deleted)
    return head(d) + `<div class="deleted-note muted">Deleted ${esc(ago(d.deleted.time, { long: true }))}</div>`
      + (d.yours ? '<button class="button capsule" onclick="restore(this)">Restore</button>' : "") + danger(d);
  if (d.file) return one.open("file", { repo: d.repo, ref: refOf(d), path: at });
  if (d.empty)
    return head(d) + one.empty(d.push ? `No code yet. ${where}, push some:<br><code>git push ${esc(address(d.repo))} main</code>` : "No code yet.") + danger(d);
  const list = d.entries.length
    ? `<div class="list files">${at ? `<a class="row plain entry up" onclick="${go("repo", { repo: d.repo, ref: refOf(d), path: at.split("/").slice(0, -1).join("/") })}">${one.icon("folder", "entry-icon")}<span class="entry-name">..</span></a>` : ""}${d.entries.map((e) => entry(d, e)).join("")}</div>`
    : one.empty("This folder is empty.");
  setTimeout(() => wide() && fill(d), 0);
  return `${head(d)}${pathBar(d)}<div class="code-box">${commitCard(d.latest, d)}${list}</div>${readme(d)}${more(d)}${danger(d)}`;
}

// Each row's last commit, on windows wide enough to show it.
async function fill(d) {
  try {
    latest = await one.call("latest", { repo: d.repo, ref: refOf(d), path: at });
  } catch {
    return;
  }
  for (const row of document.querySelectorAll(".entry[data-name]")) {
    const c = latest[row.dataset.name];
    row.querySelector(".entry-commit").innerHTML = lastCommit(d, c);
    row.querySelector(".entry-when").textContent = c ? ago(c.time, { long: true }) : "";
  }
}

const draw = () => one.render("#page", show, { loading: "Loading files" });
one.on("changed", draw);
draw();
</script>
