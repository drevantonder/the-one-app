<div id="page"></div>
<script>
one.title("Branches");

function row(b) {
  return `<a class="row plain branch-row" onclick="${go("repo", { repo: P.repo, ref: b.branch, path: P.path || "" })}">
    ${one.icon("git-branch", "row-icon")}
    <div class="main">
      <div class="title"><span class="branch-name">${esc(b.branch)}${b.branch === "main" ? ' <span class="badge">Default</span>' : ""}</span><span class="when">${ago(b.time)}</span></div>
      <div class="sub">${b.subject ? `${esc(b.subject)} · ${esc(b.author)}` : `<code>${short(b.head)}</code> · ${esc(b.pushed_by)}`}</div>
    </div>
    <div class="chev">›</div>
  </a>`;
}

async function show() {
  const [all] = await Promise.all([one.call("branches", { repo: P.repo }), based]);
  if (!all.length) return one.empty(`No branches yet. ${where}, push one:<br><code>git push ${esc(address(P.repo))} main</code>`);
  const sorted = all.sort((a, b) => (b.branch === "main") - (a.branch === "main") || Date.parse(b.time) - Date.parse(a.time));
  return `<h2 class="section">Branches</h2><div class="list">${sorted.map(row).join("")}</div>`;
}

const draw = () => one.render("#page", show, { loading: "Loading branches" });
one.on("changed", draw);
draw();
</script>
