[package]
name = "stream"
description = "WebRTC's sender: a screen as live video to one viewer, with what they do on it back over a data channel."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "stream"
test = false
doctest = false

[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# WebRTC, Sans I/O, with Rust's own crypto, so it builds for every kind of machine with no OpenSSL.
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
# TURN over TCP, which str0m leaves to whoever uses it.
turn-client-proto = "0.8"
# H.264 for a display's screen: Cisco's OpenH264, built from its source.
openh264 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A Linux display's screen (X11): its pictures, with its pointer, and what the viewer does played on it through XTest.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr", "xfixes", "xtest"] }

# An iOS Simulator's screen: idb's companion, over its gRPC, for its own H.264 and its touches and keys. A Mac's own:
# ScreenCaptureKit's pictures, and Quartz's events for what the viewer does.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
screencapturekit = "11"
prost = "0.14"
tokio = { workspace = true }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
