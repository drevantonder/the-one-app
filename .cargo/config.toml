# A macOS library records where it was built as its install name unless it's given one, and zig's linker hashes the
# debug information of C code, which names the folder, into its UUID. So the same commit built in two folders is two
# different libraries. A NIF is loaded by path, so any name does.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-install_name,@rpath/nif.so"]

[env]
CFLAGS_aarch64_apple_darwin = "-g0"
# ICU4X's compiled data, for English only (`en` and its regional variants), where its crates' own have every locale's,
# ~10 MB in each binary: a strict app's Intl falls back to English for any other. Made with ICU4X's datagen at the
# version Cargo.lock has: `icu4x-datagen --markers all --locales en --format baked --out clients/app/strict/icu4x`.
ICU4X_DATA_DIR = { value = "clients/app/strict/icu4x", relative = true }

# Windows builds carry the C runtime in them, so `one` and a NIF need nothing a PC may not have installed: Windows
# has the Universal CRT, and not the Visual C++ runtime unless something installed it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/ignore:4099"]
