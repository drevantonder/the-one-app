# App databases record each write as a changeset (src/database/stored.rs), with SQLite's session extension. rusqlite's `session`
# feature would build its bindings with bindgen, which needs libclang on every machine that builds; the bundled SQLite
# built with these instead, and the few functions declared in src/database/stored.rs, need nothing more.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_SESSION -DSQLITE_ENABLE_PREUPDATE_HOOK"

# Every worktree has its own target/ (a shared one would break `target/debug/one-dev throwaway` in each), so each would
# compile every dependency again: sccache keeps one copy of each compiled crate, shared by all of them, except the crates
# that include a file their build script wrote (`env!("OUT_DIR")`, a path in target/, which sccache hashes: serde, thiserror,
# libsqlite3-sys...) and every crate built on those, about 40 of 310, which compile once per worktree. A fresh worktree
# gets the other 270 from the cache. A CARGO_TARGET_DIR set in the shell makes every crate miss, as sccache
# hashes the CARGO_* variables it sees. src/build.rs's cargo() finds it for a shell without it on its PATH.
[build]
rustc-wrapper = "sccache"
