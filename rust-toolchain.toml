# rustup installs this on first use, on every machine that builds: the WebAssembly target for the Cloudflare node and the
# web client, and the targets the Mac, iPhone, Android and Windows apps are built or checked for (tests/tree.rs).
[toolchain]
channel = "1.99.1"
profile = "minimal"
targets = [
  "wasm32-unknown-unknown",
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "x86_64-pc-windows-gnu",
]
