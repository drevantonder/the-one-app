# Devices, as every build has them, WebAssembly too: their tools' specs, what their routes say, the recovery key's
# commands and how loaded a machine is (a computer's only). What serves them is the runtime's (runtime/).
[package]
name = "devices"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
api = { path = "../api" }
scope = { path = "../scope" }
key = { path = "../key" }
custom-build = { path = "../custom-build" }
anyhow = "1"
data-encoding = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# How loaded a computer is (`load`): its disks, read the way each OS says.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
platform = { path = "../platform", features = ["machine"] }
