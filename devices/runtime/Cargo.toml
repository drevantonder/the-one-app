# What the app runtime does for Devices: serving their tools, erasing what this device keeps and who holds the
# recovery key, through `api::AppRuntime`.
[package]
name = "devices-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
devices = { path = ".." }
api = { path = "../../api" }
scope = { path = "../../scope" }
database = { path = "../../database" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
axum = "0.8"
serde_json = "1"
tracing = "0.1"
