# Keys as devices hold them: endpoint keys, epochs, sealing and signing.
[package]
name = "key"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
custom-build = { path = "../custom-build" }
anyhow = "1"
aes-gcm = "0.10"
curve25519-dalek = "4.1"
data-encoding = "2"
ed25519-dalek = "3"
hkdf = "0.13"
rand = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
