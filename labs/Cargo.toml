# Labs, as every build has it, WebAssembly too: which of the network's labs are on. It has no runtime half: the setting
# a lab's switch writes is `scope`'s rule (scope::rules::valid_setting).
[package]
name = "labs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
serde_json = "1"
