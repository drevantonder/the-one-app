[package]
name = "sqlite"
description = "SQLite for plugins on a server: something they import, and no part of One Core."
version.workspace = true
edition.workspace = true
license.workspace = true

# An add-on has no tests of its own: it's only whole inside the VM that loads it, where the server's tests use it.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
rustler = "0.39"
