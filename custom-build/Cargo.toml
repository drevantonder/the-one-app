# What a custom build is: config.toml's constants, its programs' names, and what its machines say to each other.
[package]
name = "custom-build"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[build-dependencies]
toml = "0.9"
