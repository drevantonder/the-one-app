[package]
name = "one-serverless"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
data-encoding = "2"
one = { path = ".." }
serde_json = "1"
# The SQLite rusqlite builds into WebAssembly (src/db.rs on Workers) gets its clock and randomness from JavaScript.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
# The node's Rust runs in the Worker as WebAssembly, reading and writing the bucket through the Worker's own fetch:
# wasm-bindgen is how it and the Worker's JavaScript (worker.js) call each other, js-sys and wasm-bindgen-futures how
# it awaits a promise.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
