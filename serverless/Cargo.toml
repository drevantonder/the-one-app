[package]
name = "one-serverless"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
blake3 = "1"
data-encoding = "2"
one = { path = ".." }
serde_json = "1"
# The SQLite rusqlite builds into WebAssembly (src/db.rs on Workers) gets its clock and randomness from JavaScript.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
# The node's Rust runs in the Worker as WebAssembly, reading and writing the bucket through the Worker's own fetch:
# wasm-bindgen is how it and the Worker's JavaScript (worker.js) call each other, js-sys and wasm-bindgen-futures how
# it awaits a promise.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# It's an iroh endpoint as every node is (src/net.rs), with no socket: its only transport is a custom one, the relay
# handing it datagrams by RPC. Pinned to the nodes' and relay's iroh, as custom transports are unstable between versions.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "=1.4.1", default-features = false, features = ["key", "relay"] }
n0-future = "0.3"
n0-watcher = "1"
noq-udp = "1.4"
# iroh's randomness, from the Worker's crypto.getRandomValues, for each version of getrandom it builds.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
