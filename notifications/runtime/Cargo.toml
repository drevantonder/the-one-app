# What the app runtime does for Notifications: sealing a note to each of a user's devices and handing them to the
# notifications Worker, and asking it which of them get notifications, through `api::AppRuntime`.
[package]
name = "notifications-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
notifications = { path = ".." }
api = { path = "../../api" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
data-encoding = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
platform = { path = "../../platform", features = ["machine"] }
ureq = { version = "3", features = ["json"] }
