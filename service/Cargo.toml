# What every service in Rust (apps/<name>/service/) is built on: registering with its oned, long-polling for calls
# and answering them, as WhatsApp's service does in Go.
[package]
name = "one-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
