[package]
name = "cli"
description = "The CLI and MCP, on One Core in a client, with the native code of the apps the One App ships with."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
client = { path = "../../core/client" }
data-encoding = "2"
dirs = "7"
# Each build's signature, by the platform's key (`serving`).
ed25519-dalek = "3"
flate2 = "1"
reqwest = { version = "0.13", default-features = false }
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
# Ctrl+C cancels the call it's waiting on.
tokio = { workspace = true, features = ["signal"] }

# The native code of the apps it ships with, which is never deployed (`client::files`).
backups_client = { path = "../../apps/backups/client/native" }
encryption_client = { path = "../../apps/encryption/client/native" }
git_repos_client = { path = "../../apps/git-repos/client/native" }

# Who's running this, and their login shell, and how many files the server it runs may open (`serving`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rlimit = "0.11"

# How Windows keeps a server running (`serving`): the job object it's held in, its log, the pipe it says it's
# running on, and its time zone's IANA name.
[target.'cfg(windows)'.dependencies]
jiff = "0.2"
tokio = { workspace = true, features = ["net"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects"] }

# Built into the app, with its window: which build of `one` an update takes (`serving`).
[features]
window = []
