<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- What an app's page may load and reach, as its own page's (`core/edge/mcp/mcp.ts`): what's at this address, and
       nothing it can send anywhere else; the renderer is WebAssembly, and the import map the page's modules are
       resolved by is written here (renderer.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'none'">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: Canvas; color-scheme: light dark; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    /* What a screen reader reads, where each part is drawn, see-through to the pointer (semantics.js). */
    #semantics { position: absolute; inset: 0; pointer-events: none; color: transparent; }
    #semantics * { pointer-events: none; }
    /* The real field typed through (text-input.js) shows nothing of its own, its selection neither, as Flutter web's. */
    .field::selection { background: transparent; color: transparent; }
  </style>
  <!-- From its opaque origin, this address is another: the renderer it imports is found beside it once it's a CORS
       request. -->
  <!-- The renderer, which is most of what the frame loads, fetched from the start (renderer.js compiles it). -->
  <link rel="preload" href="web_renderer_bg.wasm" as="fetch" crossorigin>
  <script src="renderer.js" crossorigin></script>
</head>
<body>
  <canvas tabindex="0" aria-hidden="true"></canvas>
  <div id="semantics"></div>
</body>
</html>
