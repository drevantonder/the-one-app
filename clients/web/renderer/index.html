<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- What an app's page may load and reach, as its own page's (`core/edge/mcp/mcp.ts`): what's at this address, and
       nothing it can send anywhere else; the renderer is WebAssembly, the import map the page's modules are
       resolved by is written here, and a frame's page runs in a frame of its own from here (renderer.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self'; base-uri 'none'">
  <!-- From its opaque origin, this address is another: the renderer it imports is found beside it once it's a CORS
       request. -->
  <!-- The renderer, which is most of what the frame loads, fetched from the start (renderer.js compiles it). -->
  <link rel="preload" href="web_renderer_bg.wasm" as="fetch" crossorigin>
  <script src="renderer.js" crossorigin></script>
</head>
<!-- What it draws on, the canvas and what a screen reader reads, renderer.js makes. -->
</html>
