[package]
name = "strict"
description = "A strict app drawn natively on a computer: its JS run in QuickJS, the ops it sends laid out by Taffy and drawn by our own renderer, copied from GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# The GPU, as GPUI drew with it before it moved to wgpu: Vulkan on Linux, Windows and Android, Metal on a Mac. From its
# repo at a commit: crates.io's 0.9 refuses a GPU without VK_EXT_inline_uniform_block (many phones' and some laptops'),
# where this falls back to uniform buffers.
blade-graphics = { git = "https://github.com/kvark/blade", rev = "3d86d537fe100a06a091850253f692e7ca8bceaf" }
blade-macros = { git = "https://github.com/kvark/blade", rev = "3d86d537fe100a06a091850253f692e7ca8bceaf" }
blade-util = { git = "https://github.com/kvark/blade", rev = "3d86d537fe100a06a091850253f692e7ca8bceaf" }
bytemuck = { version = "1", features = ["derive"] }
data-encoding = "2"
# Where glyphs and images are packed into the atlas's textures.
etagere = "0.2"
# Images a page shows, and the inspector's `snap`, a PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
parking_lot = "0.12"
raw-window-handle = "0.6"
resvg = { version = "0.47", default-features = false }
# QuickJS, with its module loader: a page's module imports the UI library's. Its async runtime runs what the Web APIs
# below answer with a promise.
rquickjs = { version = "0.14", features = ["loader", "futures"] }
# The Web APIs a strict app's JS has, the WinterTC Minimum Common API's, as AWS's LLRT implements them on rquickjs, from
# its repo at a release (v0.10.0-beta): crates.io has only a release on an older rquickjs.
llrt_buffer = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_crypto = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_exceptions = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_stream_web = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_url = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_util = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_utils = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076", default-features = false }
futures-lite = "2"
# The host's language and time zone, which the sandbox's JS formats in.
sys-locale = "0.3"
iana-time-zone = "0.1"
# Intl, as ECMA-402 says (intl.rs, intl.js), formatted by ICU4X with the data for every locale built in, as Boa formats
# it: its experimental crate formats currencies, percentages and relative times, its `unstable` field bag mirrors
# ECMA-402's date options, and each time zone's rules are jiff's.
icu = { version = "2.4", features = ["compiled_data", "unstable"] }
icu_datetime = { version = "2.4", features = ["unstable_jiff_0_2"] }
icu_experimental = { version = "0.7", features = ["compiled_data"] }
icu_provider = "2.4"
fixed_decimal = { version = "0.7", features = ["ryu"] }
tinystr = "0.8"
writeable = "0.6"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
taffy = "0.15"
unicode-linebreak = "0.1"
url = "2"
# The typeface the UI library ships as WOFF2 (core/ui/src/Allo-Variable.woff2), which the text systems read as TTF.
wuff = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The windows' thread's event loop, as GPUI's Linux platform has it.
calloop = "0.14"
cosmic-text = "0.19"
# The desktop's light or dark, from its portal, through libdbus, as tao reads the desktop.
dbus = "0.9"
swash = "0.2"
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xkb", "cursor", "resource_manager"] }
xkbcommon = { version = "0.8", default-features = false, features = ["x11"] }
