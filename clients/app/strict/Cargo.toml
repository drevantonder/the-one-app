[package]
name = "strict"
description = "A strict app drawn natively on a computer: its JS run in QuickJS, the ops it sends drawn with GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true

# Zed's GPUI, from Zed's repo at a commit, as every app built on GPUI takes it: the release on crates.io is a year
# behind and has no headless rendering. `headless` draws a window offscreen to a PNG (`examples/screenshot.rs`), with
# GPUI's own headless context, which is test support.
[features]
headless = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu"]

[dependencies]
anyhow.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "1043f4a86ab911a381d9bfe45cf6b36d3cdcc89a" }
# A Linux window is X11's or Wayland's, whichever the desktop is: GPUI builds neither unless asked.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1043f4a86ab911a381d9bfe45cf6b36d3cdcc89a", features = ["x11", "wayland"] }
# QuickJS, with its module loader: a page's module imports the UI library's. Its async runtime runs what the Web APIs
# below answer with a promise.
rquickjs = { version = "0.14", features = ["loader", "futures"] }
# The Web APIs a strict app's JS has, the WinterTC Minimum Common API's, as AWS's LLRT implements them on rquickjs, from
# its repo at a release (v0.10.0-beta): crates.io has only a release on an older rquickjs.
llrt_buffer = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_crypto = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_exceptions = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_stream_web = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_url = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_util = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_utils = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076", default-features = false }
futures-lite = "2"
# The host's language, which the sandbox's JS formats in.
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
url = "2"
# The typeface the UI library ships as WOFF2 (core/ui/src/Allo-Variable.woff2), which GPUI's text systems read as TTF.
wuff = "0.2"
data-encoding = "2"
# The inspector's `snap`, a PNG.
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# The inspector's `snap` of a window on X11, read back from the X server: GPUI reads back only a headless window.
x11rb = "0.13"
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "1043f4a86ab911a381d9bfe45cf6b36d3cdcc89a", optional = true }

[[example]]
name = "screenshot"
required-features = ["headless"]
