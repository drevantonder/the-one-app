[package]
name = "strict"
description = "A strict app drawn natively on a computer: its JS run in QuickJS, the ops it sends laid out by Taffy and drawn by our own renderer, copied from GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
data-encoding = "2"
# Where glyphs and images are packed into the atlas's textures.
etagere = "0.2"
# Images a page shows, and the inspector's `snap`, a PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"
parking_lot = "0.12"
raw-window-handle = "0.6"
resvg = { version = "0.47", default-features = false }
# QuickJS, with its module loader: a page's module imports the UI library's. Its async runtime runs what the Web APIs
# below answer with a promise.
rquickjs = { version = "0.14", features = ["loader", "futures"] }
# The Web APIs a strict app's JS has, the WinterTC Minimum Common API's, as AWS's LLRT implements them on rquickjs, from
# its repo at a release (v0.10.0-beta): crates.io has only a release on an older rquickjs.
llrt_buffer = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_crypto = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_exceptions = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_stream_web = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_url = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_util = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_utils = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076", default-features = false }
futures-lite = "2"
# The host's language and time zone, which the sandbox's JS formats in.
sys-locale = "0.3"
iana-time-zone = "0.1"
# Intl, as ECMA-402 says (intl.rs, intl.js), formatted by ICU4X with the data for every locale built in, as Boa formats
# it: its experimental crate formats currencies, percentages and relative times, its `unstable` field bag mirrors
# ECMA-402's date options, and each time zone's rules are jiff's.
icu = { version = "2.4", features = ["compiled_data", "unstable"] }
icu_datetime = { version = "2.4", features = ["unstable_jiff_0_2"] }
icu_experimental = { version = "0.7", features = ["compiled_data"] }
icu_provider = "2.4"
fixed_decimal = { version = "0.7", features = ["ryu"] }
tinystr = "0.8"
writeable = "0.6"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
taffy = "0.15"
unicode-linebreak = "0.1"
# Graphemes and words, which a caret steps and a double click selects by (`editing`).
unicode-segmentation = "1"
url = "2"
# The typeface the UI library ships as WOFF2 (core/ui/src/Allo-Variable.woff2), which the text systems read as TTF.
wuff = "0.2"

# The GPU, as GPUI drew with it before it moved to wgpu: Vulkan on Linux and Android, Metal on a Mac (Windows draws with
# Direct3D 11, as GPUI does there). From its repo at a commit: crates.io's 0.9 refuses a GPU without
# VK_EXT_inline_uniform_block (many phones' and some laptops'), where this falls back to uniform buffers.
[target.'cfg(not(target_os = "windows"))'.dependencies]
blade-graphics = { git = "https://github.com/kvark/blade", rev = "3d86d537fe100a06a091850253f692e7ca8bceaf" }
blade-macros = { git = "https://github.com/kvark/blade", rev = "3d86d537fe100a06a091850253f692e7ca8bceaf" }
blade-util = { git = "https://github.com/kvark/blade", rev = "3d86d537fe100a06a091850253f692e7ca8bceaf" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The windows' thread's event loop, as GPUI's Linux platform has it; a Mac's wakes it from AppKit's main thread.
calloop = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
cosmic-text = "0.19"
# The desktop's light or dark, from its portal, through libdbus, as tao reads the desktop.
dbus = "0.9"
swash = "0.2"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xkb", "cursor", "resource_manager"] }
# The input method (ibus, fcitx: Chinese, Japanese, Korean), through XIM over x11rb, as GPUI's X11 platform has it,
# but xim-rs's own release, whose compound text decodes Chinese and Korean, where GPUI's fork's has only Japanese.
xim = { version = "0.6", features = ["x11rb-xcb", "x11rb-client"] }
# The clipboard and the primary selection, on a connection and thread of their own, as arboard serves them; GPUI's
# X11 clipboard is adapted from it.
arboard = { version = "3", default-features = false }
xkbcommon = { version = "0.8", default-features = false, features = ["x11"] }

# Windows' windows, Direct3D 11, DirectComposition and DirectWrite, as GPUI's Windows platform has them.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-numerics = "0.3"
# The clipboard, as arboard serves it, as on Linux.
arboard = { version = "3", default-features = false }
# Which way a line runs, by its first strong character, as cosmic-text says it on Linux.
unicode-bidi = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Text as GPUI's Mac platform shapes and rasterizes it: Core Text and Core Graphics.
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21"
# AppKit's windows, on its main thread, by objc2's bindings, as Blade reaches Metal.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "NSAccessibility", "NSAppearance", "NSApplication", "NSCursor", "NSPasteboard", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSText", "NSTextInputClient", "NSTextInputContext", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSAttributedString", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSRange", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CALayer", "CAMetalLayer"] }
# Which way a line runs, by its first strong character, as on Windows.
unicode-bidi = "0.3"
