[package]
name = "app"
description = "The app: a window on One Core in a client, and with no window its CLI and MCP."
version.workspace = true
edition.workspace = true
license.workspace = true

# A phone starts the app from this library, and a computer from the program.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one"
path = "src/main.rs"

# The window, which is all of the program but its CLI and MCP. A Linux machine with no screen has a build without
# it (`cargo build --no-default-features`), which needs no GTK there. A phone's window is Tauri's; a computer's are
# native, in tao's event loop (`computer`).
[features]
default = ["window"]
# The app on the renderer's fake platform, its native windows drawn offscreen on a thread of their own, for the app
# harness (`tooling/app-harness`), which drives them with the inspector.
fake = ["window", "renderer/fake"]
window = [
  "dep:tauri-build",
  "dep:anyhow",
  "dep:data-encoding",
  "dep:semver",
  "dep:sha2",
  "dep:ed25519-dalek",
  "dep:serde_json",
  "dep:tokio",
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-notifications",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-haptics",
  "dep:tauri-runtime-wry",
  "dep:serde",
  "dep:url",
  "dep:open",
  "dep:dirs",
  "dep:global-hotkey",
  "dep:notify",
  "dep:tray-icon",
  "dep:rfd",
  "dep:encryption_client",
  "dep:notifications_client",
  "dep:computer_use_client",
  "dep:objc2",
  "dep:objc2-core-foundation",
  "dep:objc2-foundation",
  "dep:objc2-ui-kit",
  "dep:gtk",
  "dep:resvg",
  "dep:windows",
  "dep:ico",
  "dep:icns",
  "dep:tao",
  "dep:muda",
  "dep:renderer",
  "cli/window",
]

[build-dependencies]
# A phone's app is Tauri's, which its build script makes ready (a computer's builds it, and doesn't run it).
tauri-build = { version = "2", features = [], optional = true }
# A computer's app's name, which `tauri.conf.json` says (`build.rs`).
serde_json.workspace = true
# The manifest of `one` without its window on Windows (`build.rs`).
embed-manifest = "1"

[dependencies]
anyhow = { workspace = true, optional = true }
# An app's own window, drawn natively (`renderer`): on a computer a window of its own, on a phone one over the page.
renderer = { path = "renderer", optional = true }
cli = { path = "../cli" }
client = { path = "../../core/client" }
data-encoding = { version = "2", optional = true }
# The window's page the network has: its version, the lowest build it runs on, and its files' hashes (`page`).
semver = { version = "1", features = ["serde"], optional = true }
sha2 = { version = "0.11", optional = true }
# Its `update.json`'s signature, by the platform's key (`page`).
ed25519-dalek = { version = "3", optional = true }
serde_json = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
url = { version = "2", optional = true }
# `net`: the local channel each app's own window asks through (`hosts`). `rt-multi-thread`: a computer's app runs its
# client on a runtime of its own (`computer`).
tokio = { workspace = true, features = ["net", "rt-multi-thread"], optional = true }

# The native code of the apps it ships with that only the window uses, beside the CLI's, which is never deployed
# (`client::files`).
encryption_client = { path = "../../apps/encryption/client/native", optional = true }
notifications_client = { path = "../../apps/notifications/client/native", optional = true }
computer_use_client = { path = "../../apps/computer-use/client/native", optional = true }

# A computer's app's event loop, which its native windows open in (`computer`), Tauri's own, at the version Tauri uses.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tao = { version = "0.37", optional = true }
# Opens a web address in the device's own browser, where a passkey works.
open = { version = "5", optional = true }
# Where a computer keeps a user's data and apps (`shortcuts`).
dirs = { version = "7", optional = true }
# The launcher's shortcut, ⌥Space on a Mac (`computer::shortcut`).
global-hotkey = { version = "0.7", optional = true }
# Hears the app's own program replaced by a newer build, as its device's server or `one update` does (`updater`).
notify = { version = "8", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Each app's icon where the device lists it (`shortcuts`), which is an SVG or a PNG, drawn as a PNG of the size it
# wants there.
resvg = { version = "0.47", default-features = false, optional = true }

# Each app's shortcut in Windows' Start menu, made as the shell's own are (`IShellLinkW`), with its own AppUserModelID,
# and its icon file; a window's title bar, with Windows' own caption buttons over the page (`title_bar`); and the
# app's private bytes (`memory`).
[target.'cfg(windows)'.dependencies]
ico = { version = "0.6", optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"], optional = true }

# The ring in a Mac's menu bar and Windows' notification area that summons the launcher (`computer::ring`), and the
# system's alert (`computer::alert`).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = { version = "0.25", optional = true }
rfd = { version = "0.18", default-features = false, optional = true }

# What a computer's app says goes to its own log where nothing it was started from keeps it (`computer::keep_log`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }
# What the system counts as the app's graphics memory (`TASK_VM_INFO`'s ledger), for its memory report (`memory`).
mach2 = "0.6"

# A Mac app's menu bar (`host`, `computer`), and each app's icon as its bundle's .icns (`shortcuts`).
[target.'cfg(target_os = "macos")'.dependencies]
icns = { version = "0.5", default-features = false, optional = true }
muda = { version = "0.20", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Its ring, as a StatusNotifierItem over D-Bus, as KDE's and GNOME's (with its extension) panels show one, Wayland's too.
tray-icon = { version = "0.25", optional = true, default-features = false, features = ["ksni"] }
# The program's name and class, as GTK's windows have them (`computer::launcher`), and GTK's alert (`alert`).
gtk = { version = "0.18", optional = true }

# A push that wakes the phone starts the client without its window (`Java_app_theone_client_Notifications_wake`).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# A phone's app is Tauri's: `custom-protocol` builds it with its page inside it, however it's built. A `one:` link
# opens it at what it links to (`links`): what Spotlight, an App Shortcut or an Android shortcut opens. The opener
# opens the sign-in page in the device's own browser, where a passkey works. An app's haptics (`one/haptic` in
# bridge.js) are an iPhone's; Android's plays them through the web view instead (`MainActivity`), as the plugin's
# Vibrator there doesn't follow the system's Touch feedback.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri = { version = "2", features = ["custom-protocol"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2.6", optional = true }
tauri-plugin-notifications = { version = "0.4", default-features = false, features = ["push-notifications"], optional = true }

[target.'cfg(target_os = "ios")'.dependencies.tauri-plugin-haptics]
version = "2.4"
optional = true

# libc after 0.2.189 has no `in6_ifreq` on iOS, which netdev 0.46, through iroh, uses there.
[target.'cfg(target_os = "ios")'.dependencies]
# Tauri's runtime, whose event loop (tao's) an app's native window is opened in and hears from (`native::Ios`).
tauri-runtime-wry = { version = "2", optional = true }
libc = "=0.2.189"
# A tap on the status bar scrolls the app that's showing to its top (`status_bar`), and a swipe in from the edge
# takes an app home (`edge`).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"], optional = true }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIGeometry", "UIGestureRecognizer", "UIInterface", "UIPanGestureRecognizer", "UIResponder", "UIScreenEdgePanGestureRecognizer", "UIScrollView", "UIView", "UIWindow"], optional = true }
