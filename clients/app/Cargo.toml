[package]
name = "app"
description = "The app: a window on One Core in a client, and with no window its CLI and MCP."
version.workspace = true
edition.workspace = true
license.workspace = true

# A phone starts the app from this library, and a computer from the program.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one"
path = "src/main.rs"

# The window, which is all of the program but its CLI and MCP. A Linux machine with no screen has a build without
# it (`cargo build --no-default-features`), which needs none of GTK or WebKitGTK there.
[features]
default = ["window"]
window = [
  "dep:tauri-build",
  "dep:anyhow",
  "dep:data-encoding",
  "dep:serde_json",
  "dep:tokio",
  "dep:tauri",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-notifications",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-haptics",
  "dep:encryption_client",
  "dep:notifications_client",
  "dep:objc2",
  "dep:objc2-core-foundation",
  "dep:objc2-ui-kit",
  "dep:webkit2gtk",
  "dep:gtk",
  "cli/window",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
# The manifest of `one` without its window on Windows (`build.rs`).
embed-manifest = "1"

[dependencies]
anyhow = { workspace = true, optional = true }
cli = { path = "../cli" }
client = { path = "../../core/client" }
data-encoding = { version = "2", optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
# `custom-protocol` builds the app with its page inside it, however it's built.
tauri = { version = "2", features = ["custom-protocol"], optional = true }
# Opens the sign-in page in the device's own browser, where a passkey works.
tauri-plugin-opener = { version = "2", optional = true }

# The native code of the apps it ships with that only the window uses, beside the CLI's, which is never deployed
# (`client::files`).
encryption_client = { path = "../../apps/encryption/client/native", optional = true }
notifications_client = { path = "../../apps/notifications/client/native", optional = true }

# The notification plugins Notifications' client-side code uses, which Tauri gives the window's page permissions of only
# where the app names them itself (`capabilities/phone.json`).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-notification = { version = "2.8", optional = true }
# The window opens where and as large as it was last, as a computer's apps do.
tauri-plugin-window-state = { version = "2.5", optional = true }
# A `one:` link opens the app at what it links to (`links`): one app, the only one, which a second start with a link
# hands it to.
tauri-plugin-deep-link = { version = "2.6", optional = true }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"], optional = true }

# The web view's own back and forward gestures, which Tauri doesn't switch on (`navigation_gestures`).
# An app's haptics (`one/haptic` in client.js): an iPhone's, and on a computer nothing. Android's plays them through
# the web view instead (`MainActivity`), as this plugin's Vibrator there doesn't follow the system's Touch feedback.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-haptics = { version = "2.4", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"], optional = true }
# Ctrl-Q and Ctrl-W, as a Linux app's window has them (`linux_keys`).
gtk = { version = "0.18", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-notifications = { version = "0.4", default-features = false, features = ["push-notifications"], optional = true }

# libc after 0.2.189 has no `in6_ifreq` on iOS, which netdev 0.46, through iroh, uses there.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
# A tap on the status bar scrolls the app that's showing to its top (`status_bar`).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"], optional = true }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIInterface", "UIResponder", "UIScrollView", "UIView", "UIWindow"], optional = true }
