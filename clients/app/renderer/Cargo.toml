[package]
name = "renderer"
description = "An app drawn natively on a computer: its JS run in QuickJS, the mutations it makes laid out by Taffy and drawn by our own renderer, copied from GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
# How a colour moving to another is mixed: through Oklch, as CSS Color 4 does (Linebender's).
color = "0.3.3"
data-encoding = "2"
# Where glyphs and images are packed into the atlas's textures.
etagere = "0.2"
# The inspector's `snap`, a PNG, and natively the images a page shows, which the browser decodes on the web.
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
parking_lot = "0.12"
raw-window-handle = "0.6"
# Text, the same everywhere (`text`): Parley lays it out (HarfRust shapes it, ICU4X breaks its lines) in fonts fontique
# finds, the system's where `system` is on, which every target but the web has; swash rasterizes its glyphs, and a
# COLRv1 emoji (Android's, Linux's Noto Color Emoji), which swash doesn't draw, skrifa walks the paint graph of and
# tiny-skia (resvg's) rasterizes, as Chrome's Skia does (`text::colr`), at Parley's version of skrifa.
parley = { version = "0.13", default-features = false, features = ["std"] }
skrifa = "0.49"
swash = "0.2"
# Waiting on the GPU, natively, and on the QuickJS sandbox's futures.
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
taffy = "0.15"
# Graphemes and words, which a caret steps and a double click selects by (`editing`).
unicode-segmentation = "1"
url = "2"
# The GPU, by wgpu, as GPUI draws with it: each platform's own backend, named below (Vulkan on Linux and Android, Metal
# on a Mac and an iPhone, Direct3D 12 on Windows), and the WGSL our shaders are written in, which WebGPU runs on the web.
wgpu = { version = "30.0.2", default-features = false, features = ["std", "wgsl"] }
# `Instant`, which is std's, and on the web, where std's has no clock, the browser's `performance.now()`.
web-time = "1"
# The typeface the UI library ships as WOFF2 (core/ui/src/Allo-Variable.woff2), which the text system reads as TTF.
wuff = "0.2"

[dev-dependencies]
# The memory the headless harness's `--measure` says drawing took.
memory-stats = "1"

# What only a native host has: its QuickJS sandbox (`js`), where on the web a page's JS is the browser's own, with its
# own Web APIs and Intl; and what draws a page's pictures (an SVG, its `text` in Allo, `view::svg`, and a JPEG, a GIF
# or a WebP) and a COLRv1 emoji (`text::colr`), which on the web the browser draws.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.47", default-features = false, features = ["text"] }
parley = { version = "0.13", features = ["system"] }
# QuickJS, with its module loader: a page's module imports the UI library's. Its async runtime runs what the Web APIs
# below answer with a promise.
rquickjs = { version = "0.14", features = ["loader", "futures"] }
# The Web APIs an app's JS has, the WinterTC Minimum Common API's, as AWS's LLRT implements them on rquickjs, from
# its repo at a release (v0.10.0-beta): crates.io has only a release on an older rquickjs.
llrt_buffer = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_crypto = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_exceptions = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_stream_web = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_url = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_util = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076" }
llrt_utils = { git = "https://github.com/awslabs/llrt", rev = "b7ccc1487be185ac65fa4355e022bf9eea4df076", default-features = false }
# The host's language and time zone, which the sandbox's JS formats in.
sys-locale = "0.3"
iana-time-zone = "0.1"
# Intl, as ECMA-402 says (intl.rs, intl.js), formatted by ICU4X with the data for English built in, as Boa formats
# it: its experimental crate formats currencies, percentages and relative times, its `unstable` field set builder takes
# ECMA-402's date options, and each time zone's rules are jiff's.
# ICU4X 2.3, the version Parley 0.13 pins: move back to 2.4 (and its field bag in `intl::fields`) once Parley does.
icu = { version = "~2.3", features = ["compiled_data", "unstable"] }
icu_datetime = { version = "~2.3", features = ["unstable_jiff_0_2"] }
icu_experimental = { version = "0.6", features = ["compiled_data"] }
icu_provider = "~2.3"
fixed_decimal = { version = "0.7", features = ["ryu"] }
writeable = "0.6"
jiff = "0.2"
# Its compiled modules' bytecode, kept by their address and source.
sha2 = "0.11"

# The web's: a page's canvas, drawn by wgpu on the browser's WebGPU, in a Worker with an OffscreenCanvas, called by
# the page's JS through wasm-bindgen (`platform/web`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "CanvasRenderingContext2d", "Clipboard", "DomMatrix2dInit", "Headers", "HtmlCanvasElement", "HtmlImageElement", "ImageData", "MediaQueryList", "Navigator", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "Path2d", "TextMetrics", "Response", "Window"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The windows' thread's event loop, as GPUI's Linux platform has it; a Mac's wakes it from AppKit's main thread.
calloop = "0.14"

# A field's menu for text (`text_menu`), as each system shows a menu, as Tauri's muda makes it.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
muda = { version = "0.20", default-features = false, features = ["gtk3"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's light or dark, from its portal, through libdbus, as tao reads the desktop.
dbus = "0.9"
# The display's frames, as its Present extension says each was shown (`Display::frame`).
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xkb", "cursor", "resource_manager", "randr", "present", "dri3"] }
# CLOCK_MONOTONIC, which Present says when a frame was shown on, as Rust's `Instant` is.
libc = "0.2"
# The input method (ibus, fcitx: Chinese, Japanese, Korean), through XIM over x11rb, as GPUI's X11 platform has it,
# but xim-rs's own release, whose compound text decodes Chinese and Korean, where GPUI's fork's has only Japanese.
xim = { version = "0.6", features = ["x11rb-xcb", "x11rb-client"] }
# The clipboard and the primary selection, on a connection and thread of their own, as arboard serves them; GPUI's
# X11 clipboard is adapted from it.
arboard = { version = "3", default-features = false }
xkbcommon = { version = "0.8", default-features = false, features = ["x11"] }
# GTK's picker of files to open (the desktop portal's, where there's one), and the menus muda makes, on the app's GTK
# thread (tao's).
gtk = "0.18"

# Windows' windows, as GPUI's Windows platform has them.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["dx12"] }
# Windows' own picker of files to open (IFileOpenDialog), as rfd shows it.
rfd = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-numerics = "0.3"
# The clipboard, as arboard serves it, as on Linux.
arboard = { version = "3", default-features = false }

# A Mac's and an iPhone's: the GPU, by wgpu on Metal, and the main thread's queue, by objc2's bindings.
[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["metal"] }
# The face Core Text's cascade draws a character in that the fonts before it hadn't (`text::fallback`), as fontique
# itself reaches Core Text.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFString"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFont"] }
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSGeometry", "NSNotification", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "CABase", "CALayer", "CAMetalLayer", "CATransaction"] }
# The display's frames, by a display link (`Display::frame`), as GPUI's Mac platform has them.
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVDisplayLink", "CVReturn"] }

# AppKit's windows, on its main thread.
[target.'cfg(target_os = "macos")'.dependencies]
# A Mac's own picker of files to open (NSOpenPanel), as rfd shows it.
rfd = { version = "0.18", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "NSAccessibility", "NSAppearance", "NSApplication", "NSCursor", "NSPasteboard", "NSEvent", "NSGraphics", "NSPanel", "NSResponder", "NSRunningApplication", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace", "block2"] }

# An iPhone's: a native screen is a tao window over the app's (`platform/ios`), on the main thread. Its QuickJS has
# no prebuilt bindings in rquickjs-sys, so bindgen makes them against the iOS SDK's headers, as Android's.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "objc2-quartz-core", "UIAccessibility", "UIApplication", "UIColor", "UIGeometry", "UIInterface", "UIKeyboardLayoutGuide", "UILayoutGuide", "UIPasteboard", "UIResponder", "UITrackingLayoutGuide", "UITraitCollection", "UIView", "UIViewController", "UIWindow"] }
# Its windows, fingers, safe area and lifecycle: tao's, whose event loop the app (Tauri's) runs; winit can't run
# beside it, as it starts only by calling UIApplicationMain itself.
tao = { version = "0.37", default-features = false }
rquickjs = { version = "0.14", features = ["bindgen"] }
# Its display's frames, by a display link (`Display::frame`).
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CADisplayLink", "CAFrameRateRange"] }

# Android: a native screen is a SurfaceView over the app's web view (`platform/android`), on the UI thread, whose
# keyboard bridge (Flutter's) and accessibility delegate (AccessKit's) are Java that calls in through JNI.
[target.'cfg(target_os = "android")'.dependencies]
# Its Java delegate, prebuilt, loaded from memory: the app needs no Java of AccessKit's.
accesskit = "0.25"
accesskit_android = { version = "0.9.1", features = ["embedded-dex"] }
android_logger = "0.15"
jni = "0.21"
libc = "0.2"
ndk = { version = "0.9", features = ["rwh_06"] }
ndk-sys = "0.6"

[build-dependencies]
# Flutter's text input plugins (flutter/), as its engine builds them: a Mac's Objective-C++, Windows' C++.
cc = "1"
