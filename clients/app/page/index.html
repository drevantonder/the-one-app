<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The One App</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="client.css">
  <script type="module" src="client.js"></script>
</head>
<body>
  <!-- What the window shows of itself, in its middle, over the frames, as the UI library's Steps, Status and Problem
       draw it (core/ui/src/states.tsx): its mark from its first paint and the steps it takes as it opens, until its
       person's home has drawn over them; an update under way; or a problem. -->
  <div id="state" class="ui-state middle">
    <img id="mark" src="Logo.png" alt="">
    <ol id="steps" class="steps" role="status"></ol>
    <div id="status" class="status" role="status" hidden>
      <span class="ui-spinner" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></span>
      <strong>Updating…</strong>
      <p id="status-text"></p>
    </div>
    <div id="problem" class="problem" role="alert" hidden>
      <svg class="ui-icon" viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm-8,56a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm8,104a12,12,0,1,1,12-12A12,12,0,0,1,128,184Z"/></svg>
      <strong id="problem-heading"></strong>
      <p id="problem-text"></p>
      <div id="problem-action" class="action"><button id="retry" class="ui-button press ring" data-variant="outline">Try Again</button></div>
    </div>
  </div>
  <div id="passing">
    <p id="connection" role="status" hidden><span id="connection-spinner" class="ui-spinner" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></span><span id="connection-text"></span></p>
    <div id="update" class="ui-toast" role="status" hidden>
      <p>Update ready</p>
      <button id="reload" class="press ring">Reload</button>
    </div>
  </div>
  <dialog id="recovery" class="ui-dialog sheet" aria-labelledby="recovery-heading">
    <div class="panel">
      <header><h2 id="recovery-heading">Recovery Key</h2></header>
      <form class="body">
        <p class="about shown">Write it down, and keep it off your devices. It approves a new device when no trusted device is left.</p>
        <p class="about typed">Type it as you wrote it down. This device will be trusted.</p>
        <output class="key shown"></output>
        <textarea class="entry typed ui-box ring" rows="3" aria-labelledby="recovery-heading" autocapitalize="characters" autocomplete="off" spellcheck="false"></textarea>
        <p class="wrong" role="alert"></p>
        <button class="typed ui-button press ring" data-variant="default">Approve This Device</button>
        <button class="typed ui-button press ring" data-variant="outline" value="cancel" formnovalidate>Cancel</button>
        <button class="shown ui-button press ring" data-variant="default">Done</button>
      </form>
    </div>
  </dialog>
</body>
</html>
