# What differs on Mac, Windows and Linux: where a device keeps its files, starting and stopping programs, asking URLs.
[package]
name = "platform"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
custom-build = { path = "../custom-build" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[features]
# What only a program on a machine uses: starting and stopping programs (`os`) and asking URLs someone gave (`reach`).
machine = ["dep:tokio", "dep:libc"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["full"], optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
