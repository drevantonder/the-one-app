# Firebase's Android config holds the project's API key, which Google documents as a public identifier that ships in
# every app (firebase.google.com/docs/projects/api-keys): it's restricted to the app's package and signing
# certificates and to the Firebase APIs it needs in Google Cloud, not hidden. Without this, every new
# google-services.json raises a "Google API Key" alert.
paths-ignore:
  - "clients/app/gen/android/app/google-services.json"
