# Builds `one` for a Mac on GitHub's macOS runner, as `tooling/release` asks for it, with the Rust the machine releasing
# has, so what it's built from (`tooling/input-hash`) is what that machine worked out. It's kept as the run's artifact
# `one-macos-aarch64`, gzipped, which `tooling/release` downloads and publishes with the rest.
name: Mac client

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build
        required: true
      rust:
        description: The Rust to build with, as `rustc -V` names it on the machine releasing
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      # Its build is named from the commits that lead to it (`tooling/version`).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust }}
      # The UI library the app has built in, which its build makes with bun (clients/app/build.rs), at mise.toml's.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
      # The workspace's own crates, which cargo builds again in each new checkout, from the last build of the same.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - run: cargo build --release -p app
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
      - run: gzip -9 -c target/release/one >one-macos-aarch64.gz
      - uses: actions/upload-artifact@v4
        with:
          name: one-macos-aarch64
          path: one-macos-aarch64.gz
          retention-days: 7
