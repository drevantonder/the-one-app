# Builds this repo's NIFs and programs for a Mac on GitHub's macOS runner, as `tooling/nifs macos-aarch64` asks for
# them from Linux, with that machine's Rust and the names it worked out for each NIF. The files asked for are kept as
# the run's artifact `nifs`, a tar of them by their paths, which `tooling/nifs` downloads. Each input is as
# `tooling/nifs` gives it.
name: Mac NIFs

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to build
        required: true
      rust:
        description: The Rust to build with, as `rustc -V` names it on the machine asking
        required: true
      builds:
        description: Each NIF's build, NIF_BUILD_<CRATE>=<input hash>, as the machine asking worked them out
        required: true
      files:
        description: The files to keep, by their paths
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      # tooling/nifs is bash 4's, which macOS doesn't have.
      - run: brew install bash
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.rust }}
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # tooling/nifs keeps each build by what it's built from, so a crate that didn't change isn't built again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/the-one-app/nifs
          key: nifs-${{ github.run_id }}
          restore-keys: nifs-
      - run: env $BUILDS tooling/nifs macos-aarch64
        env:
          BUILDS: ${{ inputs.builds }}
      - run: tar -cf nifs.tar $FILES
        env:
          FILES: ${{ inputs.files }}
      - uses: actions/upload-artifact@v4
        with:
          name: nifs
          path: nifs.tar
          retention-days: 7
