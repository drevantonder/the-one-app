# How any database is kept: signed steps in order, copies, and the keys that open them.
[package]
name = "database"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
bucket = { path = "../bucket" }
key = { path = "../key" }
custom-build = { path = "../custom-build" }
anyhow = "1"
blake3 = "1"
data-encoding = "2"
ed25519-dalek = "3"
rand = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
