# What the app runtime does with blobs: keeps them here and in the bucket, sealed with their scope's key, takes from the
# bucket those no scope needs any more, and gives each back to whoever may read it, through `api::AppRuntime`.
[package]
name = "database-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
database = { path = ".." }
api = { path = "../../api" }
scope = { path = "../../scope" }
key = { path = "../../key" }
bucket = { path = "../../bucket", features = ["machine"] }
custom-build = { path = "../../custom-build" }
anyhow = "1"
axum = "0.8"
blake3 = "1"
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
