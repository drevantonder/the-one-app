<!doctype html><html><head><meta charset="utf-8"><title>The One App</title>
<style>@font-face{font-family:Geist;src:url(fonts/Geist-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:Geist;src:url(fonts/Geist-Light.woff2) format("woff2");font-weight:300}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0806}
body{background:radial-gradient(circle 700px at 120px 315px,#2e1a07 0%,#140c05 45%,#0a0806 75%);color:#e8d7b0;position:relative;font-family:Geist}
img{position:absolute;height:1040px;left:-660px;top:-205px;filter:drop-shadow(0 0 40px rgba(255,140,30,.35))}
.text{position:absolute;left:462px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
h1{font-weight:600;font-size:72px;letter-spacing:-.025em;line-height:1;margin:0 0 12px -4px;color:#ecc56a;text-shadow:0 0 16px rgba(255,140,30,.25)}
.rule{width:120px;height:1px;background:#a8823e;margin:8px 0 24px}
.verse{font-weight:300;font-size:30px;line-height:1.35}
.verse div:nth-child(2),.verse div:nth-child(3){padding-left:22px}
</style></head><body>
<img src="public/ring.png" alt="">
<div class="text"><h1>The One App</h1><div class="rule"></div>
<div class="verse"><div>One app to rule them all,</div><div>one app to find them,</div><div>one app to bring them all,</div><div>and in the network bind them.</div></div></div>
</body></html>
