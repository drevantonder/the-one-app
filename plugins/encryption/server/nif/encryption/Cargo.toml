[package]
name = "encryption"
description = "Encryption for plugins on a server: something they import, and no part of One Core."
version.workspace = true
edition.workspace = true
license.workspace = true

# A NIF has no tests of its own: it's only whole inside the VM that loads it, where the server's tests use it.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
client = { path = "../../../../../core/client" }
# What's encrypted is the plugin's client part's to say (`encryption_client::cipher`), so a server and a device do the
# same thing.
encryption_client = { path = "../../../client/native" }
iroh.workspace = true
rustler = "0.39"
