<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devices</title>
<style>
  :root { color-scheme: light dark; --muted: color-mix(in srgb, currentColor 55%, transparent); --track: color-mix(in srgb, currentColor 15%, transparent); --online: #34c759; --cpu: #0a9edc; --gpu: #a550d9; }
  [data-theme=light] { color-scheme: light; }
  [data-theme=dark] { color-scheme: dark; }
  html, body { margin: 0; background: transparent; font: 13px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  header, li { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
  header { padding-top: 0; font-size: 11px; font-weight: 600; color: var(--muted); }
  header .label { font-size: 9px; font-weight: 500; text-align: center; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.offline { opacity: .5; }
  .icon { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  .text { flex: 1; min-width: 0; }
  .name, .detail { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { font-size: 11px; color: var(--muted); }
  .stats { display: flex; align-items: center; gap: 9px; flex: none; }
  .stats > * { display: flex; justify-content: center; }
  .ram { width: 18px; } .cpu, .gpu { width: 36px; } .disk { width: 30px; }
  [hidden] { display: none !important; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); flex: none; }
</style>
<header><span class="text">Devices</span><span class="stats"><span class="label ram">RAM</span><span class="label cpu">CPU</span><span class="label gpu">GPU</span><span class="label disk">DISK</span></span></header>
<ul id="list"></ul>
<script>
const icons = {
  laptop: '<rect x="5" y="6" width="14" height="9" rx="1"/><path d="M3 18h18"/>',
  server: '<rect x="4" y="4" width="16" height="7" rx="1"/><rect x="4" y="13" width="16" height="7" rx="1"/><path d="M8 7.5h.01M8 16.5h.01"/>',
  phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  desktop: '<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M9 20h6M12 16v4"/>',
};
const iconFor = os => ({ macOS: 'laptop', linux: 'server', iOS: 'phone', android: 'phone', windows: 'desktop' })[os] ?? 'desktop';

function ago(iso) {
  const minutes = Math.round((Date.now() - new Date(iso)) / 60000);
  if (minutes < 1) return 'just now';
  if (minutes < 60) return `${minutes} min ago`;
  const hours = Math.round(minutes / 60);
  if (hours < 24) return `${hours} hr ago`;
  const days = Math.round(hours / 24);
  return days === 1 ? 'yesterday' : `${days} days ago`;
}

const gb = bytes => (bytes / 2 ** 30).toFixed(1);
const level = percent => percent >= 85 ? '#ff453a' : percent >= 70 ? '#ff9f0a' : '#30d158';
const last = samples => samples[samples.length - 1];
const percent = space => Math.round(space.used / space.total * 100);
const RING = 2 * Math.PI * 6.5, W = 36, H = 16;

// Rows are built once per device and then only have their values set, so a
// refresh never replaces what's on screen.
const rows = new Map();

function el(tag, attrs = {}, children = []) {
  const e = tag === 'li' || tag === 'span' || tag === 'div' ? document.createElement(tag) : document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  e.append(...children);
  return e;
}

function set(e, attr, value) {
  if (value === undefined) e.removeAttribute(attr);
  else if (e.getAttribute(attr) !== String(value)) e.setAttribute(attr, value);
}

function text(e, value) {
  if (e.textContent !== value) e.textContent = value;
}

function spark() {
  const area = el('path', { opacity: '.2' }), line = el('polyline', { fill: 'none', 'stroke-width': '1.4', 'stroke-linejoin': 'round' });
  const none = el('line', { x1: 4, y1: 8, x2: W - 4, y2: 8, stroke: 'var(--track)', 'stroke-width': '1.5', 'stroke-dasharray': '2 3' });
  return { svg: el('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, [area, line, none]), area, line, none };
}

function drawSpark(s, samples, color) {
  const has = samples?.length > 0;
  set(s.none, 'visibility', has ? 'hidden' : undefined);
  set(s.area, 'visibility', has ? undefined : 'hidden');
  set(s.line, 'visibility', has ? undefined : 'hidden');
  if (!has) return;
  if (samples.length === 1) samples = [samples[0], samples[0]];
  const pts = samples.map((p, i) => `${(i / (samples.length - 1) * W).toFixed(1)},${(H - 1 - p / 100 * (H - 2)).toFixed(1)}`);
  set(s.line, 'points', pts.join(' '));
  set(s.line, 'stroke', color);
  set(s.area, 'd', `M0,${H} L${pts.join(' L')} L${W},${H}Z`);
  set(s.area, 'fill', color);
}

function makeRow() {
  const r = {};
  r.icon = el('svg', { class: 'icon', viewBox: '0 0 24 24' });
  r.name = el('div', { class: 'name' });
  r.detail = el('div', { class: 'detail' });
  r.ringFill = el('circle', { cx: 9, cy: 9, r: 6.5, fill: 'none', 'stroke-width': 3, 'stroke-linecap': 'round', transform: 'rotate(-90 9 9)' });
  r.ring = el('svg', { width: 18, height: 18, viewBox: '0 0 18 18' }, [el('circle', { cx: 9, cy: 9, r: 6.5, fill: 'none', stroke: 'var(--track)', 'stroke-width': 3 }), r.ringFill]);
  r.cpu = spark();
  r.gpu = spark();
  r.barFill = el('rect', { height: 6, rx: 3 });
  r.bar = el('svg', { width: 30, height: 6 }, [el('rect', { width: 30, height: 6, rx: 3, fill: 'var(--track)' }), r.barFill]);
  r.cells = [el('span', { class: 'ram' }, [r.ring]), el('span', { class: 'cpu' }, [r.cpu.svg]), el('span', { class: 'gpu' }, [r.gpu.svg]), el('span', { class: 'disk' }, [r.bar])];
  r.stats = el('span', { class: 'stats' }, r.cells);
  r.dot = el('span', { class: 'dot' });
  r.li = el('li', {}, [r.icon, el('div', { class: 'text' }, [r.name, r.detail]), r.stats, r.dot]);
  return r;
}

function update(r, d) {
  set(r.li, 'class', d.online ? undefined : 'offline');
  const icon = iconFor(d.os);
  if (r.iconName !== icon) { r.icon.innerHTML = icons[icon]; r.iconName = icon; }
  text(r.name, d.name);
  const version = d.version ? `v${d.version}` : '';
  text(r.detail, d.online
    ? [d.self && 'This device', version].filter(Boolean).join(' · ')
    : (d.lastSeen ? `Last seen ${ago(d.lastSeen)}` : 'Offline'));
  const u = d.online ? d.usage : undefined;
  set(r.stats, 'hidden', u ? undefined : '');
  set(r.dot, 'hidden', d.online && !u ? undefined : '');
  if (!u) return;
  const m = u.memory, disk = u.disk;
  set(r.ring, 'visibility', m ? undefined : 'hidden');
  if (m) {
    set(r.ringFill, 'stroke', level(percent(m)));
    set(r.ringFill, 'stroke-dasharray', `${(RING * percent(m) / 100).toFixed(2)} ${RING.toFixed(2)}`);
  }
  drawSpark(r.cpu, u.cpu, 'var(--cpu)');
  drawSpark(r.gpu, u.gpu, 'var(--gpu)');
  set(r.bar, 'visibility', disk ? undefined : 'hidden');
  if (disk) {
    set(r.barFill, 'width', Math.max(6, 30 * percent(disk) / 100).toFixed(1));
    set(r.barFill, 'fill', level(percent(disk)));
  }
  set(r.cells[0], 'title', m ? `Memory: ${gb(m.used)} of ${gb(m.total)} GB (${percent(m)}%)` : 'Memory: unknown');
  set(r.cells[1], 'title', u.cpu?.length ? `CPU: ${last(u.cpu)}% busy` : 'CPU: unknown');
  set(r.cells[2], 'title', u.gpu?.length ? `GPU: ${last(u.gpu)}% busy` : 'No GPU reported');
  set(r.cells[3], 'title', disk ? `Disk: ${gb(disk.total - disk.used)} GB free of ${gb(disk.total)} GB (${percent(disk)}% used)` : 'Disk: unknown');
}

function render(data) {
  const devices = data?.devices ?? [];
  const lis = devices.map(d => {
    if (!rows.has(d.name)) rows.set(d.name, makeRow());
    const r = rows.get(d.name);
    update(r, d);
    return r.li;
  });
  for (const name of rows.keys()) if (!devices.some(d => d.name === name)) rows.delete(name);
  const list = document.getElementById('list');
  if (lis.length !== list.children.length || lis.some((li, i) => list.children[i] !== li)) list.replaceChildren(...lis);
}

let nextId = 1;
const pending = {};
const send = message => parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
const request = (method, params) => new Promise((resolve, reject) => {
  const id = nextId++;
  pending[id] = { resolve, reject };
  send({ id, method, params });
});

addEventListener('message', event => {
  const message = event.data;
  if (event.source !== parent || message?.jsonrpc !== '2.0') return;
  if (message.id && pending[message.id]) {
    const p = pending[message.id];
    delete pending[message.id];
    message.error ? p.reject(message.error) : p.resolve(message.result);
  } else if (message.method === 'ui/notifications/tool-result') {
    render(message.params.structuredContent);
  } else if (message.method === 'ui/notifications/host-context-changed' && message.params.theme) {
    document.documentElement.dataset.theme = message.params.theme;
  }
});

// The content's height, not the document's: that never drops below the frame's, so it couldn't shrink.
new ResizeObserver(() => send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.body.getBoundingClientRect().height) } }))
  .observe(document.body);
request('ui/initialize', { appInfo: { name: 'The One App devices', version: '1' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
  .then(result => {
    if (result?.hostContext?.theme) document.documentElement.dataset.theme = result.hostContext.theme;
    send({ method: 'ui/notifications/initialized', params: {} });
  });
</script>
</html>
