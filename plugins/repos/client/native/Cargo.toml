[package]
name = "repos_client"
description = "Repos' client-side code that's built into a client: git's remote helper for `one::` addresses."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
client = { path = "../../../../core/client" }
data-encoding = "2"
# What carries git's HTTP transport to a server.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh.workspace = true
serde_json.workspace = true
tokio.workspace = true
