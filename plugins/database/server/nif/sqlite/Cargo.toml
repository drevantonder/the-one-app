[package]
name = "sqlite"
description = "The database plugin's NIF, `Sqlite`: SQLite for a server's plugins, built into none of the server."
version.workspace = true
edition.workspace = true
license.workspace = true

# A NIF has no tests of its own: it's only whole inside the VM that loads it, where the server's tests use it.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
rustler = "0.39"
