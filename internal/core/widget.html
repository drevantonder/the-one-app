<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget</title>
<style>
  :root {
    color-scheme: light dark; --muted: color-mix(in srgb, currentColor 55%, transparent); --track: color-mix(in srgb, currentColor 15%, transparent);
    --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --blue: #0a9edc; --purple: #a550d9; --gray: #8e8e93;
  }
  [data-theme=light] { color-scheme: light; }
  [data-theme=dark] { color-scheme: dark; }
  html, body { margin: 0; background: transparent; font: 15px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  #root { padding: 12px; }
  .row { display: flex; flex-direction: row; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: stretch; }
  .row, .col { min-width: 0; }
  .grow { flex: 1 1 0; min-width: 0; }
  .dim { opacity: .5; }
  .text { white-space: pre-wrap; overflow: hidden; text-overflow: ellipsis; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; white-space: normal; }
  .one { white-space: nowrap; }
  .xl { font-size: 28px; line-height: 34px; } .lg { font-size: 20px; } .md { font-size: 15px; } .sm { font-size: 13px; } .xs { font-size: 10px; }
  .medium { font-weight: 500; } .bold { font-weight: 600; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .stat .value { font-size: 28px; line-height: 34px; font-weight: 700; }
  .item { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .item .body { flex: 1; min-width: 0; }
  .item .title, .item .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .title { font-weight: 500; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; background: currentColor; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  button { font: 13px/1 inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--track); color: inherit; cursor: default; }
  button.primary { background: AccentColor; color: AccentColorText; }
  label.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  a { color: inherit; text-decoration: none; }
  svg { flex: none; display: block; }
</style>
<div id="root"></div>
<script>
const NS = 'http://www.w3.org/2000/svg';
const colors = ['green', 'orange', 'red', 'blue', 'purple', 'gray'];
const color = name => colors.includes(name) ? `var(--${name})` : name === 'muted' ? 'var(--muted)' : 'currentColor';
let app = '', widget = '';
const tool = op => app === 'one' ? op : `${app}_${op}`;

function el(tag, cls, ...children) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  e.append(...children.filter(c => c != null));
  return e;
}

function svg(tag, attrs, ...children) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  e.append(...children);
  return e;
}

function relative(at, now = Date.now()) {
  const minutes = Math.round((now - at) / 60000);
  const size = Math.abs(minutes);
  const span = size < 1 ? 'now' : size < 60 ? `${size} min` : size < 1440 ? `${Math.round(size / 60)} hr` : `${Math.round(size / 1440)} d`;
  return size < 1 ? span : minutes > 0 ? `${span} ago` : `in ${span}`;
}

function textClass(n) {
  return [n.size ?? 'md', n.weight, n.tone === 'muted' && 'muted'].filter(Boolean).join(' ');
}

const flex = { start: 'flex-start', center: 'center', end: 'flex-end', stretch: 'stretch', between: 'space-between' };

function draw(n) {
  switch (n.t) {
    case 'row': case 'col': {
      const e = el('div', [n.t, n.grow && 'grow', n.dim && 'dim'].filter(Boolean).join(' '), ...n.c.map(draw));
      e.style.gap = `${n.gap ?? (n.t === 'row' ? 8 : 4)}px`;
      if (n.pad) e.style.padding = `${n.pad}px`;
      if (n.w) { e.style.width = `${n.w}px`; e.style.flex = 'none'; }
      if (n.align) e.style.alignItems = flex[n.align];
      if (n.justify) e.style.justifyContent = flex[n.justify];
      return e;
    }
    case 'link': {
      const a = el('a', 'col', ...n.c.map(draw));
      a.href = n.to; a.target = '_blank';
      a.onclick = event => { event.preventDefault(); request('ui/open-link', { url: n.to }); };
      return a;
    }
    case 'text': {
      const e = el('div', `text ${textClass(n)} ${n.lines === 1 ? 'one' : n.lines ? 'clamp' : ''}`, n.text);
      if (n.lines > 1) e.style.webkitLineClamp = n.lines;
      if (n.align) e.style.textAlign = n.align === 'end' ? 'right' : n.align;
      return e;
    }
    case 'time': {
      const at = n.at;
      const value = n.style === 'relative' ? relative(at)
        : n.style === 'timer' ? new Date(Math.abs(Date.now() - at)).toISOString().slice(11, 19).replace(/^00:/, '')
        : new Date(at).toLocaleString(undefined, n.style === 'date' ? { day: 'numeric', month: 'short' } : { hour: 'numeric', minute: '2-digit' });
      return el('div', `text num ${textClass(n)}`, value);
    }
    case 'img': {
      const img = el('img');
      img.src = n.src; img.alt = n.alt ?? '';
      img.width = n.w ?? 28; img.height = n.h ?? 28;
      img.style.borderRadius = n.round ? '50%' : `${n.radius ?? 0}px`;
      img.style.objectFit = 'cover';
      return img;
    }
    case 'spacer': {
      const e = el('div', n.size == null ? 'grow' : '');
      if (n.size != null) { e.style.width = e.style.height = `${n.size}px`; e.style.flex = 'none'; }
      return e;
    }
    case 'stat': return el('div', 'stat', el('div', 'value num', n.value), n.label && el('div', 'sm muted', n.label));
    case 'list': return el('div', `list ${n.grow ? 'grow' : ''}`, ...n.c.map(item => {
      const row = el('div', 'item', el('div', 'body', el('div', 'title', item.title), item.sub && el('div', 'sub sm muted', item.sub)), item.end && draw(item.end));
      if (!item.link) return row;
      const a = el('a', '', row);
      a.href = item.link;
      a.onclick = event => { event.preventDefault(); request('ui/open-link', { url: item.link }); };
      return a;
    }));
    case 'chart': return chart(n);
    case 'progress': {
      const fill = el('div');
      fill.style.width = `${Math.max(0, Math.min(1, n.value)) * 100}%`;
      const bar = el('div', 'bar', fill);
      bar.style.color = color(n.color);
      if (n.w) { bar.style.width = `${n.w}px`; bar.style.flex = 'none'; }
      return n.label ? el('div', 'col', el('div', 'sm muted', n.label), bar) : bar;
    }
    case 'gauge': {
      const size = n.size ?? 18, stroke = size / 6, r = (size - stroke) / 2, ring = 2 * Math.PI * r;
      const v = Math.max(0, Math.min(1, n.value));
      return svg('svg', { width: size, height: size, viewBox: `0 0 ${size} ${size}` },
        svg('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: 'var(--track)', 'stroke-width': stroke }),
        svg('circle', { cx: size / 2, cy: size / 2, r, fill: 'none', stroke: color(n.color), 'stroke-width': stroke, 'stroke-linecap': 'round',
          'stroke-dasharray': `${(ring * v).toFixed(2)} ${ring.toFixed(2)}`, transform: `rotate(-90 ${size / 2} ${size / 2})` }));
    }
    case 'spark': {
      const { w, h } = n, max = n.max || Math.max(1, ...n.data);
      if (!n.data.length) return svg('svg', { width: w, height: h }, svg('line', { x1: 4, y1: h / 2, x2: w - 4, y2: h / 2, stroke: 'var(--track)', 'stroke-width': 1.5, 'stroke-dasharray': '2 3' }));
      const data = n.data.length === 1 ? [n.data[0], n.data[0]] : n.data;
      const pts = data.map((v, i) => `${(i / (data.length - 1) * w).toFixed(1)},${(h - 1 - Math.min(v, max) / max * (h - 2)).toFixed(1)}`);
      return svg('svg', { width: w, height: h, viewBox: `0 0 ${w} ${h}` },
        svg('path', { d: `M0,${h} L${pts.join(' L')} L${w},${h}Z`, fill: color(n.color), opacity: '.2' }),
        svg('polyline', { points: pts.join(' '), fill: 'none', stroke: color(n.color), 'stroke-width': 1.4, 'stroke-linejoin': 'round' }));
    }
    case 'icon': {
      const size = n.size ?? 22, id = `cut${Math.random().toString(36).slice(2)}`;
      const icon = svg('path', n.stroke ? { d: n.path, fill: 'none', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linejoin': 'round' } : { d: n.path, fill: 'currentColor' });
      const parts = [];
      if (n.badge) {
        parts.push(svg('mask', { id }, svg('rect', { width: 24, height: 24, fill: '#fff' }), svg('circle', { cx: 21, cy: 21, r: 7, fill: '#000' })));
        icon.setAttribute('mask', `url(#${id})`);
      }
      parts.push(icon);
      if (n.badge) parts.push(svg('g', { transform: 'translate(15.5 15.5) scale(.46)' }, svg('path', { d: n.badge, fill: 'currentColor' })));
      return svg('svg', { width: size, height: size, viewBox: '0 0 24 24', overflow: 'visible' }, ...parts);
    }
    case 'dot': { const e = el('div', 'dot'); e.style.background = color(n.color); return e; }
    case 'button': {
      const b = el('button', n.primary ? 'primary' : '', n.label);
      b.onclick = () => act(n.action);
      return b;
    }
    case 'toggle': {
      const box = el('input'); box.type = 'checkbox'; box.checked = n.on;
      box.onchange = () => act(n.action);
      return el('label', 'toggle', el('span', '', n.label), box);
    }
  }
  return el('div');
}

function chart(n) {
  const h = n.h ?? 64, w = 300, max = Math.max(1, ...n.data.map(p => p.value));
  const kids = [];
  if (n.kind === 'bar') {
    const bw = w / Math.max(1, n.data.length);
    n.data.forEach((p, i) => kids.push(svg('rect', { x: i * bw + bw * .15, y: h - p.value / max * h, width: bw * .7, height: p.value / max * h, rx: 2,
      fill: i === n.hl ? 'currentColor' : 'var(--track)' })));
  } else {
    const step = w / Math.max(1, n.data.length - 1);
    kids.push(svg('polyline', { points: n.data.map((p, i) => `${i * step},${h - p.value / max * (h - 4) - 2}`).join(' '), fill: 'none', stroke: 'currentColor', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }));
  }
  return svg('svg', { width: '100%', height: h, viewBox: `0 0 ${w} ${h}`, preserveAspectRatio: 'none' }, ...kids);
}

// An action names one of the widget's plugin's operations; its MCP tool is
// the plugin and operation joined, except for the core's own. Then the
// widget is drawn again.
async function act(action) {
  await request('tools/call', { name: tool(action.op), arguments: action.input ?? {} });
  render((await request('tools/call', { name: tool(widget), arguments: {} })).structuredContent);
}

function render(d) {
  if (!d?.root) return;
  app = d.app;
  widget = d.widget;
  document.getElementById('root').replaceChildren(draw(d.root));
}

let nextId = 1;
const pending = {};
const send = message => parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
const request = (method, params) => new Promise((resolve, reject) => {
  const id = nextId++;
  pending[id] = { resolve, reject };
  send({ id, method, params });
});

addEventListener('message', event => {
  const message = event.data;
  if (event.source !== parent || message?.jsonrpc !== '2.0') return;
  if (message.id && pending[message.id]) {
    const p = pending[message.id];
    delete pending[message.id];
    message.error ? p.reject(message.error) : p.resolve(message.result);
  } else if (message.method === 'ui/notifications/tool-result') {
    render(message.params.structuredContent);
  } else if (message.method === 'ui/notifications/host-context-changed' && message.params.theme) {
    document.documentElement.dataset.theme = message.params.theme;
  }
});

new ResizeObserver(() => send({ method: 'ui/notifications/size-changed', params: { height: Math.ceil(document.body.getBoundingClientRect().height) } }))
  .observe(document.body);
request('ui/initialize', { appInfo: { name: 'The One App widget', version: '1' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
  .then(result => {
    if (result?.hostContext?.theme) document.documentElement.dataset.theme = result.hostContext.theme;
    send({ method: 'ui/notifications/initialized', params: {} });
  });
</script>
</html>
