<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plugins</title>
<style>
  :root { color-scheme: light dark; --muted: color-mix(in srgb, currentColor 55%, transparent); --hover: color-mix(in srgb, currentColor 8%, transparent); }
  [data-theme=light] { color-scheme: light; }
  [data-theme=dark] { color-scheme: dark; }
  html, body { margin: 0; background: transparent; font: 13px/1.3 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  ul { list-style: none; margin: 0; padding: 0; }
  button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 8px; border-radius: 5px; cursor: default; }
  button:hover { background: var(--hover); }
  .check { width: 14px; text-align: center; }
  .off { color: var(--muted); }
  form { display: grid; gap: 6px; padding: 6px 8px 8px; }
  label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
  input { font: inherit; padding: 4px 6px; border: 1px solid color-mix(in srgb, currentColor 20%, transparent); border-radius: 5px; background: transparent; color: CanvasText; }
  .actions { display: flex; justify-content: flex-end; gap: 6px; }
  .actions button { width: auto; padding: 3px 10px; border: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
  .actions button[type=submit] { background: AccentColor; color: AccentColorText; border-color: transparent; }
  .error { color: #d70015; font-size: 11px; }
  [hidden] { display: none !important; }
  #toggle .name { flex: 1; }
  .count { color: var(--muted); }
  .chevron { width: 10px; text-align: center; color: var(--muted); transition: transform .15s; }
  [aria-expanded=true] .chevron { transform: rotate(90deg); }
</style>
<button id="toggle" aria-expanded="false"><span class="name">Plugins</span><span class="count" id="count"></span><span class="chevron">›</span></button>
<div id="body" hidden>
<ul id="list"></ul>
<button id="add"><span class="check"></span><span>Add MCP Server…</span></button>
<form id="form" hidden>
  <label>URL or command<input id="source" placeholder="https://mcp.linear.app/mcp" required autocomplete="off" spellcheck="false"></label>
  <label>Name<input id="name" required autocomplete="off" spellcheck="false"></label>
  <div class="error" id="error" hidden></div>
  <div class="actions"><button type="button" id="cancel">Cancel</button><button type="submit">Add</button></div>
</form>
</div>
<script>
let nextId = 1;
const pending = {};
const send = message => parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
const request = (method, params) => new Promise((resolve, reject) => {
  const id = nextId++;
  pending[id] = { resolve, reject };
  send({ id, method, params });
});

function render(data) {
  document.getElementById('count').textContent = data?.plugins?.length ?? '';
  const list = document.getElementById('list');
  list.replaceChildren(...(data?.plugins ?? []).map(p => {
    const button = document.createElement('button');
    button.className = p.enabled ? '' : 'off';
    button.innerHTML = '<span class="check"></span><span class="name"></span>';
    button.querySelector('.check').textContent = p.enabled ? '✓' : '';
    button.querySelector('.name').textContent = p.name;
    button.onclick = () => request('tools/call', { name: p.enabled ? 'plugins_disable' : 'plugins_enable', arguments: { id: p.id } })
      .then(() => request('tools/call', { name: 'plugins_list', arguments: {} }))
      .then(result => render(result.structuredContent));
    const li = document.createElement('li');
    li.append(button);
    return li;
  }));
}

const $ = id => document.getElementById(id);
const capitalize = word => word.charAt(0).toUpperCase() + word.slice(1);
let nameEdited = false;

// "https://mcp.linear.app/mcp" → Linear, "npx -y @modelcontextprotocol/server-github" → Github,
// "npx @playwright/mcp@latest" → Playwright
function suggestName(source) {
  if (/^https?:\/\//.test(source)) {
    try {
      const labels = new URL(source).hostname.split('.').filter(l => !['mcp', 'www', 'api'].includes(l));
      return capitalize(labels[0] ?? '');
    } catch { return ''; }
  }
  const words = source.split(/\s+/).filter(w => w && !w.startsWith('-') && w !== 'dlx');
  const pkg = (['npx', 'uvx', 'bunx', 'pnpm', 'yarn'].includes(words[0]) ? words[1] : words[0]) ?? '';
  const parts = pkg.replace(/(.)@[^/]*$/, '$1').split('/');
  const last = parts.pop();
  const base = (['mcp', 'server'].includes(last) && parts.length ? parts.pop().replace(/^@/, '') : last)
    .replace(/^(mcp-)?server-|^mcp-|-mcp(-server)?$/g, '');
  return capitalize(base);
}

function spec(source) {
  return /^https?:\/\//.test(source) ? { mcp: { url: source } } : { mcp: { command: source.split(/\s+/).filter(Boolean) } };
}

function showForm(open) {
  $('form').hidden = !open;
  $('add').hidden = open;
  $('error').hidden = true;
  if (open) {
    $('form').reset();
    nameEdited = false;
    $('source').focus();
  }
}

$('toggle').onclick = () => {
  const open = $('body').hidden;
  $('body').hidden = !open;
  $('toggle').setAttribute('aria-expanded', open);
};
$('add').onclick = () => showForm(true);
$('cancel').onclick = () => showForm(false);
$('source').oninput = () => { if (!nameEdited) $('name').value = suggestName($('source').value.trim()); };
$('name').oninput = () => { nameEdited = true; };
$('form').onsubmit = async event => {
  event.preventDefault();
  const source = $('source').value.trim();
  const id = $('name').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  try {
    const result = await request('tools/call', { name: 'plugins_add', arguments: { id, spec: spec(source) } });
    if (result?.isError) throw new Error(result.content?.[0]?.text ?? 'Could not add it.');
    showForm(false);
    render((await request('tools/call', { name: 'plugins_list', arguments: {} })).structuredContent);
  } catch (err) {
    $('error').textContent = err.message ?? String(err);
    $('error').hidden = false;
  }
};

addEventListener('message', event => {
  const message = event.data;
  if (event.source !== parent || message?.jsonrpc !== '2.0') return;
  if (message.id && pending[message.id]) {
    const p = pending[message.id];
    delete pending[message.id];
    message.error ? p.reject(message.error) : p.resolve(message.result);
  } else if (message.method === 'ui/notifications/tool-result') {
    render(message.params.structuredContent);
  } else if (message.method === 'ui/notifications/host-context-changed' && message.params.theme) {
    document.documentElement.dataset.theme = message.params.theme;
  }
});

new ResizeObserver(() => send({ method: 'ui/notifications/size-changed', params: { height: document.documentElement.scrollHeight } }))
  .observe(document.documentElement);
request('ui/initialize', { appInfo: { name: 'The One App plugins', version: '1' }, appCapabilities: {}, protocolVersion: '2026-01-26' })
  .then(result => {
    if (result?.hostContext?.theme) document.documentElement.dataset.theme = result.hostContext.theme;
    send({ method: 'ui/notifications/initialized', params: {} });
  });
</script>
</html>
