# `one-dev`: for whoever builds The One App from this repo, its own or a custom build: building and sending out
# its builds (src/ship.rs), and a throwaway network of their checkout's build (src/throwaway.rs). It never ships: the
# people a network serves, and their agents, have the `one` program (cli/), with nothing in it for building it.
[package]
name = "one-dev"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "one-dev"
path = "src/main.rs"
doctest = false

[dependencies]
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
key = { path = "../key" }
scope = { path = "../scope" }
api = { path = "../api" }
one = { path = ".." }
deploy = { path = "../deploy" }
anyhow = "1"
data-encoding = "2"
libc = "0.2"
# Rust's v0 symbol mangling, which `one-dev symbols` turns back into names: writing its grammar here would be longer than the crate.
rustc-demangle = "0.1"
serde_json = "1"
sha2 = "0.11"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
ureq = { version = "3", features = ["json"] }
