org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Kotlin compiles in Gradle's own process, not a second daemon left running after the build.
kotlin.compiler.execution.strategy=in-process
# What a task made is kept in Gradle's cache in the user's home and taken from there by the same task in any checkout,
# as a new checkout's first build otherwise compiles and dexes it all again.
org.gradle.caching=true
