# The Rust packages build as one workspace, so they share one lockfile and one `target` folder: One Core's in a
# client and its server's NIFs, the clients, and the native code of the apps the One App ships with.
[workspace]
resolver = "3"
members = ["core/client", "core/server/nif/*", "clients/cli", "clients/app", "clients/app/strict", "apps/*/server/nif/*", "apps/*/server/bin/*", "apps/*/client/native"]
# Programs of apps' that aren't Rust: Computer Use's helper app for a Mac is Swift (`tooling/mac-helper`).
exclude = ["apps/computer-use/server/bin/helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
# Reaching by key. No n0 relay, discovery or metrics, and no router port mapping: nothing about a network leaves it.
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true

# What's built to work on (`cargo build`, and so `tooling/network`) is the debug build: what changed is built again
# incrementally and unoptimized, in seconds where a release build of `one` takes half a minute after every commit,
# while the packages it uses are optimized, as a release's are, and kept in the compiler cache once for every
# worktree. Only what's published is built `--release`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Blade with one change, until it's merged: an sRGB surface that offers no BGRA format, as Android's don't, gets an
# RGBA swapchain (github.com/kvark/blade/pull/425, on the commit `strict` names).
[patch."https://github.com/kvark/blade"]
blade-graphics = { git = "https://github.com/drevantonder/blade", rev = "066b01fdd2ee612072750415160f9822075be70b" }

# AccessKit's Android adapter with one change, until it's taken upstream: a heading is one to TalkBack
# (`AccessibilityNodeInfo.setHeading`), so it moves between them; on accesskit_android 0.9.1's tag, with the AccessKit
# it's built with there.
[patch.crates-io]
accesskit = { git = "https://github.com/drevantonder/accesskit", rev = "688806ffef103203be0546844661724041a5505c" }
accesskit_consumer = { git = "https://github.com/drevantonder/accesskit", rev = "688806ffef103203be0546844661724041a5505c" }
accesskit_android = { git = "https://github.com/drevantonder/accesskit", rev = "688806ffef103203be0546844661724041a5505c" }
