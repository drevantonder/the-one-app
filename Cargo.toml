[workspace]
members = [".", "client"]

# netdev 0.46 uses a macOS-only libc type on every Apple system, which breaks iPhone builds of the client.
# Drop this once iroh moves to a netdev that builds for iOS.
[patch.crates-io]
netdev = { path = "vendor/netdev" }
# Same story for netwatch's routing socket constants, which libc gives only to macOS.
netwatch = { path = "vendor/netwatch" }

[package]
name = "one"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
blake3 = "1"
axum = "0.8"
ciborium = "0.2"
data-encoding = "2"
iroh = "1.4"
p2panda-core = "0.7"
rand = "0.8"
rquickjs = { version = "0.14", features = ["macro"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[build-dependencies]
toml = "0.9"

# Crypto, CBOR and SQLite are unbearably slow unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[dev-dependencies]
one-client = { path = "client" }
