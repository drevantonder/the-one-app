[workspace]
members = [".", "serverless"]

[package]
name = "one"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
# The tests are one binary (tests/main.rs), so the crate links into one, not one per file.
autotests = false

# It has no doctests: rustdoc would build the crate again on every `cargo test` to find none.
[lib]
doctest = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
anyhow = "1"
# Backups encrypt what leaves for a place with AES-256-GCM, and seal each scope's key to the recovery key with X25519
# (src/backups.rs).
aes-gcm = "0.10"
curve25519-dalek = "4.1"
data-encoding = "2"
# The kernel's access tokens are signed with Ed25519 (src/kernel.rs checks them), and devices sign what they send each
# other through the relay with it (src/node/relay.rs).
ed25519-dalek = "3"
# The kernel derives keys with HKDF-SHA256, because that's what WebCrypto in workerd has (src/kernel.rs).
hkdf = "0.13"
rand = "0.8"
blake3 = "1"
# Entries are p2panda operations, packed in CBOR in the bucket (src/entry.rs); the serverless node reads them too.
ciborium = "0.2"
p2panda-core = "0.7"
# `serialize` makes and reads an app database's copy in memory (src/db.rs).
rusqlite = { version = "0.41", features = ["bundled", "limits", "serialize"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
tracing = "0.1"

# On Workers (the serverless node, serverless/), rand gets its randomness from the runtime's crypto.getRandomValues.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# What only a node on a machine uses: the rest of the node (src/lib.rs keeps the shared modules apart).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = "0.8"
# Devices reach each other over iroh (src/node/net.rs): QUIC between their device keys, direct where a path opens and
# otherwise through the install's relay, which speaks iroh's relay protocol. Only ring's TLS and the router port mapping
# (UPnP, NAT-PMP, PCP), with no n0 discovery or metrics. Pinned, since the relay runs iroh-relay's own code of this
# version.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
# Schedules' daily times are in a time zone, daylight saving and all; this reads the system's time zone database.
jiff = "0.2"
# So workerd dies with its node on Linux (prctl PR_SET_PDEATHSIG).
libc = "0.2"
# Release signatures are OpenSSH signatures (sshsig), which install.sh checks with ssh-keygen; this reads the keys and
# makes and checks the signatures.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
# A site's favicon.ico becomes a PNG for shells (src/logos.rs); ureq already brings it in.
flate2 = "1"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
toml_edit = "0.25"
# Push (src/push.rs) reaches Apple's push service, which speaks only HTTP/2: hyper's (axum already builds hyper; this
# adds h2) over the rustls ureq and iroh already build, and signs its ES256 tokens with ring, which rustls builds.
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
ring = "0.17"

[build-dependencies]
toml = "0.9"

# Crypto, CBOR and SQLite are unbearably slow unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 3

# Line numbers are all a failing test needs, and full debug info is most of what linking the tests takes.
[profile.dev]
debug = "line-tables-only"

# Rebuilding only what a change touched makes an update's build seconds, not minutes, for a node no slower to use.
[profile.release]
strip = true
incremental = true

# wasm-bindgen reads which WebAssembly features the serverless node's build uses from what stripping would remove.
[profile.release.package.one-serverless]
strip = false

[dev-dependencies]
# tests/sim.rs runs on tokio's paused clock, so links that wait seconds take none.
tokio = { version = "1", features = ["test-util"] }
