[workspace]
members = [".", "custom-build", "platform", "key", "bucket", "database", "scope", "api", "labs", "vault", "vault/runtime", "cli", "dev", "cloudflare/node", "onet", "ai-gateway", "ai-gateway/runtime", "onet/ffi", "service", "apps/shell/service", "apps/models/service", "apps/ai-usage/service", "apps/agent-devices/service", "apps/agents/service", "apps/awake/service"]
# `cargo build` here builds the program (cli/), as target/debug/one, `one-dev`, and the services in Rust
# (apps/<name>/service/), as target/debug/one-<name>, which a node built here (the Mac app's, `one-dev throwaway`'s) runs.
# `cargo test` builds only the program, for the tests that run it.
default-members = [".", "custom-build", "platform", "key", "bucket", "database", "scope", "api", "labs", "vault", "vault/runtime", "cli", "dev", "onet", "apps/shell/service", "apps/models/service", "apps/ai-usage/service", "apps/agent-devices/service", "apps/agents/service", "apps/awake/service"]

[package]
name = "one"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
# The program and its tests are cli/'s, which uses this crate.
autobins = false
autotests = false

# It has no doctests: rustdoc would build the crate again on every `cargo test` to find none.
[lib]
doctest = false

# `node`, the node on a machine; without it, only what the Cloudflare node (cloudflare/node/) and onet (onet/)
# share with it: steps, databases, who's who and keys.
[features]
default = ["node"]
node = ["bucket/machine", "platform/machine", "dep:ai-gateway-runtime", "dep:vault-runtime", "dep:axum", "dep:futures-util", "dep:iroh", "dep:jiff", "dep:md-5", "dep:libc", "dep:ssh-key", "dep:tokio", "dep:tokio-stream", "dep:tracing-subscriber", "dep:flate2", "dep:image", "dep:jsonc-parser", "dep:toml_edit", "dep:hyper", "dep:hyper-util", "dep:opentelemetry-proto", "dep:prost", "web-bundle"]
# `web-bundle`, the native apps' signed web client (src/web/bundle.rs): nodes sign them, apps open them.
web-bundle = ["dep:ssh-key", "dep:flate2"]

[dependencies]
custom-build = { path = "custom-build" }
platform = { path = "platform" }
key = { path = "key" }
bucket = { path = "bucket" }
database = { path = "database" }
scope = { path = "scope" }
api = { path = "api" }
# The Vault (vault/): items, their sealing and filling, every build; what the app runtime does for it, only a node's.
vault = { path = "vault" }
# Labs (labs/): which of the network's labs are on, every build.
labs = { path = "labs" }
vault-runtime = { path = "vault/runtime", optional = true }
anyhow = "1"
# AI Gateway (ai-gateway/): `ctx.ai.run`'s shapes and tools' specs, every build; what a node does for it, only a node's.
ai-gateway = { path = "ai-gateway" }
ai-gateway-runtime = { path = "ai-gateway/runtime", optional = true }
# What AI Gateway's calls cost, priced when Insights is read (src/insights/cost.rs): Pydantic's table of every AI company's
# list prices by date and tier, kept current from the companies' own pages, embedded at its release (`cargo update -p
# genai-prices` takes newer prices). Builds for WebAssembly too.
genai-prices = "0.2.3"
# Backups encrypt what leaves for a place with AES-256-GCM, and seal each scope's key to the recovery key with X25519
# (src/backups.rs).
aes-gcm = "0.10"
curve25519-dalek = "4.1"
data-encoding = "2"
# A route's body in the OpenAPI document (src/api/openapi.rs) is derived from the struct its handler reads, so the two
# can't disagree, and no schema of those structs is written by hand.
schemars = "1"
# Auth's access tokens are signed with Ed25519 (src/cloudflare.rs checks them), and devices sign what they send each
# other through the relay with it (src/node/relay.rs).
ed25519-dalek = "3"
# The Workers derive keys with HKDF-SHA256, because that's what WebCrypto in workerd has (src/cloudflare.rs).
hkdf = "0.13"
rand = "0.8"
blake3 = "1"
# A scope database's steps are kept in CBOR in the bucket (scope/src/steps.rs); the Cloudflare node reads them too.
ciborium = "0.2"
# `serialize` makes and reads an app database's copy in memory (database/src/stored.rs).
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
# The push Worker's VAPID key is made with ring (src/cloudflare/workers.rs), and devices check a provider's RS256 ID tokens and
# a passkey's ES256 or RS256 assertion with it (scope/src/sign_in_proof.rs): rustls and iroh build it already, browsers' client too.
ring = "0.17"
tracing = "0.1"

# On Workers (the Cloudflare node, cloudflare/node/), rand gets its randomness from the runtime's crypto.getRandomValues.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Windows has none of what `libc` gives a node on Unix (platform/src/os.rs): a job for its children, and a disk's free space.
# The version Cargo already builds for tokio and iroh there.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

# What only a node on a machine uses (the `node` feature): the rest of the node, which src/lib.rs keeps apart from what
# the Cloudflare node and the native apps' client share.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", optional = true }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics", "with-serde"], optional = true }
prost = { version = "0.14", optional = true }
# Its join_all and BoxFuture run a node's asks of several things at once (src/node/screens.rs, src/core_tools.rs); axum and iroh
# already build it.
futures-util = { version = "0.3", default-features = false, optional = true }
# Devices reach each other over iroh (src/node/net.rs): QUIC between their device keys, direct where a path opens and
# otherwise through the network's relay, which speaks iroh's relay protocol. Only ring's TLS and the router port mapping
# (UPnP, NAT-PMP, PCP), with no n0 discovery or metrics. Pinned, since the relay runs iroh-relay's own code of this
# version.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"], optional = true }
# Schedules' daily times are in a time zone, daylight saving and all; this reads the system's time zone database.
jiff = { version = "0.2", optional = true }
# A device applies a database step another device sent only once the bucket confirms it holds those bytes, by their
# ETag, which for R2's single PUT is their MD5 (bucket/src/place.rs); nothing already built gives MD5.
md-5 = { version = "0.11", optional = true }
# So workerd dies with its node on Linux (prctl PR_SET_PDEATHSIG).
libc = { version = "0.2", optional = true }
# Release signatures are OpenSSH signatures (sshsig), which install.sh checks with ssh-keygen; this reads the keys and
# makes and checks the signatures.
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"], optional = true }
# test-util is tests/sim.rs's paused clock, so links that wait seconds take none. It's here, not a dev-dependency, so
# `cargo test` and `cargo build` build the same target/debug/one, which `one-dev throwaway` runs: as a dev-dependency it was a
# second tokio, and every switch between them compiled this crate again. Unused, it does nothing.
tokio = { version = "1", features = ["full", "test-util"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
ureq = { version = "3", features = ["json"] }
# A site's favicon.ico becomes a PNG for shells (src/logos.rs); ureq already brings it in.
flate2 = { version = "1", optional = true }
# Agent devices' screens come as PNG or JPEG and go out as JPEG at the width asked (src/agent_devices/picture.rs).
image = { version = "0.24", default-features = false, features = ["png", "jpeg"], optional = true }
jsonc-parser = { version = "0.34", features = ["cst", "serde"], optional = true }
toml_edit = { version = "0.25", optional = true }
# Client devices ask a node's local API over iroh, HTTP/1.1 on each stream (src/node/net.rs), which hyper's server
# answers as axum's does over TCP (axum already builds hyper).
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }


[build-dependencies]
toml = "0.9"
# The custom build's icon drawn out to its edges (build.rs): already built for the node.
image = { version = "0.24", default-features = false, features = ["png"] }

# Crypto, CBOR and SQLite are unbearably slow unoptimized, even while developing. Named, not `"*"`: that would optimize every
# proc macro and build script too (cargo gives a package override precedence over build-override), most of a cold build.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

[profile.dev.package.universal-hash]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.fiat-crypto]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1_smol]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.rand_chacha]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.ciborium]
opt-level = 3

[profile.dev.package.ciborium-ll]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# Line numbers are all a failing test needs, and full debug info is most of what linking the tests takes.
[profile.dev]
debug = "line-tables-only"

# Rebuilding only what a change touched makes an update's build seconds, not minutes, for a node no slower to use.
[profile.release]
strip = true
incremental = true

# wasm-bindgen reads which WebAssembly features the Cloudflare node's build uses from what stripping would remove.
[profile.release.package.one-cloudflare-node]
strip = false

# onet's WebAssembly for browsers (onet/src/wasm.rs), as small as it builds: every page load downloads it once.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
incremental = false

# A throwaway network's WebAssembly: seconds to build after an edit, for onet three times the size of a release's `web`.
[profile.web-dev]
inherits = "web"
opt-level = 1
lto = false
codegen-units = 256
debug = false

[profile.web-dev.package.one]
incremental = true

[profile.web-dev.package.onet]
incremental = true
strip = false

