# The Rust packages build as one workspace, so they share one lockfile and one `target` folder: One Core's in a
# client and its server's NIFs, the clients, and the native code of the plugins The One App ships with.
[workspace]
resolver = "3"
members = ["core/client", "core/server/nif/*", "clients/cli", "clients/app", "plugins/*/server/nif/*", "plugins/*/server/bin/*", "plugins/*/client/native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
# Reaching by key. No n0 relay, discovery or metrics, and no router port mapping: nothing about a network leaves it.
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true
