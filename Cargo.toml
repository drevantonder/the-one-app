[workspace]
resolver = "3"
members = ["custom-build", "platform", "key", "bucket", "database", "scope", "api", "api/mcp", "ui", "labs", "onboarding", "device-logs", "device-logs/runtime", "groups", "groups/runtime", "widgets", "widgets/runtime", "deploy", "deploy/runtime", "insights", "insights/runtime", "vault", "vault/runtime", "notifications", "notifications/runtime", "backups", "backups/runtime", "app-schedules", "app-schedules/runtime", "devices", "devices/runtime", "services", "services/runtime", "app-runtime", "oned", "oned/update", "oned/cloudflare", "cli", "dev", "oned/cloudflare/worker", "onet", "ai-gateway", "ai-gateway/runtime", "onet/ffi", "services/sdk", "apps/shell/service", "apps/models/service", "apps/ai-usage/service", "apps/agent-devices/service", "apps/agents/service", "apps/awake/service"]
# `cargo build` here builds the program (cli/), as target/debug/one, `one-dev`, and the services in Rust
# (apps/<name>/service/), as target/debug/one-<name>, which an app runtime built here (the Mac app's, `one-dev throwaway`'s) runs.
# `cargo test` builds only the program, for the tests that run it.
default-members = ["custom-build", "platform", "key", "bucket", "database", "scope", "api", "api/mcp", "ui", "labs", "onboarding", "device-logs", "device-logs/runtime", "groups", "groups/runtime", "widgets", "widgets/runtime", "deploy", "deploy/runtime", "insights", "insights/runtime", "vault", "vault/runtime", "notifications", "notifications/runtime", "backups", "backups/runtime", "app-schedules", "app-schedules/runtime", "devices", "devices/runtime", "services", "services/runtime", "app-runtime", "oned", "oned/update", "oned/cloudflare", "cli", "dev", "onet", "apps/shell/service", "apps/models/service", "apps/ai-usage/service", "apps/agent-devices/service", "apps/agents/service", "apps/awake/service"]


# Crypto, CBOR and SQLite are unbearably slow unoptimized, even while developing. Named, not `"*"`: that would optimize every
# proc macro and build script too (cargo gives a package override precedence over build-override), most of a cold build.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.ghash]
opt-level = 3

[profile.dev.package.polyval]
opt-level = 3

[profile.dev.package.cipher]
opt-level = 3

[profile.dev.package.ctr]
opt-level = 3

[profile.dev.package.universal-hash]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.fiat-crypto]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha1_smol]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.rand_chacha]
opt-level = 3

[profile.dev.package.ring]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.ciborium]
opt-level = 3

[profile.dev.package.ciborium-ll]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# Line numbers are all a failing test needs, and full debug info is most of what linking the tests takes.
[profile.dev]
debug = "line-tables-only"

# Rebuilding only what a change touched makes an update's build seconds, not minutes, for an app runtime no slower to use.
[profile.release]
strip = true
incremental = true

# wasm-bindgen reads which WebAssembly features oned on Cloudflare's build uses from what stripping would remove.
[profile.release.package.oned-cloudflare-worker]
strip = false

# onet's WebAssembly for browsers (onet/src/wasm.rs), as small as it builds: every page load downloads it once.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
incremental = false

# A throwaway network's WebAssembly: seconds to build after an edit, for onet three times the size of a release's `web`.
[profile.web-dev]
inherits = "web"
opt-level = 1
lto = false
codegen-units = 256
debug = false

[profile.web-dev.package.onet]
incremental = true
strip = false

