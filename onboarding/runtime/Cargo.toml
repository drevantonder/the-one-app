# What the app runtime does for Onboarding: makes a pairing code that lets another computer join, and admits the
# computer that comes with one, through `api::AppRuntime`.
[package]
name = "onboarding-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
onboarding = { path = ".." }
api = { path = "../../api" }
scope = { path = "../../scope" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
data-encoding = "2"
rand = "0.8"
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt"] }
