# Onboarding's shapes, as every build has them: what a pairing code says, a code that's out, and what a computer joining
# with one asks and is told. Its screens are the files beside this (pages, Welcome, motion, render.js); what serves a code
# is the app runtime's (runtime/pairing.rs).
[package]
name = "onboarding"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
key = { path = "../key" }
anyhow = "1"
ciborium = "0.2"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }

# Joining with a code (`join`), a computer's: over iroh to the device that made it, at the relay the code names.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
api = { path = "../api" }
bucket = { path = "../bucket", features = ["machine"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
