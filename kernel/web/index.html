<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- The web client: its code comes only from the kernel's gateway, since it holds the browser's tokens.
     App screens run in sandboxed frames (frame.html), so nothing an app or a node sends runs here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self'; frame-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<!-- The client that reaches the person's nodes over iroh: its build, which the kernel writes in (Settings::web). -->
<meta name="one-client" content="">
<title></title>
<link rel="icon" href="/logo.png">
<!-- Installable, from Chrome or Edge (the white label's name and icon, which the kernel writes in: Settings::web). -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<script src="/start.js"></script>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a">
<!-- The window is @one/ui's (src/screen/ui): ui.js keeps it, and React, on OneUI for web.js. -->
<link rel="stylesheet" href="/screen/ui/ui.css">
<link rel="stylesheet" href="/web.css">
<script src="/screen/host.js" defer></script>
<script src="/screen/ui/ui.js" defer></script>
<script type="module" src="/web.js"></script>
<script src="/screen/bridge.js" defer></script>
<script src="/screen/kit.js" defer></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
