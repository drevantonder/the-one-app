# Device logs, as every build has them, WebAssembly too: what a device's programs and services print, kept in files on
# it and read back, and the tool that reads them. What serves the tool is the runtime's (runtime/).
[package]
name = "device-logs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
api = { path = "../api" }
platform = { path = "../platform" }
anyhow = "1"
serde_json = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing-subscriber = "0.3"
