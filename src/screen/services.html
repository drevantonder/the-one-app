<style>
  .lists { display: flex; flex-direction: column; gap: 24px; }
  .head { display: flex; align-items: center; gap: 12px; padding: 0 4px 8px; }
  .head b { flex: 1; font-size: 20px; }
  .more { width: 28px; height: 28px; border: 0; border-radius: 14px; background: var(--line); color: var(--tint); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
  button.row { width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  button.row.still { cursor: default; }
  .status { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .status.ok { background: #34c759; }
  .status.off { background: #ff9f0a; }
  .row.add { color: var(--tint); }
  .plus { width: 22px; text-align: center; font-size: 22px; font-weight: 300; flex: none; }
  .warn { color: #ff9f0a; }
</style>
<div id="services"></div>
<script>
  // A page's Services: a section per app that keeps accounts, its accounts each with a dot saying whether it's signed
  // in, then Add Account; then the rest, a row each opening its page in the App Store; then Add a Service.
  const scope = one.params?.scope || "user";
  const esc = one.esc;
  const accounts = {};
  const stale = new Set();
  one.title("Services");

  function draw() {
    const p = home.page(scope), el = document.getElementById("services");
    if (!p) return void (el.innerHTML = one.empty({ icon: "eye-slash", title: "Nothing Here", text: "This device was let into none of this page." }));
    const all = home.servicesOn(p), withAccounts = all.filter((a) => (a.ops || []).some((o) => o.name === "accounts")), others = all.filter((a) => !withAccounts.includes(a));
    const sections = withAccounts.map((a) => {
      const list = accounts[a.name], signIn = home.settings(a, p, true);
      const rows = list === undefined ? `<div class="row plain muted"><span class="spinner small"></span>Loading…</div>`
        : list instanceof Error ? `<div class="row plain warn">${esc(list.message)}</div>`
        : !list.length ? `<div class="row plain muted">No accounts yet</div>`
        : list.map((x) => `<div class="row plain"><span class="status ${x.ok ? "ok" : "off"}" title="${x.ok ? "Signed in" : "Needs signing in again"}"></span><div class="main"><div class="title"><span>${esc(x.account)}</span></div>` +
          `${x.ok ? "" : `<div class="sub wrap">${esc(x.why || "Needs signing in again")}</div>`}</div>${x.ok || !signIn ? "" : `<button class="button plain" data-signin="${esc(a.name)}">Sign In</button>`}</div>`).join("");
      const add = signIn ? `<button class="row plain add" data-add="${esc(a.name)}"><span class="plus">+</span>Add Account</button>` : "";
      return `<div><div class="head">${one.appIcon(a, 32)}<b>${esc(home.label(a))}</b><button class="more" data-more="${esc(a.name)}" aria-label="More for ${esc(home.label(a))}">${one.icon("dots-three-outline-fill")}</button></div><div class="list">${rows}${add}</div></div>`;
    }).join("");
    const rest = others.length ? `<div class="list">${others.map((a) => {
      const opens = home.inStore(a) || home.settings(a, p);
      return `<button class="row${opens ? "" : " still"}" data-open="${esc(a.name)}">${one.appIcon(a, 36)}<div class="main"><div class="title"><span>${esc(home.label(a))}</span></div>${a.description ? `<div class="sub">${esc(a.description)}</div>` : ""}</div>${opens ? `<span class="chev">›</span>` : ""}</button>`;
    }).join("")}</div>` : "";
    const addService = home.canArrange(p.scope) && home.addService() ? `<div class="list"><button class="row plain add" data-add-service><span class="plus">+</span>Add a Service</button></div>` : "";
    el.innerHTML = `<div class="lists">${sections}${rest}${all.length ? "" : one.empty({ icon: "plugs-connected", title: "No Services", text: "Services give your apps and agents your email, calendar, chats and files." })}${addService}</div>`;
    const app = (b, key) => home.app(b.dataset[key]);
    el.querySelectorAll("[data-add]").forEach((b) => (b.onclick = () => addAccount(app(b, "add"), p)));
    el.querySelectorAll("[data-signin]").forEach((b) => (b.onclick = home.settings(app(b, "signin"), p, true)));
    el.querySelectorAll("[data-open]").forEach((b) => { const opens = home.inStore(app(b, "open")) || home.settings(app(b, "open"), p); if (opens) b.onclick = opens; });
    el.querySelectorAll("[data-more]").forEach((b) => (b.onclick = () => home.menu(home.actions(app(b, "more"), p), b)));
    el.querySelector("[data-add-service]")?.addEventListener("click", home.addService());
    // Each app's accounts, listed once; a change to the app lists them again.
    for (const a of withAccounts) {
      if (accounts[a.name] !== undefined && !stale.has(a.name)) continue;
      stale.delete(a.name);
      home.call(a.name, "accounts").then((list) => (Array.isArray(list) ? list : Promise.reject(new Error(`${home.label(a)} doesn't list its accounts yet.`))))
        .catch((err) => err).then((out) => { accounts[a.name] = out; draw(); });
    }
  }

  /// Add Account: the person's accounts in the Vault this app wants and doesn't use yet, to switch it on for one; with
  /// none, its sign-in.
  async function addAccount(a, p) {
    const signIn = home.settings(a, p, true);
    const keeps = Object.values(a.vault || {}).some((need) => need.accounts);
    const items = keeps ? await one.api("GET", "/v1/vault").catch(() => []) : [];
    const there = items.filter((i) => (i.wanted_by || []).includes(a.name) && !(i.apps || []).includes(a.name));
    if (!there.length) return signIn();
    const pick = there.map((i) => ({ title: i.title, run: () => home.change(async () => {
      await one.api("POST", "/v1/vault", { scope: i.scope, id: i.id, apps: [...i.apps, a.name] });
      stale.add(a.name);
    }) }));
    home.menu([...pick, { title: "Sign In to Another Account", run: signIn }], document.querySelector(`[data-add="${CSS.escape(a.name)}"]`));
  }

  // An app's own change (a sign-in finished on its settings screen) lists its accounts again.
  one.on("changed", (e) => (e.type === "changed" ? e.apps?.length ? e.apps : Object.keys(accounts) : []).forEach((n) => stale.add(n)));
  let watching = false;
  one.render("#services", async () => {
    await home.load();
    setTimeout(() => {
      draw();
      if (!watching) home.watch(draw), (watching = true);
    });
    return undefined;
  });
</script>
