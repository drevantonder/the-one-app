<div id="page"></div>
<style>
  .action-row { color: var(--tint); cursor: pointer; }
  .field { flex: 1; min-width: 0; font: inherit; border: 0; outline: none; background: none; color: var(--text); padding: 0; }
  .made { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 8px 0 4px; }
  .link { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--fill); }
  .link span { font: 15px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; -webkit-user-select: all; }
</style>
<script>
  // Everyone in the install, for admins: each one's role a button on their row, with Remove there too, and adding
  // someone new, with an invite link (or, where people sign in with Google, how they join). The last admin's role
  // can't change.
  let state;
  const yours = one.config.yours;
  // Roles changed but not yet taken in, shown at once: null for someone being removed.
  const pending = {};
  let error = "";

  function page() {
    const me = state.user?.id;
    // Them first, then everyone by name.
    const users = [...(state.install?.users || [])].sort((x, y) => (y.id === me) - (x.id === me) || x.name.localeCompare(y.name));
    const admin = state.user?.role === "admin";
    const admins = users.filter((u) => u.role === "admin").length;
    const rows = users.filter((u) => pending[u.id] !== null).map((u) => {
      const role = pending[u.id] || u.role;
      const trailing = !admin || u.id === me || (role === "admin" && admins === 1)
        ? `<span class="note">${role === "admin" ? "Admin" : "Member"}</span>`
        : `<label class="pick">${role === "admin" ? "Admin" : "Member"}<select aria-label="${one.esc(u.name)}'s role" data-user="${one.esc(u.id)}">
            <option value="admin"${role === "admin" ? " selected" : ""}>Admin</option><option value="member"${role === "member" ? " selected" : ""}>Member</option>
            <option disabled>──────</option><option value="">Remove ${one.esc(u.name)}</option></select></label>`;
      return `<div class="row">${one.avatar(u.id, u.name)}<div class="main"><div class="title"><span>${one.esc(u.name)}${u.id === me ? " (you)" : ""}</span></div></div>${trailing}</div>`;
    });
    let html = `<div class="large-title">Users</div><div class="list">${rows.join("")}</div><div id="confirm"></div>`;
    html += error ? `<p class="footer error">${one.esc(error)}</p>` : "";
    if (admin && one.config.join_domain) {
      const address = state.install?.settings?.address;
      const at = address ? ` at <b>${one.esc(address.replace(/^https?:\/\//, ""))}</b>` : "";
      html += `<h2 class="section">Add Someone</h2><p class="footer">Anyone with a Google account at ${one.esc(one.config.join_domain)} joins ${one.esc(yours)} by signing in with Google${at}.</p>`;
    } else if (admin) {
      html += '<div class="list" style="margin-top:20px"><a class="row plain action-row" data-add>Add Someone…</a></div>';
    }
    return html;
  }

  const show = () => one.render("#page", () => page());
  const draw = () => {
    // Not while they're asked to confirm: it'd take that away from under them.
    if (document.querySelector("#confirm .confirm")) return;
    one.render("#page", async () => {
      state = await one.api("GET", "/v1/state");
      return page();
    });
  };

  // Changes someone's role, or with none removes them (once they say so): shown at once, and undone with why if it
  // fails.
  async function change(user, role, select) {
    error = "";
    const u = state.install.users.find((x) => x.id === user);
    if (role === null) {
      const sure = await one.confirm("#confirm", { title: `Remove ${u.name} from ${yours}?`, detail: "Their devices stop reaching it.", action: "Remove", danger: true });
      if (!sure) return void (select.value = u.role);
    }
    pending[user] = role;
    show();
    try {
      await (role === null ? one.api("POST", "/v1/remove", { user }) : one.api("POST", "/v1/role", { user, role }));
    } catch (e) {
      error = one.plain(e).title;
    }
    delete pending[user];
    draw();
  }

  // Someone new: their name, then a link that lets them join, to send them.
  function add() {
    const sheet = one.sheet({ title: "Add Someone", done: "Cancel" });
    sheet.body.innerHTML = `<div class="list"><label class="row plain"><input class="field" id="name" placeholder="Name" autocomplete="off" enterkeyhint="done"></label></div>
      <p class="footer" id="note">You'll get a link to send them.</p><div style="text-align:center;margin-top:18px"><button class="button primary" id="go" disabled>Make Link</button></div>`;
    const name = sheet.body.querySelector("#name"), go = sheet.body.querySelector("#go"), note = sheet.body.querySelector("#note");
    name.oninput = () => (go.disabled = !name.value.trim());
    name.onkeydown = (e) => e.key === "Enter" && !go.disabled && go.click();
    go.onclick = async () => {
      go.disabled = true;
      try {
        const who = name.value.trim();
        const { link, until } = await one.api("POST", "/v1/invite-link", { name: who });
        const days = Math.max(1, Math.round((until - Date.now()) / 86_400_000));
        one.tap("success");
        sheet.body.closest(".sheet").querySelector("[data-done]").textContent = "Done";
        sheet.body.innerHTML = `<div class="made"><div class="muted">Send ${one.esc(who)} this link. It works once, for ${days} days.</div>
          <div class="link"><span>${one.esc(link)}</span>${one.copyButton(link)}</div></div>`;
      } catch (e) {
        note.className = "footer error";
        note.textContent = one.plain(e).title;
        go.disabled = false;
      }
    };
    setTimeout(() => name.focus(), 50);
  }

  document.addEventListener("change", (e) => e.target.dataset.user && change(e.target.dataset.user, e.target.value || null, e.target));
  document.addEventListener("click", (e) => e.target.closest?.("[data-add]") && add());

  one.largeTitle("Users");
  one.on("changed", draw);
  draw();
</script>
