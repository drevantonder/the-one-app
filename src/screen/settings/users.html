<div id="page"></div>
<script>
  // Everyone in the install, for admins: each one's role a button on their row, with Remove there too, and how
  // someone new joins. The last admin's role can't change.
  let state;
  // What a person joins, in their words: "your One App".
  const ours = `your ${one.config.name.replace(/^The /, "")}`;
  // Roles changed but not yet taken in, shown at once: null for someone being removed.
  const pending = {};
  let error = "";

  function page() {
    const me = state.user?.id;
    // Them first, then everyone by name.
    const users = [...(state.install?.users || [])].sort((x, y) => (y.id === me) - (x.id === me) || x.name.localeCompare(y.name));
    const admin = state.user?.role === "admin";
    const admins = users.filter((u) => u.role === "admin").length;
    const rows = users.filter((u) => pending[u.id] !== null).map((u) => {
      const role = pending[u.id] || u.role;
      const trailing = !admin || u.id === me || (role === "admin" && admins === 1)
        ? `<span class="note">${role === "admin" ? "Admin" : "Member"}</span>`
        : `<label class="pick">${role === "admin" ? "Admin" : "Member"}<select aria-label="${one.esc(u.name)}'s role" onchange="change('${u.id}', this.value || null, this)">
            <option value="admin"${role === "admin" ? " selected" : ""}>Admin</option><option value="member"${role === "member" ? " selected" : ""}>Member</option>
            <option disabled>──────</option><option value="">Remove ${one.esc(u.name)}</option></select></label>`;
      return `<div class="row">${one.avatar(u.id, u.name)}<div class="main"><div class="title"><span>${one.esc(u.name)}${u.id === me ? " (you)" : ""}</span></div></div>${trailing}</div>`;
    });
    let html = `<div class="large-title">Users</div><h2 class="section">People in ${one.esc(ours)}</h2><div class="list">${rows.join("")}</div><div id="confirm"></div>`;
    html += error ? `<p class="footer error">${one.esc(error)}</p>` : '<p class="footer">Admins keep the recovery key. It opens every backup, everyone\'s.</p>';
    if (admin) {
      const domain = one.config.join_domain, address = state.install?.settings?.address;
      const at = address ? ` at <b>${one.esc(address.replace(/^https?:\/\//, ""))}</b>` : "";
      html += `<h2 class="section">Add Someone</h2><p class="footer">${domain
        ? `Anyone with a Google account at ${one.esc(domain)} joins ${one.esc(ours)} by signing in with Google${at}.`
        : `Send them an invite link, made with <code>${one.esc(one.config.cli)} kernel invite</code> and their name: opening it, they make their passkey and join ${one.esc(ours)}.`}</p>`;
    }
    return html;
  }

  const show = () => one.render("#page", () => page());
  const draw = () => {
    // Not while they're asked to confirm: it'd take that away from under them.
    if (document.querySelector("#confirm .confirm")) return;
    one.render("#page", async () => {
      state = await one.api("GET", "/v1/state");
      return page();
    });
  };

  // Changes someone's role, or with none removes them (once they say so): shown at once, and undone with why if it
  // fails.
  async function change(user, role, select) {
    error = "";
    const u = state.install.users.find((x) => x.id === user);
    if (role === null) {
      const sure = await one.confirm("#confirm", { title: `Remove ${u.name} from ${ours}?`, detail: "Their devices stop reaching it.", action: "Remove", danger: true });
      if (!sure) return void (select.value = u.role);
    }
    pending[user] = role;
    show();
    try {
      await (role === null ? one.api("POST", "/v1/remove", { user }) : one.api("POST", "/v1/role", { user, role }));
    } catch (e) {
      error = one.plain(e).title;
    }
    delete pending[user];
    draw();
  }

  one.title("Users");
  one.on("changed", draw);
  draw();
</script>
