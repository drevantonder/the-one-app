<style>
  .me { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 20px 0 28px; text-align: center; }
  .me .avatar { width: 84px; height: 84px; font-size: 32px; margin-bottom: 8px; }
  .me .name { font-size: 26px; font-weight: 700; }
  .lists { display: flex; flex-direction: column; gap: 24px; }
  .row .sub.build { white-space: pre-line; }
  .row.out { justify-content: center; color: var(--danger); font: inherit; border: 0; background: none; width: 100%; }
</style>
<div id="account"></div>
<script>
  // Who you are, then this device, your passkeys at the install's address, and signing out where this device can.
  const draw = () => one.render("#account", async () => {
    const [state, device] = await Promise.all([one.api("GET", "/v1/state"), one.device()]);
    const me = state.user, install = state.install;
    one.title(me.name);
    const address = install?.settings?.address;
    return `<div class="me">${one.avatar(me.id, me.name)}<div class="name">${one.esc(me.name)}</div>
      <div class="muted">${one.esc(`${me.role === "admin" ? "Admin" : "Member"} of ${install?.name || ""}`)}</div></div>
      <div class="lists"><div class="list"><div class="row plain"><div class="main"><div class="title"><span>${one.esc(device.name)}</span></div>
        ${device.build ? `<div class="sub build">${one.esc(device.build)}</div>` : ""}</div></div>
      ${address && one.config.passkeys ? `<a class="row plain" href="${one.esc(address.replace(/\/$/, ""))}/passkeys"><div class="main"><div class="title"><span>Passkeys</span></div></div><span class="chev">›</span></a>` : ""}</div>
      ${device.signOut ? `<div class="list"><button class="row plain out" data-out>Sign Out</button></div>` : ""}</div>`;
  });
  // What they signed in to, in their words: "your One App", or a workplace's, "the PTC App".
  const ours = `${one.config.join_domain ? "the" : "your"} ${one.config.name.replace(/^The /, "")}`;
  document.addEventListener("click", async (e) => {
    if (!e.target.closest("[data-out]")) return;
    if (await one.alert({ title: `Sign Out of ${ours} on this device?`, action: "Sign Out", danger: true })) one.signOut();
  });
  one.on("changed", draw);
  draw();
</script>
