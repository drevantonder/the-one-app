<style>
  .choices { display: flex; justify-content: space-around; padding: 18px 8px 14px; }
  .choice { display: flex; flex-direction: column; align-items: center; gap: 10px; font: inherit; font-size: 15px; color: var(--text); background: none; border: 0; padding: 0; }
  .shot { width: 66px; height: 120px; border-radius: 10px; overflow: hidden; display: flex; box-shadow: inset 0 0 0 0.5px var(--line), 0 0 0 0.5px var(--line); }
  .half { flex: 1; padding: 8px 0 0 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .half.light { background: #fff; --fg: 0, 0, 0; }
  .half.dark { background: #000; --fg: 255, 255, 255; }
  .half b { display: block; width: 30px; height: 5px; border-radius: 3px; background: rgba(var(--fg), 0.7); }
  .half i { display: block; width: 50px; min-height: 14px; border-radius: 3px; background: rgba(var(--fg), 0.12); }
  .automatic .half i { width: 50px; }
  .automatic .half.dark { padding-left: 0; }
  .automatic .half.dark b, .automatic .half.dark i { margin-left: -25px; }
  .tick { width: 24px; height: 24px; color: var(--faint); }
  .choice.on .tick { color: var(--accent); }
</style>
<div class="large-title">Appearance</div>
<div class="list"><div class="choices" id="choices"></div></div>
<script>
  one.title("Appearance");
  // Light, Dark or Automatic for this device, as small pictures of a screen with a check under each.
  const half = (look) => `<div class="half ${look}"><b></b><i></i><i></i><i></i><i></i></div>`;
  const shots = { light: half("light"), dark: half("dark"), automatic: half("light") + half("dark") };
  const titles = { light: "Light", dark: "Dark", automatic: "Automatic" };
  const draw = (chosen) => {
    choices.innerHTML = ["light", "dark", "automatic"].map((v) => `<button class="choice ${v}${v === chosen ? " on" : ""}" data-v="${v}" aria-pressed="${v === chosen}">
      <div class="shot">${shots[v]}</div>${one.esc(titles[v])}${one.icon(v === chosen ? "check-circle-fill" : "circle", "tick")}</button>`).join("");
  };
  choices.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-v]");
    if (!b) return;
    one.tap();
    draw(await one.appearance(b.dataset.v));
  });
  one.largeTitle("Appearance");
  one.appearance().then(draw);
</script>
