<div id="page"></div>
<style>
  .tile { width: 34px; height: 34px; display: grid; place-items: center; flex: none; color: var(--text); }
  .tile .i { width: 26px; height: 26px; }
  .tile.off { color: var(--faint); }
  .status { color: var(--muted); font-size: 15px; flex: none; }
  .field { flex: 1; min-width: 0; font: inherit; border: 0; outline: none; background: none; color: var(--text); padding: 0; }
  .action-row { color: var(--tint); cursor: pointer; }
  .action-row .i { width: 22px; height: 22px; }
  .more { width: 28px; height: 28px; flex: none; border: 0; border-radius: 14px; background: var(--fill); color: var(--tint); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
  #page h2.section:first-of-type { margin-top: 8px; }
  .list.passkey { margin-top: 20px; }
  .code-field { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
  .code-field::placeholder { font-family: var(--font, inherit); text-transform: none; letter-spacing: 0; }
  .row.out { justify-content: center; color: var(--danger); font: inherit; border: 0; background: none; width: 100%; }
  .pair { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 8px 0 4px; }
  .code { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--fill); }
  .pair code { font: 0.92em var(--mono); }
  .code span { font: 15px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: all; -webkit-user-select: all; }
</style>
<script>
  // This person's devices, the shared ones they may use, and which run their own things: naming this device and
  // signing out of it, removing one, pairing a computer with a code, and, where this device holds its own keys
  // (`device.keys`), approving a new device by the code it shows, listing a passkey to get back in with, and what
  // their devices keep running for them.
  let state, device, apps = [], passkey = false;
  let error = "";
  // A new device's code, from its QR's link (`/approve#CODE`), asked about once.
  let scanned = one.params?.approve || "";
  // An app's screen sends its person here to choose a device to keep it running (`keep`, in `scope`), asked once.
  let keepAsked = one.params?.keep ? { app: String(one.params.keep), scope: one.params.scope && String(one.params.scope) } : null;

  const me = () => state.user?.id;
  const shown = (name) => (name.endsWith(".local") ? name.slice(0, -6) : name);
  const list = (names) => (names.length < 2 ? names.join("") : `${names.slice(0, -1).join(", ")} and ${names.at(-1)}`);
  const userName = (id) => state.install?.users.find((u) => u.id === id)?.name || "someone";
  const holds = (s) => (s.runs_for || []).includes(`user:${me()}`);
  const icon = (name) => {
    const n = name.toLowerCase();
    if (n.includes("iphone") || n.includes("phone") || n.includes("android")) return "device-mobile";
    if (n.includes("ipad") || n.includes("tablet")) return "device-tablet";
    if (n.includes("macbook") || n.includes("laptop")) return "laptop";
    if (n.includes("imac") || n.includes("mac") || n.includes("windows") || n.includes("pc")) return "desktop";
    return "hard-drives";
  };
  const runBy = (s) => (!s.user || s.user === me() ? "" : `${userName(s.user)}’s`);
  // Online is how it should be, so it says nothing.
  const status = (on) => (on ? "" : `<span class="status">Offline</span>`);
  const subs = (...lines) => lines.filter(Boolean).map((l) => `<div class="sub">${one.esc(l)}</div>`).join("");

  // A row says what a device is; one that may be removed (not the device looking) has its menu, from its … or a right-click.
  const row = ({ key, name, online, lines, trailing, removable }) =>
    `<div class="row still"${removable ? ` data-device="${one.esc(key)}"` : ""}>
      <div class="tile${online ? "" : " off"}">${one.icon(icon(name || "phone"))}</div>
      <div class="main"><div class="title"><span>${one.esc(shown(name) || "Phone")}</span></div>${subs(...lines)}</div>${trailing}` +
    (removable ? `<button class="more" data-more aria-label="More for ${one.esc(shown(name) || "Phone")}">${one.icon("dots-three-outline-fill")}</button>` : "") + "</div>";

  const deviceRow = (s) => {
    const online = !!s.online;
    const trailing = status(online);
    return row({ key: s.key, name: s.name, online, lines: [s.me ? "This device" : runBy(s)], trailing, removable: s.user === me() && !s.me });
  };
  // Where things run first: every device, and Cloudflare, Use First, When Needed or Last Resort, cheaper kinds first
  // within each (src/rank.rs); an admin moves one with its menu.
  const PLACES = { first: "Use First", needed: "When Needed", last: "Last Resort" };
  const KINDS = { always_on: "Always on", laptop: "Laptop, sleeps", cloud: "Cloud server, paid by the hour", cloudflare: "Online, paid per use" };
  const COST = { laptop: 1, cloudflare: 2, cloud: 3 };
  const places = () => {
    const all = (state.install?.devices || []).filter((s) => s.use).map((s) => ({ name: shown(s.name), key: s.key, kind: s.kind, use: s.use, online: !!s.online, here: s.me }));
    if (state.install?.serverless?.use) all.push({ name: "Cloudflare", key: "cloudflare", kind: "cloudflare", use: state.install.serverless.use, online: true });
    return all;
  };
  const orderRow = (d, admin) => {
    const trailing = admin
      ? `<label class="pick">${PLACES[d.use]}<select aria-label="Where ${one.esc(d.name)} comes" data-place="${one.esc(d.key)}">${Object.entries(PLACES).map(([v, t]) => `<option value="${v}"${v === d.use ? " selected" : ""}>${t}</option>`).join("")}</select></label>`
      : `<span class="note">${PLACES[d.use]}</span>`;
    return `<div class="row plain"><div class="main"><div class="title"><span>${one.esc(d.name)}</span></div>${subs([KINDS[d.kind], d.here && "This device", !d.online && "Offline"].filter(Boolean).join(" · "))}</div>${trailing}</div>`;
  };
  const orderSection = () => {
    const all = places(), admin = state.user?.role === "admin";
    // With one place, there's nothing to put first.
    if (all.length < 2) return "";
    const rank = (d) => Object.keys(PLACES).indexOf(d.use) * 10 + (COST[d.kind] || 0);
    const html = `<h2 class="section">Where Things Run</h2><div class="list">${all.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name)).map((d) => orderRow(d, admin)).join("")}</div>`;
    return html + `<p class="footer">Things run on the first device here that’s on and has room.</p>`;
  };

  // Standing work: "linux keeps WhatsApp running for you", until when, with Stop. It lasts 30 days, and longer as
  // they use the app.
  const appTitle = (name) => apps.find((a) => a.name === name)?.title || name;
  const forWhom = (scope) => (scope === `user:${me()}` ? "you" : scope === "global" ? "everyone" : state.install?.groups.find((g) => `group:${g.id}` === scope)?.name || "a group");
  const grantRow = (g) => {
    const on = (state.install?.devices || []).find((d) => d.key === g.endpoint);
    const until = new Date(g.until).toLocaleDateString(undefined, { day: "numeric", month: "long" });
    return `<div class="row plain"><div class="main"><div class="title"><span>${one.esc(shown(on?.name || "A device"))} keeps ${one.esc(appTitle(g.app))} running for ${one.esc(forWhom(g.scope))}</span></div>` +
      `${subs(`Until ${until}, and longer as ${g.scope === `user:${me()}` ? "you use it" : "it’s used"}`)}</div>` +
      `<button class="button plain small" data-grant='${one.esc(JSON.stringify({ device: g.endpoint, app: g.app, scope: g.scope }))}'>Stop</button></div>`;
  };
  // The devices that may keep an app running in a scope: those that hold it.
  const keepers = (scope) => (state.install?.devices || []).filter((d) => (d.runs_for || []).includes(scope));

  /// Asks which app (unless it's given) and which device keeps it running, then grants it.
  function keep({ app, scope } = {}) {
    scope ||= `user:${me()}`;
    const { body, close } = one.sheet({ title: app ? `Keep ${appTitle(app)} Running` : "Keep an App Running", done: "Cancel", onClose: draw });
    const choose = (rows, footer) => (body.innerHTML = `<div class="list">${rows.join("") || '<div class="row plain"><div class="main"><div class="sub">None yet</div></div></div>'}</div><p class="footer">${one.esc(footer)}</p><div id="keep-error"></div>`);
    const pick = (name, data) => `<a class="row plain go" ${data}><div class="main"><div class="title"><span>${one.esc(name)}</span></div></div><span class="chev">${one.icon("caret-right")}</span></a>`;
    const devices = () => {
      const on = keepers(scope);
      choose(on.map((d) => pick(shown(d.name), `data-keep-device="${one.esc(d.key)}"`)), `Its schedules run on the device you choose, which holds ${appTitle(app)}’s keys alone, while it’s on.`);
    };
    body.addEventListener("click", async (e) => {
      const t = e.target.closest("[data-keep-app], [data-keep-device]");
      if (t?.dataset.keepApp) return ((app = t.dataset.keepApp), devices());
      if (!t?.dataset.keepDevice) return;
      try {
        await one.api("POST", "/v1/grant", { device: t.dataset.keepDevice, app, scope });
        close();
      } catch (err) {
        body.querySelector("#keep-error").innerHTML = one.banner(err, { retry: false });
      }
    });
    if (app) return devices();
    const scheduled = apps.filter((a) => (a.schedules || []).some((s) => s.scope === scope && !s.removed));
    choose(scheduled.map((a) => pick(a.title || a.name, `data-keep-app="${one.esc(a.name)}"`)), "Apps that run on their own, every so often.");
  }

  // Where their own things run: the machines that run things, each with a switch. Their own machines always do; the
  // rest only as their own device says (`runs`), which only they change.
  const machines = () => {
    const all = (state.install?.devices || []).filter((s) => (s.roles || []).includes("compute"));
    const cloud = state.install?.serverless;
    return cloud?.key ? [...all, { key: cloud.key, name: "Cloudflare", runs_for: cloud.runs_for, roles: ["compute"] }] : all;
  };
  const always = (s) => holds(s) && s.user === me() && !(state.install?.runs || []).includes(s.key);
  const runsSection = () => {
    const all = machines();
    if (!all.length) return "";
    const on = all.filter(holds).map((s) => shown(s.name));
    const said = on.length ? `Your things run on ${list(on)}.` : "Nothing runs your things now. Turn on a machine below, or your apps can’t open what’s yours.";
    const rows = all.map((s) => `<label class="row plain"><div class="main"><div class="title"><span>${one.esc(shown(s.name))}</span></div>${subs(always(s) ? "Yours, so it always does" : runBy(s))}</div>` +
      `<input type="checkbox" class="switch" data-runs="${one.esc(s.key)}" aria-label="Run your things on ${one.esc(shown(s.name))}"${holds(s) ? " checked" : ""}${always(s) || !device.keys ? " disabled" : ""}></label>`).join("");
    return `<h2 class="section">Where Your Things Run</h2><div class="list"><div class="row plain"><div class="main">${one.esc(said)}</div></div>${rows}</div>` +
      '<p class="footer">These open your own things when you use them, with the keys your device hands them, and keep none.</p>';
  };

  const clientRow = (c) =>
    row({ key: c.key, name: c.name, online: true, lines: [c.me ? "This device" : "Signed in"], trailing: "", removable: !c.me });

  function page() {
    one.largeTitle("Devices");
    const devices = state.install?.devices || [], clients = state.install?.clients || [];
    const mine = devices.filter((s) => s.user === me()), others = devices.filter((s) => s.user !== me());
    const here = [...devices, ...clients].find((m) => m.me);
    let html = '<div class="large-title">Devices</div>';
    if (here || device.signOut) {
      html += '<h2 class="section">This Device</h2><div class="list">' +
        (here ? `<label class="row plain"><input class="field" id="name" aria-label="This device’s name" value="${one.esc(here.name)}" autocomplete="off" spellcheck="false" enterkeyhint="done"></label>`
          : `<div class="row plain"><div class="main"><div class="title"><span>${one.esc(device.name)}</span></div></div></div>`) +
        (device.signOut ? `<button class="row plain out" data-out>Sign Out</button>` : "") + "</div>";
    }
    html += '<h2 class="section">Your Devices</h2><div class="list">' + mine.map(deviceRow).join("") + clients.filter((c) => c.user === me()).map(clientRow).join("") +
      `<a class="row plain action-row" data-pair>${one.icon("desktop")}<span>Pair a Computer</span></a></div><div id="ask"></div>`;
    if (device.keys) {
      html += '<h2 class="section">Approve a Device</h2><div class="list">' +
        `<label class="row plain"><input class="field code-field" id="code" placeholder="Code on the new device" aria-label="Code on the new device" autocomplete="off" spellcheck="false" autocapitalize="characters" enterkeyhint="go" maxlength="9"></label></div>` +
        '<div id="approve"></div><p class="footer">Type the code it shows, or scan its QR code with your phone.</p>';
      if (passkey) html += `<div class="list passkey"><a class="row plain action-row" data-passkey>${one.icon("key")}<span>Use this passkey to get back in if you lose your devices</span></a></div>`;
      const grants = (state.install?.grants || []).filter((g) => g.until > Date.now());
      html += '<h2 class="section">Kept Running</h2><div class="list">' + grants.map(grantRow).join("") +
        `<a class="row plain action-row" data-keep>${one.icon("arrows-clockwise")}<span>Keep an App Running…</span></a></div>`;
    }
    if (others.length) html += '<h2 class="section">Shared Devices</h2><div class="list">' + others.map(deviceRow).join("") + "</div>";
    html += orderSection();
    html += runsSection();
    const day = (t) => new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    if (state.install?.recovery_set) html += `<p class="footer">Recovery key set ${one.esc(day(state.install.recovery_set))}.</p>`;
    if (state.install?.recovery_used) {
      const r = state.install.recovery_used;
      html += `<p class="footer">The recovery key last let in a device of ${one.esc(r.user === me() ? "yours" : `${userName(r.user)}’s`)}, ${one.esc(day(r.time))}.</p>`;
    }
    if (error) html += `<p class="footer error">${one.esc(error)}</p>`;
    return html;
  }

  const draw = () => one.render("#page", async () => {
    [state, device] = await Promise.all([one.api("GET", "/v1/state"), one.device()]);
    if (device.keys) {
      passkey = (await one.api("GET", "/v1/devices/passkey").catch(() => ({}))).passkey === true;
      if (!apps.length) apps = await one.api("GET", "/v1/apps").catch(() => []);
    }
    const html = page();
    // Not while they're naming this device or answering a question.
    if (["name", "code"].includes(document.activeElement?.id) || document.querySelector("#ask .confirm, #approve .confirm")) return;
    return html;
  });

  async function act(fn) {
    error = "";
    try {
      await fn();
    } catch (err) {
      error = one.plain(err).title;
      one.tap("error");
    }
    await draw();
  }

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "name") rename(t);
    else if (t.dataset.place) place(t.dataset.place, t.value);
    else if (t.dataset.runs) runs(t.dataset.runs, t.checked);
  });
  document.addEventListener("click", (e) => {
    if (e.target.closest(".sheet")) return;
    const t = e.target.closest?.("[data-more], [data-pair], [data-out], [data-passkey], [data-grant], [data-keep]");
    if (t?.hasAttribute("data-out")) signOut();
    else if (t?.hasAttribute("data-keep")) keep();
    else if (t?.hasAttribute("data-passkey")) act(() => one.api("POST", "/v1/devices/passkey", {}));
    else if (t?.dataset.grant) {
      act(() => one.api("POST", "/v1/grant", { ...JSON.parse(t.dataset.grant), days: 0 }));
    }
    else if (t?.hasAttribute("data-more")) menu(t.closest("[data-device]").dataset.device, t);
    else if (t) pair();
  });
  document.addEventListener("contextmenu", (e) => {
    const t = e.target.closest?.("[data-device]");
    if (t) e.preventDefault(), menu(t.dataset.device, e.target.closest("[data-more]") || { x: e.clientX, y: e.clientY });
  });
  document.addEventListener("keydown", (e) => e.target.id === "name" && e.key === "Enter" && e.target.blur());
  document.addEventListener("keydown", (e) => e.target.id === "code" && e.key === "Enter" && approve(e.target.value));
  document.addEventListener("input", (e) => e.target.id === "code" && e.target.value.replace(/[^a-z2-7]/gi, "").length === 8 && approve(e.target.value));

  /// Finds the device waiting with this code, shows which it is, and lets it in on Approve.
  async function approve(typed) {
    const code = String(typed).toUpperCase().replace(/[^A-Z2-7]/g, "");
    if (code.length !== 8) return;
    const ask = document.querySelector("#approve");
    let r;
    try {
      r = await one.api("POST", "/v1/devices/approve", { code });
    } catch (err) {
      return void (ask.innerHTML = `<p class="footer error">${one.esc(one.plain(err).title)}</p>`);
    }
    one.confirm(ask, {
      title: `Approve ${r.device}?`,
      detail: one.esc(r.new ? `${r.person}’s first device. They join ${yours}.` : "It can open everything you can."),
      action: "Approve",
      run: () => one.api("POST", "/v1/devices/approve", { code, confirm: true }),
    }).then((done) => {
      const field = document.querySelector("#code");
      if (field) field.value = "";
      if (done) draw();
    });
    ask.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function rename(input) {
    const name = input.value.trim();
    const here = [...(state.install?.devices || []), ...(state.install?.clients || [])].find((m) => m.me);
    if (!name || name === here?.name) return void (input.value = here?.name || "");
    act(() => one.api("POST", "/v1/name", { name }));
  }

  // Choosing where things run first shows at once (the page drawn as it will be), then goes to the node; what failed
  // goes back as it was when the page is drawn again.
  const now = () => one.render("#page", async () => page());

  /// Turns a machine on or off for their own things: the list their device says, with it or without it.
  function runs(key, on) {
    one.tap();
    const next = new Set((state.install?.runs || []).filter((k) => machines().some((s) => s.key === k)));
    if (on) next.add(key);
    else next.delete(key);
    act(() => one.api("POST", "/v1/runs", { on: [...next] }));
  }

  function place(device, use) {
    one.tap();
    const s = device === "cloudflare" ? state.install.serverless : state.install.devices.find((x) => x.key === device);
    if (s) s.use = use;
    now();
    act(() => one.api("POST", "/v1/use", { device, use }));
  }

  async function menu(key, at) {
    const m = [...state.install.devices, ...state.install.clients].find((x) => x.key === key);
    const i = await one.menu([{ title: `Remove ${shown(m.name) || "This Device"}`, icon: "minus-circle", danger: true }], at).catch(() => null);
    if (i === 0) remove(key);
  }

  function remove(key) {
    const m = [...state.install.devices, ...state.install.clients].find((x) => x.key === key);
    one.confirm("#ask", {
      title: `Remove ${shown(m.name) || "this device"}?`,
      detail: "It loses access to your data. Approve it again to use it.",
      action: "Remove",
      danger: true,
      run: () => one.api("POST", "/v1/remove", { key }),
    }).then((done) => done && draw());
    document.querySelector("#ask").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  const yours = one.config.yours;
  async function signOut() {
    if (await one.alert({ title: `Sign Out of ${yours} on this device?`, action: "Sign Out", danger: true })) one.signOut();
  }

  function pair() {
    const { body } = one.sheet({ title: "Pair a Computer", html: one.loading("Making a code") });
    one.api("POST", "/v1/pair", {}).then(
      ({ code }) => {
        body.innerHTML = `<div class="pair"><div class="muted">It joins as you, with everything you can see and do.</div>
          <div class="code"><span>${one.esc(code)}</span>${one.copyButton(code)}</div>
          <div class="small muted">On the other computer, choose Join with a Pairing Code, or run <code>${one.esc(one.config.cli)} join</code> with the code. It works once, for seven days.</div></div>`;
      },
      (err) => (body.innerHTML = one.problem({ title: one.plain(err).title })),
    );
  }

  one.on("changed", draw);
  draw().then(() => {
    if (scanned) approve(scanned), (scanned = "");
    if (keepAsked && device.keys) keep(keepAsked), (keepAsked = null);
  });
</script>
