<div id="page"></div>
<style>
  /* A device's type, with its OS's glyph at its corner: nothing behind the glyph. */
  .device-icon { position: relative; width: 28px; height: 28px; flex: none; color: var(--text); }
  .device-icon > .i, .device-icon > .brand { width: 28px; height: 28px; }
  .device-icon .os { position: absolute; right: -6px; bottom: -4px; width: 15px; height: 15px; }
  .device-icon.off { color: var(--muted); }
  /* Wide enough, the tabs spread out: Add a Device and Browsers beside the devices, the board's columns side by side. */
  @media (min-width: 900px) { body { max-width: 1040px; } }
  .tabs { margin: 4px 0 16px; }
  @media (min-width: 720px) { .tabs { max-width: 420px; margin: 4px auto 20px; } }
  #page .list { margin-bottom: 12px; }
  .more { width: 28px; height: 28px; flex: none; border: 0; border-radius: 14px; background: var(--fill); color: var(--tint); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
  .row .tile { width: 28px; height: 28px; display: grid; place-items: center; flex: none; }
  .row .tile .i { width: 22px; height: 22px; color: var(--tint); }
  /* A device waiting to be let in: which it is, its code large, to check against its screen, and the answers. */
  .waiting-device { padding: 14px 16px 16px; }
  .waiting-device .row { padding: 0; }
  .waiting-device .code { font: 600 30px var(--mono); letter-spacing: 0.08em; text-align: center; margin: 14px 0 16px; user-select: all; -webkit-user-select: all; }
  .waiting-device .answers { display: flex; gap: 10px; }
  .waiting-device .answers .button { flex: 1; padding: 10px 14px; }
  @media (min-width: 720px) {
    .waiting-device { display: flex; align-items: center; gap: 20px; padding: 14px 16px; }
    .waiting-device .row { flex: 1; min-width: 0; }
    .waiting-device .code { margin: 0; }
    .waiting-device .answers .button { min-width: 110px; }
  }

  /* Devices: the rows, then (beside them on a wide window) Add a Device and Browsers. */
  .columns { display: grid; grid-template-areas: "main" "side" "foot"; }
  @media (min-width: 860px) {
    .columns { grid-template-columns: 1.4fr 1fr; grid-template-rows: auto 1fr; grid-template-areas: "main side" "foot side"; gap: 0 20px; align-items: start; }
    .columns .side > h2.section:first-child { margin-top: 0; }
  }
  .columns > .main { grid-area: main; } .columns > .side { grid-area: side; } .columns > .foot { grid-area: foot; }
  .row.device + .row.device::before { left: 56px; }
  .flag { width: 28px; height: 28px; flex: none; border: 0; padding: 0; background: none; color: var(--warn); display: grid; place-items: center; cursor: pointer; }
  .flag .i { width: 22px; height: 22px; }
  .list .problem { background: none; margin: 0; padding: 2px 16px 14px 56px; }
  .add-way .line { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 4px 4px 12px; border-radius: 12px; background: var(--fill); }
  .add-way .line span { flex: 1; min-width: 0; font: 13px var(--mono); color: var(--text); overflow-x: auto; white-space: nowrap; user-select: all; -webkit-user-select: all; }
  .add-way .sub { white-space: normal; }
  .action-row { color: var(--tint); cursor: pointer; }
  .action-row .i { width: 22px; height: 22px; }
  .row.out { justify-content: center; color: var(--danger); font: inherit; border: 0; background: none; width: 100%; }

  /* Priority: a board of columns, first to last, stacked on a phone. */
  .question { font-size: 22px; font-weight: 700; margin: 4px 4px 14px; line-height: 1.2; }
  .board { display: flex; flex-direction: column; }
  .pcol { background: var(--card); border-radius: 20px; padding: 8px 8px 2px; min-height: 60px; transition: box-shadow 0.15s; }
  .pcol h3 { font-size: 15px; font-weight: 600; margin: 4px 8px 4px; }
  .pcol.new { background: none; border: 1.5px dashed var(--faint); display: grid; place-items: center; color: var(--muted); padding: 8px; min-height: 48px; }
  .pcol.new .i { width: 22px; height: 22px; }
  .pcol.over { box-shadow: inset 0 0 0 2px var(--tint); }
  .then { display: grid; place-items: center; height: 26px; color: var(--faint); }
  .then .i { transform: rotate(90deg); }
  @media (min-width: 640px) {
    .board { flex-direction: row; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
    .pcol { flex: 1 1 0; min-width: 150px; min-height: 180px; }
    .pcol.new { flex: 0 0 64px; min-width: 64px; }
    .then { height: auto; width: 22px; flex: none; }
    .then .i { transform: none; }
  }
  .pcard { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 6px; padding: 10px 12px; border: 0; border-radius: 14px; background: var(--raised); color: var(--text); font: inherit; text-align: left; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button.pcard { cursor: grab; }
  .pcard .name { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .name small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .pcard .grip { color: var(--faint); touch-action: none; padding: 6px; margin: -6px; }
  .pcard .grip .i { width: 20px; height: 20px; display: block; }
  .pcard.ghost { opacity: 0.3; }
  .pcard.lifted { position: fixed; z-index: 60; margin: 0; pointer-events: none; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2); transform: rotate(-1.5deg); }
  .brand { display: block; }

  /* Services: what runs where, services down and devices across, a dot each; on a phone it scrolls sideways under the
     names, which stay. */
  .grid-wrap { background: var(--card); border-radius: var(--radius); overflow-x: auto; margin: 0 auto 12px; width: fit-content; max-width: 100%; }
  .grid { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .grid th, .grid td { padding: 6px 4px; text-align: center; border-top: 0.5px solid var(--line); }
  .grid thead th { border-top: 0; padding-top: 14px; font-size: 13px; font-weight: 500; color: var(--muted); vertical-align: bottom; }
  .grid thead .device-icon { display: block; margin: 0 auto 6px; }
  @media (min-width: 720px) { .grid thead th:not(.svc) { min-width: 96px; } }
  .grid thead .nm { display: block; max-width: 84px; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid th.svc { position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left; font-weight: 500; padding: 8px 10px 8px 16px; }
  .grid th.svc > span { display: flex; align-items: center; gap: 10px; max-width: 150px; }
  .grid th.svc b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grid thead th.svc { padding: 0; }
  .grid td:last-child, .grid thead th:last-child { padding-right: 12px; }
  .cell { width: 44px; height: 40px; border: 0; padding: 0; background: none; display: inline-grid; place-items: center; cursor: pointer; }
  .cell[aria-disabled="true"] { cursor: default; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--faint); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; }
  .dot.on { background: var(--tint); border-color: var(--tint); }
  .dot.doing { animation: breathe 1.6s ease-in-out infinite; }
  .dot.warn { background: var(--warn); border-color: var(--warn); }
  .cell:active .dot { opacity: 0.6; }
  @media (prefers-reduced-motion: reduce) { .dot.doing { animation: none; } }
</style>
<script>
  // This person's devices, in three tabs: Devices (each of theirs, with Rename and Remove, Add a Device, their
  // browsers), Priority (the order every device runs apps in, an admin's to change) and Services (what each of their
  // devices runs, switched by tapping). Devices waiting to be let in show on top of every tab, approved by tapping;
  // under Devices, where this device holds its own keys (`device.keys`, the web client), what their devices keep
  // running for them, and a passkey to get back in with.
  let state, device, apps = [], passkey = false, waiting = [], seen = {}, seenRead = false;
  let error = "";
  let tab = ["devices", "priority", "services"].includes(one.params?.tab) ? one.params.tab : "devices";
  // A new device's code, from its QR's link (`/approve#CODE`), asked about once.
  let scanned = one.params?.approve || "";
  // An app's screen sends its person here to choose a device to keep it running (`keep`, in `scope`), asked once.
  let keepAsked = one.params?.keep ? { app: String(one.params.keep), scope: one.params.scope && String(one.params.scope) } : null;
  // Which devices' problems are open (Devices), and which cell's (Services).
  const opened = new Set();
  let cellOpen = "";

  const me = () => state.user?.id;
  const admin = () => state.user?.role === "admin";
  const yours = one.config.yours;
  const shown = (name) => (String(name || "").endsWith(".local") ? name.slice(0, -6) : String(name || ""));
  const userName = (id) => state.install?.users.find((u) => u.id === id)?.name || "someone";
  const appOf = (name) => apps.find((a) => a.name === name);
  const appTitle = (name) => appOf(name)?.title || name;
  const holds = (s) => (s.runs_for || []).includes(`user:${me()}`);
  const subs = (...lines) => lines.filter(Boolean).map((l) => `<div class="sub">${one.esc(l)}</div>`).join("");
  // How long ago a device was last on: "5 min ago", "2 h ago", then the day.
  const ago = (t) => {
    const s = one.ago(t);
    return /^\d/.test(s) ? `${s} ago` : s;
  };
  const ordinal = (n) => n + (n % 100 > 10 && n % 100 < 14 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");

  // What a device is, from what it says: its kind and build for a machine, its name for the rest, which our own apps
  // give ("iPhone", "The One App on Andre’s MacBook Air", "Chrome on Mac").
  const BROWSER = /^(Chrome|Safari|Firefox|Edge|A browser)( on (.+))?$/;
  const osOf = (target, name = "") => {
    if (/apple/.test(target || "") || /\b(iPhone|iPad|Mac|MacBook|iMac)\b/i.test(name)) return "apple-logo";
    if (/windows/.test(target || "") || /\bWindows\b/i.test(name)) return "windows-logo";
    if (/android/.test(target || "") || /\b(Android|Pixel|Galaxy)\b/i.test(name)) return "android-logo";
    if (/linux/.test(target || "") || /\bLinux\b/i.test(name)) return "linux-logo";
    return "";
  };
  const typeOf = (name) => {
    if (/phone|\b(Android|Pixel|Galaxy)\b/i.test(name)) return "device-mobile";
    if (/\b(iPad|Tablet)\b/i.test(name)) return "device-tablet";
    if (/\b(MacBook|Laptop)\b/i.test(name)) return "laptop";
    return "desktop";
  };
  const deviceIcon = (type, os, off) =>
    `<span class="device-icon${off ? " off" : ""}">${one.icon(type)}${os ? one.icon(os, "os") : ""}</span>`;
  // Cloudflare's own logo, its orange cloud.
  const cloudflareIcon = () =>
    '<span class="device-icon"><svg class="brand" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path fill="#F38020" d="M16.5088 16.8447c.1475-.5068.0908-.9707-.1553-1.3154-.2246-.3164-.6045-.499-1.0615-.5205l-8.6592-.1123a.1559.1559 0 0 1-.1333-.0713c-.0283-.042-.0351-.0986-.021-.1553.0278-.084.1123-.1484.2036-.1562l8.7359-.1123c1.0351-.0489 2.1601-.8868 2.5537-1.9136l.499-1.3013c.0215-.0561.0293-.1128.0147-.168-.5625-2.5463-2.835-4.4453-5.5499-4.4453-2.5039 0-4.6284 1.6177-5.3876 3.8614-.4927-.3658-1.1187-.5625-1.794-.499-1.2026.119-2.1665 1.083-2.2861 2.2856-.0283.31-.0069.6128.0635.894C1.5683 13.171 0 14.7754 0 16.752c0 .1748.0142.3515.0352.5273.0141.083.0844.1475.1689.1475h15.9814c.0909 0 .1758-.0645.2032-.1553l.12-.4268z"/>' +
    '<path fill="#FBAE40" d="M19.2656 11.2813c-.0771 0-.1611 0-.2383.0112-.0566 0-.1054.0415-.127.0976l-.3378 1.1744c-.1475.5068-.0918.9707.1543 1.3164.2256.3164.6055.498 1.0625.5195l1.8437.1133c.0557 0 .1055.0263.1329.0703.0283.043.0351.1074.0214.1562-.0283.084-.1132.1485-.204.1553l-1.921.1123c-1.041.0488-2.1582.8867-2.5527 1.914l-.1406.3585c-.0283.0713.0215.1416.0986.1416h6.5977c.0771 0 .1474-.0489.169-.126.1122-.4082.1757-.837.1757-1.2803 0-2.6025-2.125-4.727-4.7344-4.727"/></svg></span>';

  // What exists, grouped by the device it's on, as each says by its key: a machine's oned and its services, the
  // sign-ins of its apps, and each browser on its own.
  function grouped() {
    // This device, as its node says, or by its own key: a browser's, which signs in, or the one asking.
    const mark = (e) => ({ ...e, me: e.me || [device.key, state.me?.key].includes(e.key) });
    const devices = (state.install?.devices || []).map(mark), clients = (state.install?.clients || []).map(mark);
    const cards = [], browsers = [], stale = [];
    const card = (user, name) => {
      const c = { user, name: shown(name), node: null, services: [], clients: [] };
      cards.push(c);
      return c;
    };
    const byKey = new Map();
    for (const d of devices.filter((d) => (d.roles || []).includes("compute"))) byKey.set(d.key, Object.assign(card(d.user, d.name), { node: d }));
    // A service under the device it's part of, while it's switched on there.
    const off = (s) => (byKey.get(s.device)?.node?.off_services || []).some((o) => o.name === s.service);
    for (const s of devices.filter((d) => d.service && !off(d))) (byKey.get(s.device) || card(s.user, s.name)).services.push(s);
    for (const c of clients) {
      if (c.passkey || BROWSER.test(c.name)) {
        browsers.push(c);
        continue;
      }
      // One listed before sign-ins named their device names it itself when its app next runs: one that hasn't been
      // let in for a week never will, and folds into one row.
      if (!c.device && !c.me && seenRead && Date.now() - Math.max(seen[c.key] || 0, c.since || 0) > 7 * 86_400_000) {
        stale.push(c);
        continue;
      }
      // An app's sign-in, under the device it's on: its oned's card, or a phone's own, which a sign-in there again
      // replaces.
      if (c.device && !byKey.has(c.device)) byKey.set(c.device, card(c.user, c.name));
      (byKey.get(c.device) || card(c.user, c.name)).clients.push(c);
    }
    for (const c of cards) {
      const ends = [c.node, ...c.services].filter(Boolean);
      c.id = ends[0]?.key || c.clients[0]?.key;
      // Its oned last: removing it takes what's part of it, which goes first here, as a browser removes each itself.
      c.keys = [...c.services, ...c.clients, c.node].filter(Boolean).map((e) => e.key);
      c.me = [...ends, ...c.clients].some((e) => e.me);
      c.online = ends.some((e) => e.online);
      c.runs = ends.length > 0;
      c.priority = c.node?.priority ?? c.services[0]?.priority ?? (c.runs ? 1 : null);
      // Its sign-in now: this one, else the last seen, else the newest; the rest are old.
      const now = [...c.clients].sort((a, b) => b.me - a.me || (seen[b.key] || 0) - (seen[a.key] || 0) || (b.since || 0) - (a.since || 0));
      c.signIn = now[0] || null;
      c.old = now.slice(1);
      c.seen = Math.max(0, ...c.keys.map((k) => seen[k] || 0));
      c.icon = c.node
        ? deviceIcon(c.node.kind === "laptop" ? "laptop" : /apple|windows/.test(c.node.target || "") ? "desktop" : "hard-drives", osOf(c.node.target, c.name), !c.online)
        : c.runs
          ? deviceIcon("hard-drives", "", !c.online)
          : deviceIcon(typeOf(c.signIn?.name || c.name), osOf("", c.signIn?.name || c.name));
    }
    // Theirs, and others' that run their apps: all of those for an admin, who sets where things run.
    const shownCards = cards.filter((c) => c.user === me() || (c.node && (admin() || holds(c.node))));
    shownCards.sort((a, b) => (a.runs ? rank(a.priority) : 2000) - (b.runs ? rank(b.priority) : 2000) || a.name.localeCompare(b.name));
    return { cards: shownCards, browsers: browsers.filter((b) => b.user === me()), stale: stale.filter((c) => c.user === me()) };
  }
  // Run priority: a number from 1, or "last", always after every number.
  const rank = (p) => (p === "last" ? 1000 : Number(p) || 1);

  const more = (i, name) => `<button class="more" data-more="${i}" aria-label="More for ${one.esc(name)}">${one.icon("dots-three-outline-fill")}</button>`;

  // Each switch flipped here, by device and part: what was asked (`on`, and for Try Again the problem it retries), and
  // how far it got: `sent`, then `written` once the node wrote it or `failed` with why it couldn't. Shown as asked until
  // its device says it did, or for `LATE`; then, if it still hasn't, its dot says so.
  const asked = {};
  // Try Again's restart can come and go between two draws, so the same problem a few seconds on is its answer.
  const LATE = 30_000, AGAIN = 10_000;
  /// A part as its dot shows it, from what its device says and what was asked here.
  function partNow(c, p) {
    const k = `${c.node.key} ${p.name}`, a = asked[k];
    if (!a) return p;
    // Its device did it: on or off as asked, and for Try Again, past the problem it retried.
    if (a.state !== "failed" && p.on === a.on && (!a.again || p.doing || p.problem !== a.again)) return delete asked[k], p;
    if (a.state === "failed") return p.on === a.on ? (delete asked[k], p) : { ...p, failed: a.error, wanted: a.on };
    if (a.again && p.on === a.on && a.state === "written" && Date.now() - a.at > AGAIN) return delete asked[k], p;
    if (Date.now() - a.at < LATE) return { ...p, on: a.on, doing: a.on ? "Starting" : "Stopping", problem: null };
    return { ...p, on: a.on, doing: null, problem: null, late: true };
  }
  const partTitle = (p) => (p.name === "apps" ? "Runs apps" : appOf(p.name)?.title || p.title || p.name);
  /// What a device can run, as it says (Runs apps, then its services), each as asked here, with how to switch it. One
  /// that doesn't list them yet: Runs apps as it is, and its services, on.
  function partsOf(c) {
    if (Array.isArray(c.node?.parts)) return c.node.parts.map((p) => ({ ...partNow(c, p), part: { device: c.node.key, name: p.name } }));
    return [
      ...(c.node ? [{ name: "apps", on: true, fixed: true }] : []),
      ...(c.node?.installed_services || []).map((s) => ({ name: s.name, on: true, part: { service: s.name, device: c.node.key } })),
      ...c.services.map((s) => ({ name: s.service, on: true, part: { service: s.service, device: s.device } })),
    ];
  }
  /// What's wrong with a part, as one problem with what fixes it: a switch that failed or is late, or a part that
  /// isn't running.
  function problemOf(c, p) {
    const title = partTitle(p), part = p.part;
    const again = (on, retried) => ({ label: "Try Again", run: () => act(() => setPart(part, on, retried)) });
    if (p.failed) return { title: `Couldn’t switch ${title} ${p.wanted ? "on" : "off"}`, text: p.failed, action: again(p.wanted), warn: true };
    if (p.late) return { title: `${c.name} hasn’t switched ${title} ${p.on ? "on" : "off"} yet`, text: "It does once it hears, so it may be offline.", action: again(p.on), warn: true };
    if (p.on && p.problem) return { title: `${title} isn’t running on ${c.name}`, text: p.problem, action: again(true, p.problem), warn: true };
    return null;
  }
  const problemsOf = (c) => (c.user === me() ? partsOf(c).map((p) => problemOf(c, p)).filter(Boolean) : []);

  // A browser's logo with its OS's glyph, from its name ("Chrome on Mac"); a device's type, from its name, for the rest.
  const iconByName = (name) => {
    const [browsing, browser, , on] = name.match(BROWSER) || [];
    return browsing ? deviceIcon({ Chrome: "google-chrome-logo", Safari: "compass" }[browser] || "browser", osOf("", on || "")) : deviceIcon(typeOf(name), osOf("", name));
  };

  // What a device signed in with, as a grey line says it: "a@example.com · Google", or "Passkey".
  function signInLabel(a) {
    if (a?.passkey) return "Passkey";
    const p = a?.provider;
    if (!p) return "";
    let host = p.issuer;
    try { host = new URL(p.issuer).host; } catch {}
    const by = { "accounts.google.com": "Google", "appleid.apple.com": "Apple", "login.microsoftonline.com": "Microsoft" }[host] || host;
    return [p.email, by].filter(Boolean).join(" · ");
  }

  // A device waiting to be let in: which it is, where from, what approving it records it signed in with, its code to
  // check, and the answers.
  function waitingCard(r) {
    const code = one.esc(r.code);
    const sub = [r.yours ? "" : `${r.person}’s first device`, r.place].filter(Boolean).join(" · ");
    return `<div class="list waiting-device" role="group" aria-label="${one.esc(r.device)} wants to join"><div class="row plain">${iconByName(r.device)}` +
      `<div class="main"><div class="title"><span>${one.esc(r.device)}</span></div>${subs(sub, signInLabel(r.sign_in))}</div></div><div class="code">${code}</div>` +
      `<div class="answers"><button class="button" data-refuse="${code}">${r.yours ? "Not Me" : "Not Them"}</button><button class="button primary" data-let="${code}">Approve</button></div></div>`;
  }

  // A device of theirs let in within the day, by its sign-in or by someone approving it: "MacBook Pro joined ·
  // Sydney", with Remove, in case it isn't theirs.
  function justJoined() {
    const day = Date.now() - 86_400_000;
    return (state.install?.clients || []).filter((c) => c.user === me() && !c.passkey && !c.me && (c.since || 0) > day && ![device.key, state.me?.key].includes(c.key)).sort((a, b) => b.since - a.since);
  }
  const joinedCard = (c) =>
    `<div class="list"><div class="row plain">${iconByName(c.name)}<div class="main"><div class="title"><span>${one.esc(c.name)} joined</span></div>${subs([c.place, ago(c.since)].filter(Boolean).join(" · "))}</div>` +
    `<button class="button plain small" data-joined="${one.esc(c.key)}">Remove</button></div></div>`;

  // ---- Devices ----

  // A device of theirs: what it is, a grey line only when it says something, a ⚠ for a problem (tapped, it says what
  // and what fixes it), and Rename and Remove.
  function deviceRow(c, i) {
    const sub = c.me ? "This device" : c.seen && Date.now() - c.seen > 3_600_000 ? ago(c.seen) : "";
    const problems = problemsOf(c), open = problems.length && opened.has(c.id);
    const flag = problems.length
      ? `<button class="flag" data-flag="${one.esc(c.id)}" aria-expanded="${open ? "true" : "false"}" aria-label="${problems.length > 1 ? `${problems.length} problems` : "A problem"} on ${one.esc(c.name)}">${one.icon("warning-fill")}</button>`
      : "";
    return `<div class="row still device">${c.icon}<div class="main"><div class="title"><span>${one.esc(c.name)}</span></div>${subs(sub)}</div>${flag}${more(i, c.name)}</div>` +
      (open ? problems.map(one.problem).join("") : "") + oldSignIns(c, i);
  }
  const oldSignIns = (c, i) =>
    c.old.length
      ? `<div class="row plain old"><div class="main"><div class="sub">${c.old.length} old sign-in${c.old.length > 1 ? "s" : ""}</div></div>` +
        `<button class="button plain small" data-old="${i}">Remove</button></div>`
      : "";
  function browserRow(b, i) {
    const sub = b.me ? "This browser" : seen[b.key] && Date.now() - seen[b.key] > 3_600_000 ? ago(seen[b.key]) : "";
    return `<div class="row still">${b.passkey ? deviceIcon("key") : iconByName(b.name)}<div class="main"><div class="title"><span>${one.esc(b.name)}</span></div>${subs(sub)}</div>${more(`b${i}`, b.name)}</div>`;
  }

  // Standing work: "linux keeps WhatsApp running for you", until when, with Stop. It lasts 30 days, and longer as
  // they use the app.
  const deviceName = (s) => (s.service ? `${appTitle(s.service)} on ${shown(s.name)}` : shown(s.name));
  const forWhom = (scope) => (scope === `user:${me()}` ? "you" : scope === "global" ? "everyone" : state.install?.groups.find((g) => `group:${g.id}` === scope)?.name || "a group");
  const grantRow = (g) => {
    const on = (state.install?.devices || []).find((d) => d.key === g.endpoint);
    const until = new Date(g.until).toLocaleDateString(undefined, { day: "numeric", month: "long" });
    return `<div class="row plain"><div class="main"><div class="title"><span>${one.esc((on && deviceName(on)) || "A device")} keeps ${one.esc(appTitle(g.app))} running for ${one.esc(forWhom(g.scope))}</span></div>` +
      `${subs(`Until ${until}, and longer as ${g.scope === `user:${me()}` ? "you use it" : "it’s used"}`)}</div>` +
      `<button class="button plain small" data-grant='${one.esc(JSON.stringify({ device: g.endpoint, app: g.app, scope: g.scope }))}'>Stop</button></div>`;
  };
  // The apps that run on their own, every so often, in a scope (their own, unless it's said).
  const scheduled = (scope = `user:${me()}`) => apps.filter((a) => (a.schedules || []).some((s) => s.scope === scope && !s.removed));
  // The devices that may keep an app running in a scope: those that hold it.
  const keepers = (scope) => (state.install?.devices || []).filter((d) => (d.runs_for || []).includes(scope));

  function devicesTab() {
    const mine = drawn.cards.map((c, i) => [c, i]).filter(([c]) => c.user === me());
    let main = mine.length ? `<div class="list">${mine.map(([c, i]) => deviceRow(c, i)).join("")}</div>` : "";
    if (drawn.stale.length) main += `<div class="list">${oldSignIns({ old: drawn.stale }, "stale")}</div>`;
    // A device that isn't listed yet still signs out.
    if (device.signOut && ![...drawn.cards, ...drawn.browsers].some((c) => c.me)) main += '<div class="list"><button class="row plain out" data-out>Sign Out</button></div>';
    let side = `<div class="list"><a class="row plain action-row" data-add>${one.icon("plus-circle")}<span>Add a Device</span></a></div>`;
    if (drawn.browsers.length) side += '<h2 class="section">Browsers</h2><div class="list">' + drawn.browsers.map(browserRow).join("") + "</div>";
    // A browser gets notifications once its person says so here: asked only when they tap it.
    if (device.notify === "default") side += `<div class="list"><a class="row plain action-row" data-notify>${one.icon("bell")}<span>Get Notifications in This Browser</span></a></div>`;
    let foot = "";
    if (device.keys) {
      // Only for someone with something kept running, or an app that runs on its own: an app's screen asks for the rest.
      const grants = (state.install?.grants || []).filter((g) => g.until > Date.now());
      if (grants.length || scheduled().length) {
        foot += '<h2 class="section">Kept Running</h2><div class="list">' + grants.map(grantRow).join("") +
          `<a class="row plain action-row" data-keep>${one.icon("arrows-clockwise")}<span>Keep an App Running…</span></a></div>` +
          (grants.length ? '<p class="footer">When one stops or runs out, that device can’t open the app’s things any more.</p>' : "");
      }
      if (passkey) foot += `<div class="list" style="margin-top:20px"><a class="row plain action-row" data-passkey>${one.icon("key")}<span>Use this passkey to get back in if you lose your devices</span></a></div>`;
    }
    const day = (t) => new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    if (admin() && state.install?.recovery_set) foot += `<p class="footer">Recovery key set ${one.esc(day(state.install.recovery_set))}.</p>`;
    if (state.install?.recovery_used && (admin() || state.install.recovery_used.user === me())) {
      const r = state.install.recovery_used;
      foot += `<p class="footer">The recovery key last let in a device of ${one.esc(r.user === me() ? "yours" : `${userName(r.user)}’s`)}, ${one.esc(day(r.time))}.</p>`;
    }
    return `<div class="columns"><div class="main">${main}</div><div class="side">${side}</div><div class="foot">${foot}</div></div>`;
  }

  // ---- Priority ----

  /// Every device that runs apps, and Cloudflare, in columns: one per number in use, first first, then Last.
  function board() {
    const entries = drawn.cards.filter((c) => c.runs).map((c) => ({
      id: c.id, name: c.name, icon: c.icon, whose: c.user === me() ? "" : `${userName(c.user)}’s`, p: c.priority,
      keys: [c.node, ...c.services].filter(Boolean).map((e) => e.key),
    }));
    const s = state.install?.serverless;
    if (s) entries.push({ id: "cloudflare", name: "Cloudflare", icon: cloudflareIcon(), whose: "", p: s.priority ?? "last", keys: ["cloudflare"] });
    const numbers = [...new Set(entries.filter((e) => e.p !== "last").map((e) => rank(e.p)))].sort((a, b) => a - b);
    return { cols: numbers.map((n) => entries.filter((e) => e.p !== "last" && rank(e.p) === n)), last: entries.filter((e) => e.p === "last") };
  }

  function priorityTab() {
    const { cols, last } = board(), can = admin();
    const card = (e, where) => {
      const inner = `${e.icon}<span class="name">${one.esc(e.name)}${e.whose ? `<small>${one.esc(e.whose)}</small>` : ""}</span>`;
      return can
        ? `<button class="pcard" data-move="${one.esc(e.id)}" aria-haspopup="menu" aria-label="${one.esc(`${e.name}${e.whose ? `, ${e.whose}` : ""}, ${where}. Move`)}">${inner}<span class="grip" aria-hidden="true">${one.icon("dots-six-vertical")}</span></button>`
        : `<div class="pcard">${inner}</div>`;
    };
    const col = (id, title, list) =>
      `<section class="pcol" data-col="${id}" aria-label="${title}"><h3>${title}</h3>${list.map((e) => card(e, title)).join("")}</section>`;
    const then = `<div class="then" aria-hidden="true">${one.icon("caret-right")}</div>`;
    const parts = cols.map((c, i) => col(i, ordinal(i + 1), c));
    if (can) parts.push(`<section class="pcol new" data-col="new" aria-label="New">${one.icon("plus")}</section>`);
    if (can || last.length) parts.push(col("last", "Last", last));
    return `<h2 class="question">Which devices run your apps first?</h2><div class="board">${parts.join(then)}</div>`;
  }

  /// Puts a device (or Cloudflare) in a column (its index, "new" or "last"), and numbers the columns again from 1, so
  /// one emptied closes up: written into the install's `priority` setting, each of a device's endpoints alike.
  function place(id, to) {
    const { cols, last } = board();
    const e = [...cols.flat(), ...last].find((x) => x.id === id);
    if (!e) return;
    let order = cols.map((c) => c.filter((x) => x.id !== id));
    const end = last.filter((x) => x.id !== id);
    if (to === "last") end.push(e);
    else if (to === "new") order.push([e]);
    else order[Number(to)]?.push(e);
    order = order.filter((c) => c.length);
    let set = {};
    try {
      set = JSON.parse(state.install.settings?.priority || "{}") || {};
    } catch {}
    // Only what's still a device of the install, or Cloudflare.
    const known = new Set([...(state.install.devices || []).map((d) => d.key), "cloudflare"]);
    set = Object.fromEntries(Object.entries(set).filter(([k]) => known.has(k)));
    order.forEach((c, i) => c.forEach((x) => x.keys.forEach((k) => (set[k] = i + 1))));
    end.forEach((x) => x.keys.forEach((k) => (set[k] = "last")));
    const value = JSON.stringify(set);
    if (value === state.install.settings?.priority) return;
    // Shown at once, as it will be.
    for (const d of state.install.devices || []) if (d.key in set) d.priority = set[d.key];
    if (state.install.serverless && "cloudflare" in set) state.install.serverless.priority = set.cloudflare;
    state.install.settings = { ...state.install.settings, priority: value };
    one.tap();
    now();
    act(() => one.api("POST", "/v1/settings", { name: "priority", value }));
  }

  /// The way to move a device without dragging: 1st, 2nd…, New, Last.
  let menuAt = 0;
  async function moveMenu(id, at) {
    if (Date.now() - menuAt < 800) return;
    menuAt = Date.now();
    const { cols } = board();
    const from = cols.findIndex((c) => c.some((x) => x.id === id));
    // A new column is the same place for one alone in the last.
    const fresh = !(from === cols.length - 1 && cols[from].length === 1);
    const choices = [...cols.map((_, i) => i), ...(fresh ? ["new"] : []), "last"];
    const items = choices.map((c) =>
      c === "last" ? { title: "Last", checked: from < 0, section: true } : c === "new" ? { title: "New", icon: "plus" } : { title: ordinal(c + 1), checked: c === from });
    const i = await one.menu(items, at).catch(() => null);
    menuAt = Date.now();
    if (i != null) place(id, choices[i]);
  }

  // Dragging a device between columns: by its grip, or anywhere on it with a mouse. Pressed and held on a touch
  // screen, it gives the Move menu instead.
  // `quiet`: the click that ends a drag or a long press isn't a tap.
  let drag = null, quiet = false;
  document.addEventListener("pointerdown", (e) => {
    quiet = false;
    const card = e.target.closest?.("button.pcard");
    if (!card || e.button !== 0) return;
    const now = e.pointerType === "mouse" || !!e.target.closest(".grip");
    drag = { card, id: card.dataset.move, x: e.clientX, y: e.clientY, now, lifted: null, over: null };
    if (!now) drag.press = setTimeout(() => {
      const d = drag;
      drag = null;
      if (d) (quiet = true), moveMenu(d.id, d.card);
    }, 500);
  });
  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.lifted) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      clearTimeout(drag.press);
      if (!drag.now) return void (drag = null);
      const r = drag.card.getBoundingClientRect();
      const el = drag.card.cloneNode(true);
      el.classList.add("lifted");
      Object.assign(el.style, { width: `${r.width}px`, left: `${r.left}px`, top: `${r.top}px` });
      document.body.append(el);
      Object.assign(drag, { lifted: el, dx: drag.x - r.left, dy: drag.y - r.top });
      drag.card.classList.add("ghost");
      one.tap();
    }
    e.preventDefault();
    Object.assign(drag.lifted.style, { left: `${e.clientX - drag.dx}px`, top: `${e.clientY - drag.dy}px` });
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest(".pcol[data-col]") || null;
    if (over !== drag.over) drag.over?.classList.remove("over"), over?.classList.add("over"), (drag.over = over);
    if (e.clientY < 60) scrollBy(0, -12);
    else if (e.clientY > innerHeight - 60) scrollBy(0, 12);
  }, { passive: false });
  const letGo = (e) => {
    const d = drag;
    drag = null;
    if (!d) return;
    clearTimeout(d.press);
    if (!d.lifted) return;
    d.lifted.remove();
    d.card.classList.remove("ghost");
    d.over?.classList.remove("over");
    quiet = true;
    if (e.type === "pointerup" && d.over) place(d.id, d.over.dataset.col);
  };
  document.addEventListener("pointerup", letGo);
  document.addEventListener("keydown", () => (quiet = false));
  document.addEventListener("pointercancel", letGo);

  // ---- Services ----

  /// Their own devices that can run something, and Cloudflare, which runs apps, each with what it can run.
  function gridColumns() {
    const cols = drawn.cards.filter((c) => c.user === me() && c.runs).map((c) => ({ c, name: c.name, icon: c.icon, parts: partsOf(c) }));
    if (cols.length && state.install?.serverless) cols.push({ c: null, name: "Cloudflare", icon: cloudflareIcon(), parts: [{ name: "apps", on: true, fixed: true }] });
    return cols;
  }
  function servicesTab() {
    const cols = gridColumns();
    if (!cols.length) return one.empty("None of your devices runs services.");
    const titles = {};
    for (const p of cols.flatMap((x) => x.parts)) titles[p.name] ||= partTitle(p);
    const names = Object.keys(titles).sort((a, b) => (b === "apps") - (a === "apps") || titles[a].localeCompare(titles[b]));
    const icon = (name) =>
      name === "apps" ? one.appIcon({ name: "apps", title: "Runs apps", icon: "squares-four", color: "#007aff" }, 28) : one.appIcon({ ...(appOf(name) || {}), name, title: titles[name] }, 28);
    let open = null;
    const cell = (x, ci, name) => {
      const p = x.parts.find((q) => q.name === name);
      if (!p) return "<td></td>";
      const where = `${titles[name]} on ${x.name}`, key = `${ci} ${name}`;
      const problem = x.c && problemOf(x.c, p);
      if (problem && cellOpen === key) open = problem;
      const look = problem ? "warn" : `${p.on ? "on" : ""}${p.doing ? " doing" : ""}`;
      const said = problem ? `${where}: ${problem.title}` : `${where}${p.doing ? `: ${p.doing}…` : ""}`;
      const fixed = p.fixed || !p.part;
      return `<td><button class="cell" data-cell="${one.esc(key)}" ${problem ? `aria-expanded="${cellOpen === key}"` : `role="switch" aria-checked="${!!p.on}"`}${fixed && !problem ? ' aria-disabled="true"' : ""} aria-label="${one.esc(said)}">` +
        `<span class="dot ${look}" aria-hidden="true">${problem ? "!" : ""}</span></button></td>`;
    };
    const head = cols.map((x) => `<th scope="col">${x.icon}<span class="nm">${one.esc(x.name)}</span></th>`).join("");
    const rows = names.map((n) => `<tr><th scope="row" class="svc"><span>${icon(n)}<b>${one.esc(titles[n])}</b></span></th>${cols.map((x, ci) => cell(x, ci, n)).join("")}</tr>`).join("");
    if (!open) cellOpen = "";
    return `<div class="grid-wrap"><table class="grid"><thead><tr><th class="svc"></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>` + (open ? one.problem(open) : "");
  }

  /// A dot tapped: its problem opened or closed, or its part switched.
  function tapCell(key) {
    const [ci, name] = [key.slice(0, key.indexOf(" ")), key.slice(key.indexOf(" ") + 1)];
    const x = gridColumns()[ci], p = x?.parts.find((q) => q.name === name);
    if (!p) return;
    if (x.c && problemOf(x.c, p)) return (cellOpen = cellOpen === key ? "" : key), now();
    if (p.fixed || !p.part) return;
    one.tap();
    act(() => setPart(p.part, !p.on));
  }

  /// Keeps which app (unless it's given) running on which device, asked, then granted.
  function keep({ app, scope } = {}) {
    scope ||= `user:${me()}`;
    const { body, close } = one.sheet({ title: app ? `Keep ${appTitle(app)} Running` : "Keep an App Running", done: "Cancel", onClose: draw });
    const choose = (rows, footer) => (body.innerHTML = `<div class="list">${rows.join("") || '<div class="row plain"><div class="main"><div class="sub">None yet</div></div></div>'}</div><p class="footer">${one.esc(footer)}</p><div id="keep-error"></div>`);
    const pick = (name, data) => `<a class="row plain go" ${data}><div class="main"><div class="title"><span>${one.esc(name)}</span></div></div><span class="chev">${one.icon("caret-right")}</span></a>`;
    const devices = () => {
      const on = keepers(scope);
      choose(on.map((d) => pick(deviceName(d), `data-keep-device="${one.esc(d.key)}"`)), `It runs on the device you choose, while that device is on.`);
    };
    body.addEventListener("click", async (e) => {
      const t = e.target.closest("[data-keep-app], [data-keep-device]");
      if (t?.dataset.keepApp) return ((app = t.dataset.keepApp), devices());
      if (!t?.dataset.keepDevice) return;
      try {
        await one.api("POST", "/v1/grant", { device: t.dataset.keepDevice, app, scope });
        close();
      } catch (err) {
        body.querySelector("#keep-error").innerHTML = one.problem({ title: one.plain(err).title });
      }
    });
    if (app) return devices();
    choose(scheduled(scope).map((a) => pick(a.title || a.name, `data-keep-app="${one.esc(a.name)}"`)), "Apps that run on their own, every so often.");
  }

  let drawn = { cards: [], browsers: [], stale: [] };
  const TABS = [["devices", "Devices"], ["priority", "Priority"], ["services", "Services"]];
  function page() {
    one.largeTitle("Devices");
    drawn = grouped();
    let html = '<div class="large-title">Devices</div>';
    if (waiting.length) html += '<h2 class="section">Waiting for you</h2>' + waiting.map(waitingCard).join("");
    html += justJoined().map(joinedCard).join("");
    html += '<div id="approve"></div>';
    html += `<div class="segmented tabs" role="tablist">${TABS.map(([id, title]) => `<button role="tab" data-tab="${id}" aria-selected="${tab === id}" class="${tab === id ? "on" : ""}">${title}</button>`).join("")}</div>`;
    html += `<div role="tabpanel">${tab === "priority" ? priorityTab() : tab === "services" ? servicesTab() : devicesTab()}</div>`;
    if (error) html += one.problem({ title: error });
    return html;
  }

  const draw = () => one.render("#page", async () => {
    [state, device] = await Promise.all([one.api("GET", "/v1/state"), one.device()]);
    // Who waits, from a node or the web client itself; one with no code to compare is an older node's, not shown.
    const asks = [
      !apps.length ? one.api("GET", "/v1/apps").then((a) => (apps = a), () => {}) : null,
      one.api("GET", "/v1/devices/requests").then((w) => (waiting = w.filter((r) => r.code)), () => {}),
    ];
    if (device.keys) {
      asks.push(
        one.api("GET", "/v1/devices/passkey").then((p) => (passkey = p.passkey === true), () => {}),
        one.api("GET", "/v1/devices/seen").then((s) => ((seen = s || {}), (seenRead = true)), () => {}),
      );
    }
    await Promise.all(asks);
    // Not while they're answering a question, or dragging.
    if (document.querySelector("#approve .confirm") || drag?.lifted) return;
    return page();
  });
  // A change shown at once (the page drawn as it will be), before it's sent; the page is drawn from what's true after.
  const now = () => one.render("#page", async () => page());

  async function act(fn) {
    error = "";
    try {
      await fn();
    } catch (err) {
      error = one.plain(err).title;
      one.tap("error");
    }
    await draw();
  }

  document.addEventListener("click", (e) => {
    if (e.target.closest(".sheet")) return;
    const t = e.target.closest?.("[data-tab], [data-flag], [data-cell], [data-move], [data-more], [data-add], [data-out], [data-passkey], [data-grant], [data-keep], [data-let], [data-refuse], [data-old], [data-joined], [data-notify]");
    if (!t) return;
    const d = t.dataset;
    if (d.tab) (tab = d.tab), now();
    else if (d.flag) (opened.has(d.flag) ? opened.delete(d.flag) : opened.add(d.flag)), now();
    else if (d.cell) tapCell(d.cell);
    else if (d.move) quiet ? (quiet = false) : moveMenu(d.move, t);
    else if (d.let) busy(t, () => one.api("POST", "/v1/devices/approve", { code: d.let, confirm: true }));
    else if (d.refuse) busy(t, () => one.api("POST", "/v1/devices/refuse", { code: d.refuse }));
    else if (d.joined) remove((state.install?.clients || []).find((c) => c.key === d.joined)?.name || "that device", [d.joined], null);
    else if (d.old) removeOld(d.old === "stale" ? { old: drawn.stale } : drawn.cards[d.old]);
    else if (d.more) menu(d.more, t);
    else if (d.grant) act(() => one.api("POST", "/v1/grant", { ...JSON.parse(d.grant), days: 0 }));
    else if (t.hasAttribute("data-out")) signOut();
    else if (t.hasAttribute("data-keep")) keep();
    else if (t.hasAttribute("data-passkey")) act(() => one.api("POST", "/v1/devices/passkey", {}));
    else if (t.hasAttribute("data-add")) addDevice();
    else if (t.hasAttribute("data-notify")) act(async () => (device.notify = await one.notify()));
  });
  document.addEventListener("contextmenu", (e) => {
    const card = e.target.closest?.("button.pcard");
    if (card) return e.preventDefault(), (drag = null), moveMenu(card.dataset.move, { x: e.clientX, y: e.clientY });
    const t = e.target.closest?.(".row.still")?.querySelector("[data-more]");
    if (t) e.preventDefault(), menu(t.dataset.more, { x: e.clientX, y: e.clientY });
  });

  /// What a button does, with it busy until it's done.
  async function busy(b, fn) {
    one.tap();
    one.busy(b);
    await act(fn);
  }

  /// A part of a device switched on or off, which its oned then sets up and starts, or stops: nothing's lost by
  /// switching one off (a WhatsApp link stays, and runs again when it's back on), so nothing asks first.
  /// Switched on again while it's on (`again`, the problem it had), it starts afresh, as Try Again does. What
  /// happens to it shows on its dot (`partNow`), which is drawn again once it's late.
  async function setPart(part, on, again = null) {
    const k = `${part.device} ${part.name ?? part.service}`, at = Date.now();
    asked[k] = { on, again, at, state: "sent" };
    now();
    for (const after of again ? [AGAIN, LATE] : [LATE]) setTimeout(() => asked[k]?.at === at && draw(), after + 500);
    try {
      await one.api("POST", "/v1/service", { device: part.device, name: part.name ?? part.service, on });
      if (asked[k]?.at === at) asked[k].state = "written";
    } catch (err) {
      if (asked[k]?.at === at) asked[k] = { ...asked[k], state: "failed", error: one.plain(err).title };
      // A device that doesn't list its parts shows nothing for it: the page says it instead.
      if (part.service) throw err;
      one.tap("error");
    }
  }

  async function menu(which, at) {
    const browser = which.startsWith("b");
    const item = browser ? drawn.browsers[which.slice(1)] : drawn.cards[which];
    if (!item) return;
    const items = browser ? [] : [{ title: "Rename", icon: "pencil-simple" }];
    // What its sign-ins were let in with, which a new device's sign-in is checked against.
    const signedIn = (browser ? [item] : item.clients).filter((c) => c.sign_in);
    if (signedIn.length) items.push({ title: "Sign-ins…", icon: "key" });
    items.push(item.me ? { title: "Sign Out", icon: "sign-out", danger: true } : { title: "Remove…", icon: "minus-circle", danger: true });
    const i = await one.menu(items, at).catch(() => null);
    if (i == null) return;
    if (items[i].title === "Rename") rename(item);
    else if (items[i].title === "Sign-ins…") signIns(signedIn);
    else if (item.me) signOut();
    else remove(item.name, browser ? [item.key] : item.keys, !browser && item.node && item.online ? item.node.key : null);
  }

  /// What a device's sign-ins signed in with, as recorded when each was let in: a new device that signs in with one is
  /// let in by itself. Each can be removed, by a change every device of theirs takes.
  function signIns(clients) {
    const sheet = one.sheet({ title: "Sign-Ins", done: "Done" });
    sheet.body.innerHTML = `<div class="list">${clients
      .map((c, i) => `<div class="row plain"><div class="main"><div class="title"><span>${one.esc(signInLabel(c.sign_in))}</span></div></div><button class="button plain small" data-forget="${i}">Remove</button></div>`)
      .join("")}</div><p class="footer">A new device that signs in with one of these is let in without asking.</p><div id="problem"></div>`;
    sheet.body.onclick = async (e) => {
      const b = e.target.closest("[data-forget]");
      if (!b) return;
      const back = one.busy(b);
      try {
        await one.api("POST", "/v1/devices/forget-sign-in", { key: clients[b.dataset.forget].key });
        sheet.close();
        one.tap("success");
        draw();
      } catch (err) {
        sheet.body.querySelector("#problem").innerHTML = one.problem({ title: one.plain(err).title });
        back();
      }
    };
  }

  /// Renames a device: its node and the services named for it together, or its app's sign-ins.
  function rename(card) {
    const keys = card.runs ? [card.node, ...card.services].filter(Boolean).map((e) => e.key) : card.clients.map((c) => c.key);
    const sheet = one.sheet({ title: "Rename", done: "Cancel" });
    sheet.body.innerHTML = `<div class="list"><label class="row plain"><input class="field" id="name" aria-label="Name" autocomplete="off" spellcheck="false" enterkeyhint="done"></label></div>
      <div id="problem"></div><div style="text-align:center;margin-top:18px"><button class="button primary" id="go" disabled>Save</button></div>`;
    const input = sheet.body.querySelector("#name"), go = sheet.body.querySelector("#go");
    input.value = card.name;
    input.oninput = () => (go.disabled = !input.value.trim() || input.value.trim() === card.name);
    input.onkeydown = (e) => e.key === "Enter" && !go.disabled && go.click();
    go.onclick = async () => {
      const back = one.busy(go);
      try {
        for (const key of keys) await one.api("POST", "/v1/name", { key, name: input.value.trim() });
        sheet.close();
        one.tap("success");
        draw();
      } catch (e) {
        sheet.body.querySelector("#problem").innerHTML = one.problem({ title: one.plain(e).title });
        back();
      }
    };
    setTimeout(() => input.focus(), 50);
  }

  /// Removes a device, everything on it: it opens nothing new. One that runs oned and is on can also erase what it
  /// keeps first, which it does itself, so only while it's reachable.
  function remove(name, keys, erasable) {
    const sheet = one.sheet({ title: `Remove ${name}?`, done: "Cancel" });
    sheet.body.innerHTML = (erasable
      ? `<div class="list"><label class="row plain"><input type="checkbox" id="erase"><div class="main"><div class="title"><span>Also erase the data</span></div></div></label></div>`
      : "") + `<div id="problem"></div><div style="text-align:center;margin-top:18px"><button class="button primary danger" id="go">Remove</button></div>`;
    const go = sheet.body.querySelector("#go");
    go.onclick = async () => {
      const back = one.busy(go);
      try {
        if (sheet.body.querySelector("#erase")?.checked) await one.api("POST", "/v1/erase", { key: erasable });
        for (const key of keys) await one.api("POST", "/v1/remove", { key });
        sheet.close();
        one.tap("success");
        draw();
      } catch (e) {
        sheet.body.querySelector("#problem").innerHTML = one.problem({ title: one.plain(e).title });
        back();
      }
    };
  }

  async function removeOld(card) {
    const n = card.old.length;
    const of = card.name ? ` of ${card.name}` : "";
    if (!(await one.alert({ title: `Remove ${n} old sign-in${n > 1 ? "s" : ""}${of}?`, action: "Remove", danger: true }))) return;
    act(async () => {
      for (const c of card.old) await one.api("POST", "/v1/remove", { key: c.key });
    });
  }

  async function signOut() {
    if (await one.alert({ title: `Sign Out of ${yours} on this device?`, action: "Sign Out", danger: true })) one.signOut();
  }

  /// The three ways a device joins: an app that signs in and asks to be approved, a server by one line, a browser.
  function addDevice() {
    const address = state.install?.settings?.address || "";
    const { body } = one.sheet({ title: "Add a Device" });
    const way = (icon, title, sub, extra = "") =>
      `<div class="row plain add-way"><span class="tile">${one.icon(icon)}</span><div class="main"><div class="title"><span>${one.esc(title)}</span></div><div class="sub">${one.esc(sub)}</div>${extra}</div></div>`;
    const line = (text) => `<div class="line"><span>${one.esc(text)}</span>${one.copyButton(text, { label: "" })}</div>`;
    const server = state.config?.install
      ? way("hard-drives", "A server", "Run this on it. It joins as you, with everything you can see and do.", '<div id="server-line">' + one.loading("Making a code") + "</div>")
      : "";
    body.innerHTML = '<div class="list">' +
      way("device-mobile", "Phone, tablet or computer", `Install ${state.config?.name || "the app"} and sign in. It shows up here to approve.`) +
      server +
      (address ? way("browser", "A browser", "Open this and sign in. It shows up here to approve.", line(address)) : "") +
      "</div>";
    if (!server) return;
    one.api("POST", "/v1/pair", {}).then(
      ({ code }) => (body.querySelector("#server-line").innerHTML = line(`${state.config.install} && ~/.local/bin/${state.config.cli} join ${code}`)),
      (err) => (body.querySelector("#server-line").innerHTML = one.problem({ title: one.plain(err).title })),
    );
  }

  /// A device's code from its QR, not waiting at the top: which device it is, and Approve.
  async function approveScanned(typed) {
    const code = String(typed).toUpperCase().replace(/[^A-Z2-7]/g, "");
    if (code.length !== 8) return;
    const ask = document.querySelector("#approve");
    let r;
    try {
      r = await one.api("POST", "/v1/devices/approve", { code });
    } catch (err) {
      return void (ask.innerHTML = one.problem({ title: one.plain(err).title }));
    }
    one.confirm(ask, {
      title: `Approve ${r.device}?`,
      detail: one.esc(r.new ? `${r.person}’s first device. They join ${yours}.` : "It can open everything you can."),
      action: "Approve",
      run: () => one.api("POST", "/v1/devices/approve", { code, confirm: true }),
    }).then((done) => done && draw());
    ask.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  one.on("changed", draw);
  draw().then(() => {
    // One it already asks about at the top is answered there.
    const same = (r) => r.code.replace(" ", "") === String(scanned).toUpperCase().replace(/[^A-Z2-7]/g, "");
    if (scanned && !waiting.some(same)) approveScanned(scanned);
    scanned = "";
    if (keepAsked && device.keys) keep(keepAsked), (keepAsked = null);
  });
</script>
