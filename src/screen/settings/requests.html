<div class="large-title">Requests</div>
<div id="requests"></div>
<div id="error" class="footer error"></div>
<script>
  // What waits for this person: items apps and agents asked them for, and group invites.
  const esc = one.esc;
  const section = (title, rows) => (rows.length ? `<h2 class="section">${title}</h2><div class="list">${rows.join("")}</div>` : "");
  const row = (icon, title, sub, button) => `<div class="row still">${icon}<div class="main"><div class="title"><span>${esc(title)}</span></div>` +
    (sub ? `<div class="sub wrap">${esc(sub)}</div>` : "") + `</div>${button}</div>`;
  const draw = () => one.render("#requests", async () => {
    const [state, apps, asked] = await Promise.all([one.api("GET", "/v1/state"), one.api("GET", "/v1/apps"), one.api("GET", "/v1/vault/requests")]);
    const i = state.install || {}, me = state.user?.id;
    const app = (name) => apps.find((a) => a.name === name) || { name };
    const userName = (id) => (i.users || []).find((u) => u.id === id)?.name || "Someone";
    const vault = asked.filter((r) => r.state === "waiting").map((r) => row(one.appIcon(app(r.app), 32), `${app(r.app).title || r.app} wants ${r.title || ""}`,
      [r.agent || r.by, r.why].filter(Boolean).join(" · "), `<button class="button capsule filled" data-request="${esc(r.id)}" data-scope="${esc(r.scope)}">Choose</button>`));
    const invites = (i.groups || []).filter((g) => g.invited.some((x) => x.user === me)).map((g) => row(one.avatar(g.id, g.name), g.name,
      new Intl.ListFormat(undefined, { type: "conjunction" }).format(g.members.map((m) => userName(m.user))), `<button class="button capsule filled" data-join="${esc(g.id)}">Join</button>`));
    if (!vault.length && !invites.length) return one.empty("No requests.");
    return section("Vault", vault) + section("Invites", invites);
  });

  // A row gone, or back: with the last of its section, the section too.
  const shown = (row, on) => {
    row.style.display = on ? "" : "none";
    const list = row.parentElement, left = [...list.children].some((r) => r.style.display !== "none");
    list.style.display = list.previousElementSibling.style.display = left ? "" : "none";
  };

  // Each button does its one thing, and its row goes at once: Join as it're tapped, put back with why if
  // they fail; Choose once the item's chosen.
  document.getElementById("requests").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-request], button[data-join]");
    if (!b || b.disabled) return;
    const error = document.getElementById("error"), row = b.closest(".row");
    error.textContent = "";
    b.disabled = true;
    try {
      if (b.dataset.request) {
        if (await one.request(b.dataset.scope, b.dataset.request)) shown(row, false);
      } else {
        shown(row, false);
        one.tap();
        if (b.dataset.join) await one.api("POST", "/v1/accept", { group: b.dataset.join });
      }
    } catch (err) {
      shown(row, true);
      error.textContent = one.plain(err).title;
    }
    b.disabled = false;
    draw();
  });
  one.largeTitle("Requests");
  one.on("changed", draw);
  draw();
</script>
