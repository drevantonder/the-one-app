<div class="large-title">Requests</div>
<div id="requests"></div>
<div id="error" class="footer error"></div>
<script>
  // What waits for this person: items apps and agents asked them for, group invites, and servers offered to them to
  // trust.
  const esc = one.esc;
  const section = (title, rows) => (rows.length ? `<h2 class="section">${title}</h2><div class="list">${rows.join("")}</div>` : "");
  const row = (icon, title, sub, button) => `<div class="row">${icon}<div class="main"><div class="title"><span>${esc(title)}</span></div>` +
    (sub ? `<div class="sub wrap">${esc(sub)}</div>` : "") + `</div>${button}</div>`;
  const draw = () => one.render("#requests", async () => {
    const [state, apps, asked] = await Promise.all([one.api("GET", "/v1/state"), one.api("GET", "/v1/apps"), one.api("GET", "/v1/vault/requests")]);
    const i = state.install || {}, me = state.user?.id;
    const app = (name) => apps.find((a) => a.name === name) || { name };
    const userName = (id) => (i.users || []).find((u) => u.id === id)?.name || "Someone";
    const mine = [`user:${me}`, ...(i.groups || []).filter((g) => g.role).map((g) => `group:${g.id}`)];
    const vault = asked.filter((r) => r.state === "waiting").map((r) => row(one.appIcon(app(r.app), 32), `${app(r.app).title || r.app} wants ${r.title || r.name || ""}`,
      [r.agent || r.by, r.why].filter(Boolean).join(" · "), `<button class="button capsule filled" data-request="${esc(r.id)}" data-scope="${esc(r.scope)}">Choose</button>`));
    const invites = (i.groups || []).filter((g) => g.invited.some((x) => x.user === me)).map((g) => row(one.avatar(g.id, g.name), g.name,
      new Intl.ListFormat(undefined, { type: "conjunction" }).format(g.members.map((m) => userName(m.user))), `<button class="button capsule filled" data-join="${esc(g.id)}">Join</button>`));
    const servers = (i.servers || []).filter((s) => !s.privileged && !s.owners.includes(`user:${me}`) && s.users.some((u) => mine.includes(u)) && !s.trusted_by.includes(me))
      .map((s) => row(`<div class="icon grey">${one.icon("hard-drives")}</div>`, s.name.replace(/\.local$/, ""), "Lets it keep your own data", `<button class="button capsule" data-trust="${esc(s.key)}">Trust</button>`));
    if (!vault.length && !invites.length && !servers.length) return one.empty({ icon: "tray", title: "Nothing waits for you." });
    return section("Vault", vault) + section("Invites", invites) + section("Devices", servers);
  });

  // Each button does its one thing, and the list shows what's left.
  document.getElementById("requests").addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-request], button[data-join], button[data-trust]");
    if (!b || b.disabled) return;
    const error = document.getElementById("error");
    error.textContent = "";
    b.disabled = true;
    try {
      if (b.dataset.request) await one.request(b.dataset.scope, b.dataset.request);
      if (b.dataset.join) await one.api("POST", "/v1/accept", { group: b.dataset.join });
      if (b.dataset.trust) await one.api("POST", "/v1/trust", { server: b.dataset.trust, trust: true });
    } catch (err) {
      error.textContent = one.plain(err).title;
    }
    b.disabled = false;
    draw();
  });
  one.title("Requests");
  one.on("changed", draw);
  draw();
</script>
