<style>
  .kind { font-size: 20px; font-weight: 600; margin: 28px 4px 0; }
  h2.section { display: flex; align-items: center; gap: 6px; }
  h2.section .app-icon { --size: 18px !important; width: 18px; height: 18px; }
</style>
<div class="large-title">Labs</div>
<div id="labs"></div>
<script>
  // Features still being built, which an admin switches on for everyone (src/labs.rs): the core's first, then each
  // app's and each service's under its name.
  let error = "";

  const draw = () => one.render("#labs", async () => {
    const labs = await one.api("GET", "/v1/labs");
    const row = (l) => `<label class="row plain"><div class="main"><div class="title"><span>${one.esc(l.title)}</span></div>${l.description ? `<div class="sub wrap">${one.esc(l.description)}</div>` : ""}</div><input type="checkbox" class="switch" data-setting="${one.esc(l.setting)}"${l.on ? " checked" : ""}></label>`;
    const groups = (kind) => {
      const by = new Map();
      for (const l of labs.filter((l) => l[kind])) by.set(l[kind].name, [...(by.get(l[kind].name) || []), l]);
      return [...by.values()].map((ls) => `<h2 class="section">${one.appIcon(ls[0][kind], 18)}${one.esc(ls[0][kind].title)}</h2><div class="list">${ls.map(row).join("")}</div>`).join("");
    };
    const core = labs.filter((l) => !l.app && !l.service);
    const apps = groups("app"), services = groups("service");
    if (!labs.length) return one.empty("Nothing to try right now.");
    return `${core.length ? `<div class="list">${core.map(row).join("")}</div>` : ""}
      ${apps ? `<div class="kind">Apps</div>${apps}` : ""}
      ${services ? `<div class="kind">Services</div>${services}` : ""}
      ${error ? one.problem({ title: error }) : ""}`;
  });

  document.addEventListener("change", async (e) => {
    const setting = e.target.dataset?.setting;
    if (!setting) return;
    error = "";
    try {
      await one.api("POST", "/v1/settings", { name: setting, value: e.target.checked ? "on" : null });
    } catch (err) {
      error = one.plain(err).title;
    }
    draw();
  });

  one.largeTitle("Labs");
  one.on("changed", draw);
  draw();
</script>
