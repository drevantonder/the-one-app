<div id="page"></div>
<style>
  .action-row { color: var(--tint); cursor: pointer; }
  .danger-row { color: var(--danger); cursor: pointer; }
  .action-row.off, .danger-row.off { opacity: 0.4; pointer-events: none; }
  .field { flex: 1; min-width: 0; font: inherit; border: 0; outline: none; background: none; color: var(--text); padding: 0; }
  .add { color: var(--tint); width: 24px; height: 24px; }
  #page h2.section:first-child { margin-top: 8px; }
</style>
<script>
  // This person, with their handle, then the groups they're in and are invited to, and making one; or, given `group`,
  // that group's handle, members and invites, each member's role a button on their row for its admins. The last
  // admin's role can't change. A handle is changed in a sheet: theirs, or a group's by its admins.
  const group = one.params?.group;
  // Groups' own icon, as Settings draws it.
  const groupIcon = one.appIcon({ name: "groups", icon: "users-three", color: "#34c759" }, 34);
  let state;
  // Roles changed but not yet taken in, shown at once: null for someone being removed.
  const pending = {};
  let error = "";

  const names = (list) => {
    const n = list.map((m) => userName(m.user));
    return n.length < 2 ? n.join("") : `${n.slice(0, -1).join(", ")} and ${n.at(-1)}`;
  };
  const userName = (id) => state.install?.users.find((u) => u.id === id)?.name || "Someone";
  const roleName = (r) => (r === "admin" ? "Admin" : "Member");
  const footer = (text, bad) => (!text ? "" : bad ? one.problem({ title: text }) : `<p class="footer">${one.esc(text)}</p>`);
  const person = (id, name, trailing, sub = "") =>
    `<div class="row still">${one.avatar(id, name)}<div class="main"><div class="title"><span>${one.esc(name)}${id === state.user?.id ? " (you)" : ""}</span></div>${sub ? `<div class="sub">${one.esc(sub)}</div>` : ""}</div>${trailing}</div>`;

  async function load() {
    state = await one.api("GET", "/v1/state");
  }

  // Every group they're in, and those they're invited to.
  function list() {
    const me = state.user?.id;
    const groups = state.install?.groups || [];
    const invited = groups.filter((g) => g.invited.some((m) => m.user === me));
    const mine = groups.filter((g) => g.role);
    one.largeTitle("Groups");
    const you = state.install?.users.find((u) => u.id === me);
    let html = '<div class="large-title">Groups</div>';
    if (you?.handle) {
      html += `<div class="list"><a class="row" data-handle>${one.avatar(you.id, you.name)}<div class="main"><div class="title"><span>${one.esc(you.name)}</span></div>
        <div class="sub">@${one.esc(you.handle)}</div></div><span class="chev">›</span></a></div><h2 class="section">Groups</h2>`;
    }
    if (invited.length) {
      html += '<h2 class="section">Invited</h2><div class="list">' + invited.map((g) => `<div class="row still">${groupIcon}
        <div class="main"><div class="title"><span>${one.esc(g.name)}</span></div><div class="sub">${one.esc(names(g.members))}</div></div>
        <button class="button capsule filled" data-accept="${one.esc(g.id)}">Join</button></div>`).join("") + "</div>";
    }
    if (!mine.length && !invited.length) {
      return html + one.empty("A group shares its apps and data, on a page of its own.", { label: "New Group", run: () => create() }) + footer(error, true);
    }
    if (mine.length) {
      html += (invited.length ? '<h2 class="section">Yours</h2>' : "") + '<div class="list">' + mine.map((g) => `<a class="row" data-group="${one.esc(g.id)}">${groupIcon}
        <div class="main"><div class="title"><span>${one.esc(g.name)}</span></div><div class="sub">${one.esc(names(g.members))}</div></div>
        ${g.role === "admin" ? '<span class="note">Admin</span>' : ""}<span class="chev">›</span></a>`).join("") + "</div>";
    }
    return html + '<div class="list" style="margin-top:20px"><a class="row plain action-row" data-create>New Group</a></div>' + footer(error, true);
  }

  // One group: its members, its invites, and inviting or leaving.
  function groupPage() {
    const me = state.user?.id;
    const g = state.install?.groups.find((x) => x.id === group);
    if (!g || (!g.role && !g.invited.some((m) => m.user === me))) return one.notFound({ title: "You're not in this group." });
    one.largeTitle(g.name);
    const admin = g.role === "admin";
    const admins = g.members.filter((m) => m.role === "admin").map((m) => m.user);
    const lastAdmin = admins.length === 1 && admins[0] === me;
    const members = g.members.filter((m) => pending[m.user] !== null).sort((x, y) => (y.user === me) - (x.user === me) || userName(x.user).localeCompare(userName(y.user)));
    const rows = members.map((m) => {
      const role = pending[m.user] || m.role;
      const leave = m.user === me ? `Leave ${g.name}` : `Remove from ${g.name}`;
      const trailing = admin && !(role === "admin" && admins.length === 1)
        ? `<label class="pick">${roleName(role)}<select aria-label="${one.esc(userName(m.user))}'s role" data-member="${one.esc(m.user)}">
            <option value="admin"${role === "admin" ? " selected" : ""}>Admin</option><option value="member"${role === "member" ? " selected" : ""}>Member</option>
            <option disabled>──────</option><option value="">${one.esc(leave)}</option></select></label>`
        : `<span class="note">${roleName(role)}</span>`;
      return person(m.user, userName(m.user), trailing);
    });
    let html = `<div class="large-title">${one.esc(g.name)}</div>`;
    if (g.handle) {
      html += admin
        ? `<div class="list"><a class="row" data-handle="${one.esc(g.id)}"><div class="main"><div class="title"><span>Handle</span></div></div><span class="note">@${one.esc(g.handle)}</span><span class="chev">›</span></a></div>`
        : `<div class="list"><div class="row still"><div class="main"><div class="title"><span>Handle</span></div></div><span class="note">@${one.esc(g.handle)}</span></div></div>`;
    }
    html += `<h2 class="section">Members</h2><div class="list">${rows.join("")}</div>`;
    html += error ? footer(error, true) : !admin ? footer("Only its admins change who's in it.") : admins.length === 1 ? footer("Make someone else an admin before you step down.") : "";
    if (g.invited.length) {
      html += '<h2 class="section">Invited</h2><div class="list">' + g.invited.map((m) => person(m.user, userName(m.user), '<span class="note">Waiting</span>')).join("") + "</div>";
    }
    const stuck = lastAdmin && g.members.length > 1;
    html += '<div class="list" style="margin-top:20px">' + (admin ? '<a class="row plain action-row" data-invite>Invite Someone…</a>' : "")
      + `<a class="row plain danger-row${stuck ? " off" : ""}" data-leave>Leave ${one.esc(g.name)}</a></div>`;
    if (stuck) html += footer("Make someone else an admin before you leave.");
    return html;
  }

  const draw = () => one.render("#page", async () => {
    await load();
    return group ? groupPage() : list();
  });

  // Changes a member's role, or with none removes them: shown at once, and undone with why if it fails.
  async function change(user, role) {
    error = "";
    pending[user] = role;
    one.render("#page", async () => (group ? groupPage() : list()));
    try {
      await one.api("POST", "/v1/member", { group, user, role });
      delete pending[user];
      // Leaving, there's nothing left to show here.
      if (user === state.user?.id && role === null) return history.length > 1 ? history.back() : one.open("groups");
    } catch (e) {
      delete pending[user];
      error = one.plain(e).title;
    }
    draw();
  }

  // Joining says so in its button until the group shows among theirs.
  async function accept(id, button) {
    if (button.disabled) return;
    const back = one.busy(button);
    error = "";
    try {
      await one.api("POST", "/v1/accept", { group: id });
      one.tap("success");
    } catch (e) {
      error = one.plain(e).title;
      back();
    }
    draw();
  }

  // A new group, with them its first admin; then its page.
  function create() {
    const sheet = one.sheet({ title: "New Group", done: "Cancel" });
    sheet.body.innerHTML = `<div class="list"><label class="row plain"><input class="field" id="name" placeholder="Name" autocomplete="off" enterkeyhint="done"></label></div>
      <p class="footer">You'll be its first admin.</p><div id="problem"></div><div style="text-align:center;margin-top:18px"><button class="button primary" id="go" disabled>Create</button></div>`;
    const name = sheet.body.querySelector("#name"), go = sheet.body.querySelector("#go");
    name.oninput = () => (go.disabled = !name.value.trim());
    name.onkeydown = (e) => e.key === "Enter" && !go.disabled && go.click();
    go.onclick = async () => {
      const back = one.busy(go);
      try {
        const made = await one.api("POST", "/v1/group", { name: name.value.trim() });
        sheet.close();
        one.tap("success");
        one.open("groups", { group: made.group });
      } catch (e) {
        sheet.body.querySelector("#problem").innerHTML = one.problem({ title: one.plain(e).title });
        back();
        go.disabled = false;
      }
    };
    setTimeout(() => name.focus(), 50);
  }

  // Inviting someone already in the install: find them by name, tap one (or Return for the first) to invite.
  function invite() {
    const g = state.install.groups.find((x) => x.id === group);
    const others = [...state.install.users].sort((x, y) => x.name.localeCompare(y.name)).filter((u) => !g.members.some((m) => m.user === u.id) && !g.invited.some((m) => m.user === u.id));
    let role = "member", query = "", matches = others;
    const sheet = one.sheet({ title: `Invite to ${g.name}`, done: "Cancel" });
    sheet.body.innerHTML = `<div class="segmented" id="as"><button data-role="member" class="on">Member</button><button data-role="admin">Admin</button></div>
      <div id="find"></div><div id="people"></div>`;
    const people = sheet.body.querySelector("#people");
    const show = (note = "") => {
      matches = others.filter((u) => u.name.toLowerCase().includes(query.trim().toLowerCase()));
      const rows = matches.map((u) => `<a class="row" data-user="${one.esc(u.id)}">${one.avatar(u.id, u.name)}<div class="main"><div class="title"><span>${one.esc(u.name)}</span></div>
        ${u.role === "admin" ? `<div class="sub">Admin of ${one.esc(one.config.yours)}</div>` : ""}</div>${one.icon("plus-circle-fill", "add")}</a>`);
      people.innerHTML = (rows.length ? `<div class="list">${rows.join("")}</div>` : others.length ? `<div class="list"><div class="row plain muted">No one called “${one.esc(query.trim())}”.</div></div>` : "")
        + (note ? footer(note, true) : footer(others.length ? "They join once they accept." : "Everyone is in this group already."));
    };
    // Shown among the invited at once, as the sheet goes; taken out again, with why, if it fails.
    const send = async (user) => {
      const invite = { user, role };
      error = "";
      g.invited.push(invite);
      one.tap("success");
      sheet.close();
      one.render("#page", async () => groupPage());
      try {
        await one.api("POST", "/v1/invite", { group, user, role });
      } catch (e) {
        g.invited.splice(g.invited.indexOf(invite), 1);
        error = one.plain(e).title;
      }
      draw();
    };
    sheet.body.querySelector("#as").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      role = b.dataset.role;
      sheet.body.querySelectorAll("#as button").forEach((x) => x.classList.toggle("on", x === b));
    };
    people.onclick = (e) => {
      const r = e.target.closest("[data-user]");
      if (r) send(r.dataset.user);
    };
    const input = one.search(sheet.body.querySelector("#find"), { placeholder: "Find people", delay: 0, onSearch: (q) => ((query = q), show()) });
    input.addEventListener("keydown", (e) => e.key === "Enter" && matches[0] && send(matches[0].id));
    show();
  }

  document.addEventListener("change", (e) => e.target.dataset.member && change(e.target.dataset.member, e.target.value || null));
  // A new handle for them, or with `id` for that group: lowercase as it's typed, saved once it's one.
  function handle(id) {
    const g = id && state.install.groups.find((x) => x.id === id);
    const was = g ? g.handle : state.install.users.find((u) => u.id === state.user?.id)?.handle || "";
    const sheet = one.sheet({ title: "Handle", done: "Cancel" });
    sheet.body.innerHTML = `<div class="list"><label class="row plain"><span class="muted">@</span><input class="field" id="handle" autocapitalize="none" autocomplete="off" spellcheck="false" enterkeyhint="done"></label></div>
      <p class="footer">What apps call ${g ? one.esc(g.name) : "you"} by, like Repos' addresses, which move with it. Lowercase letters, digits and hyphens.</p>
      <div id="problem"></div><div style="text-align:center;margin-top:18px"><button class="button primary" id="go" disabled>Save</button></div>`;
    const input = sheet.body.querySelector("#handle"), go = sheet.body.querySelector("#go");
    input.value = was;
    const ok = (h) => /^[a-z0-9]+(-[a-z0-9]+)*$/.test(h) && h.length <= 39;
    input.oninput = () => {
      input.value = input.value.toLowerCase().replace(/[\s_]/g, "-");
      go.disabled = !ok(input.value) || input.value === was;
    };
    input.onkeydown = (e) => e.key === "Enter" && !go.disabled && go.click();
    go.onclick = async () => {
      const back = one.busy(go);
      try {
        await one.api("POST", "/v1/handle", { handle: input.value, ...(g ? { group: g.id } : {}) });
        sheet.close();
        one.tap("success");
        draw();
      } catch (e) {
        sheet.body.querySelector("#problem").innerHTML = one.problem({ title: one.plain(e).title });
        back();
      }
    };
    setTimeout(() => input.focus(), 50);
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest?.("#page [data-accept], #page [data-group], #page [data-create], #page [data-invite], #page [data-leave], #page [data-handle]");
    if (!t) return;
    const d = t.dataset;
    if ("handle" in d) handle(d.handle);
    else if (d.accept) accept(d.accept, t);
    else if (d.group) one.open("groups", { group: d.group });
    else if ("create" in d) create();
    else if ("invite" in d) invite();
    else change(state.user?.id, null);
  });

  one.on("changed", draw);
  draw();
</script>
