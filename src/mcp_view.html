<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The MCP Apps view `one mcp` serves (src/mcp_apps.rs): widgets drawn from their trees, or an
     app's screen in a frame whose bridge this page answers through the chat client. -->
<style>
  :root { color-scheme: light dark; --fg: light-dark(#1c1c1e, #f2f2f7); --muted: light-dark(#6e6e73, #98989d); --line: light-dark(#e5e5ea, #38383a);
    --card: light-dark(#ffffff, #1c1c1e); --fill: light-dark(#e9e9ee, #2c2c2e); --accent: #9e6e06; --good: #34c759; --warn: #ff9f0a; --bad: #ff3b30;
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; padding: 4px; color: var(--fg); background: transparent; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .cards .w-card { --w-card: var(--card); --w-muted: var(--muted); box-shadow: 0 0 0 1px var(--line); border-radius: 16px; padding: 14px; font-size: 14px; }
  iframe { border: 0; width: 100%; display: block; min-height: 120px; }
  .empty { color: var(--muted); padding: 12px; }
</style>
</head>
<body>
<div id="out" class="empty">Loading…</div>
<script>/*widgets.js*/</script>
<script>
(() => {
  let next = 1, frame = null, shown = null;
  const pending = new Map(), out = document.getElementById("out");
  const post = (msg) => parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => { const id = next++; pending.set(id, { resolve, reject }); post({ id, method, params }); });
  const notify = (method, params) => post(params === undefined ? { method } : { method, params });
  const call = async (name, args) => {
    const r = await request("tools/call", { name, arguments: args });
    if (r.isError) throw new Error((r.content || []).map((c) => c.text).join(" ") || "failed");
    if (r.structuredContent) return r.structuredContent;
    const text = (r.content || []).map((c) => c.text || "").join("");
    try { return JSON.parse(text); } catch { return text; }
  };

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (frame && e.source === frame.contentWindow) return fromScreen(m);
    if (e.source !== parent || !m || m.jsonrpc !== "2.0") return;
    if (m.method === undefined) {
      const p = pending.get(m.id);
      if (p) { pending.delete(m.id); m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result); }
      return;
    }
    if (m.method === "ui/notifications/tool-result") show(m.params);
    if (m.method === "ui/notifications/host-context-changed") theme(m.params);
    if (m.method === "ui/resource-teardown" && m.id !== undefined) post({ id: m.id, result: {} });
  });

  function theme(ctx) {
    if (ctx?.theme) document.documentElement.style.colorScheme = ctx.theme;
  }

  function show(result) {
    const s = result?.structuredContent;
    if (!s) { out.className = "empty"; out.textContent = (result?.content || []).map((c) => c.text || "").join("\n"); return size(); }
    shown = s;
    if (s.html !== undefined) return screen(s);
    out.className = "cards";
    out.replaceChildren(...(s.widgets || []).map(card));
    if (!(s.widgets || []).length) { out.className = "empty"; out.textContent = "No widgets."; }
    size();
  }

  const card = (w) => oneWidgets.card(w, { run: act, follow });

  // A button or toggle: runs the app's operation as the person, then draws the widgets again; → the error's text.
  async function act(app, op, input) {
    try {
      await call(`${app}_${op}`, input);
      const one = shown?.widgets?.length === 1 ? shown.widgets[0] : null;
      show({ structuredContent: await call("widgets_show", { app: one?.app, widget: one?.widget }) });
    } catch (err) {
      return err.message;
    }
  }

  // A link: a web page through the chat, or one of the app's screens, opened here.
  async function follow(link, w) {
    if (typeof link === "string") return request("ui/open-link", { url: link }).catch(() => {});
    show({ structuredContent: await call("screens_open", { app: w.app, screen: link.screen, params: link.params || {} }) });
  }

  // An app's screen, in a frame whose `one` bridge posts here (src/screen/bridge.js): its calls go to the app's tools
  // through the chat.
  function screen(s) {
    const shim = `<script>new ResizeObserver(() => parent.postMessage({ oneHeight: document.documentElement.scrollHeight }, "*")).observe(document.documentElement);<\/script>`;
    frame = document.createElement("iframe");
    frame.srcdoc = s.html.replace("<head>", "<head>" + shim);
    out.className = "";
    out.replaceChildren(frame);
    size();
  }

  async function fromScreen(m) {
    if (m?.oneHeight) { frame.style.height = m.oneHeight + "px"; return size(); }
    if (!m?.one) return;
    const reply = (ok, error) => frame.contentWindow.postMessage({ oneReply: m.id, ok, error }, "*");
    const msg = m.one;
    try {
      switch (msg.type) {
        case "call": return reply(await call(`${shown.app}_${msg.op}`, msg.input || {}));
        // Another screen of the app takes this one's place: a chat has no stack of screens, or sheets.
        case "open": return show({ structuredContent: await call("screens_open", { app: msg.app || shown.app, screen: msg.screen, params: msg.params || {} }) });
        case "copy": await navigator.clipboard.writeText(msg.text); return reply(null);
        case "link": await request("ui/open-link", { url: msg.url }); return reply(null);
        case "alert": return reply(msg.action ? confirm([msg.title, msg.text].filter(Boolean).join("\n\n")) : null);
        case "close": case "title": case "icon": case "haptic": return reply(null);
        case "menu": case "save": case "preview": case "scan": case "vault": case "icons":
          return reply(undefined, "Open this in the app to do that.");
        case "request": case "api": case "signOut": case "appearance": case "device":
          return reply(undefined, "Only Settings can do that.");
        default: return reply(undefined, "Unknown message");
      }
    } catch (err) {
      reply(undefined, err.message);
    }
  }

  function size() {
    requestAnimationFrame(() => notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight }));
  }
  new ResizeObserver(size).observe(document.body);

  request("ui/initialize", { appInfo: { name: "view", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then((init) => { theme(init?.hostContext); notify("ui/notifications/initialized"); })
    .catch(() => {});
})();
</script>
</body>
</html>
