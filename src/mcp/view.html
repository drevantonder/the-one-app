<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The MCP Apps view `one mcp` serves (src/mcp/apps.rs): widgets drawn from their trees by @one/ui's WidgetCard, as
     the pages draw them, and apps' screens, each in a sandboxed frame whose bridge this page answers through the chat
     client, as the web client answers it, with @one/ui's menus, alerts and sheets (src/screen/host.js).
     src/mcp/apps.rs writes those files in. -->
<style>/*ui.css*/</style>
<style>
  html, body { background: transparent; }
  /* The chat's frame is the edge: and Radix's scroll lock, while a sheet's open, mustn't give the page @one/ui's padding. */
  body, html body[data-scroll-locked] { padding: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding: 8px; }
  .cards > .wait { opacity: .5; }
  iframe { border: 0; width: 100%; display: block; min-height: 120px; }
  .empty { color: var(--muted-foreground); padding: 12px; font-size: 14px; }
  .problem { padding: 8px; }
  /* What's coming: a grey card where it will be. A screen shows it until it says how tall it is, then grows to it. */
  .ph { height: 160px; background: var(--muted); animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .ph { animation: none; } }
  .frame { position: relative; }
  .frame > .ph { position: absolute; inset: 0; height: auto; }
  .frame > iframe { height: 160px; opacity: 0; transition: height .2s ease, opacity .2s; }
  .frame.ready > iframe { opacity: 1; }
  /* Back, over what was opened from what's under it, with its title. */
  .nav[hidden], [hidden] { display: none !important; }
  .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 32px; padding: 4px 8px 0; font-size: 14px; }
  .nav > :first-child { justify-self: start; }
  .nav .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* A sheet or menu needs room: the view is tall enough for one while it's open. */
  body.over { min-height: min(560px, var(--room, 560px)); }
</style>
</head>
<body>
<div id="out"><div class="ph" role="status" aria-label="Loading"></div></div>
<script>window.__one = { host: (m) => window.__oneView(m) };</script>
<script>/*bridge.js*/</script>
<script>/*host.js*/</script>
<script>/*ui.js*/</script>
<script>
(() => {
  let next = 1, appearance = "automatic", torn = false, room = 640;
  const pending = new Map(), out = document.getElementById("out");
  const post = (msg) => parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((resolve, reject) => { const id = next++; pending.set(id, { resolve, reject }); post({ id, method, params }); });
  const notify = (method, params) => post(params === undefined ? { method } : { method, params });
  const call = async (name, args) => {
    const r = await request("tools/call", { name, arguments: args });
    if (r.isError) throw new Error((r.content || []).map((c) => c.text).join(" ") || "failed");
    if (r.structuredContent) return r.structuredContent;
    const text = (r.content || []).map((c) => c.text || "").join("");
    try { return JSON.parse(text); } catch { return text; }
  };
  // An app's tool, as a screen or widget calls it: pressing it there is the user agreeing to it.
  const run = async (app, tool, input) => (await call("screens_call", { app, tool, input, confirm: true }))?.ok ?? null;
  const looks = oneHost.scheme();
  const React = OneUI.react, { createRoot } = OneUI["react-dom/client"], { flushSync } = OneUI["react-dom"], ui = OneUI["@one/ui"], h = React.createElement;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // What's shown: tools' results, widgets or an app's screen, each opened from the one under it, as layers kept as
  // they are under the top one, so Back finds them as they were. `args`: what widgets were asked for with.
  const stack = [];
  const top = () => stack.at(-1);
  const nav = Object.assign(document.createElement("div"), { hidden: true });
  const navRoot = createRoot(nav);

  // This page's own bridge (@one/ui's icons, a widget's copy).
  const icons = async (names) => (await call("screens_icons", { names: (Array.isArray(names) ? names : []).map(String) }))?.paths || {};
  window.__oneView = (m) => (m.type === "icons" ? icons(m.names) : m.type === "copy" ? navigator.clipboard.writeText(String(m.text ?? "")) : Promise.resolve(null));

  let args = {};
  window.addEventListener("message", (e) => {
    const m = e.data;
    const frame = [...document.querySelectorAll("iframe")].find((f) => f.contentWindow === e.source);
    if (frame) return fromScreen(frame.__screen, m);
    if (e.source !== parent || !m || m.jsonrpc !== "2.0") return;
    if (m.method === undefined) {
      const p = pending.get(m.id);
      if (p) { pending.delete(m.id); m.error ? p.reject(new Error(m.error.message)) : p.resolve(m.result); }
      return;
    }
    if (m.method === "ui/notifications/tool-input") args = m.params?.arguments || {};
    if (m.method === "ui/notifications/tool-result") show(m.params, true);
    if (m.method === "ui/notifications/tool-cancelled") nothing("Stopped.");
    if (m.method === "ui/notifications/host-context-changed") context(m.params);
    if (m.method === "ui/resource-teardown" && m.id !== undefined) (torn = true), post({ id: m.id, result: {} });
  });

  // What the chat says about where this view is: how tall it may be, and its light or dark.
  function context(ctx) {
    if (ctx?.containerDimensions) fit(ctx.containerDimensions);
    theme(ctx);
  }

  // A screen scrolls in its own frame rather than growing past what shows, so its sheets and dialogs land in view and
  // its sticky parts stick. Where a chat sets no limit, a long screen still shouldn't push the conversation away.
  function fit({ height, maxHeight }) {
    room = height ?? Math.min(maxHeight ?? 640, 640);
    document.documentElement.style.setProperty("--room", room + "px");
    document.querySelectorAll(".frame > iframe").forEach((f) => f.__tall && tall(f));
  }
  function tall(frame) {
    frame.style.height = (frame.__screen.sheet ? frame.__tall : Math.min(frame.__tall, room - (nav.hidden ? 0 : nav.offsetHeight))) + "px";
  }

  // The chat's light or dark, here and in every screen's frame.
  function theme(ctx) {
    if (!ctx?.theme) return;
    appearance = ["light", "dark"].includes(ctx.theme) ? ctx.theme : "automatic";
    looks(document, appearance);
    document.querySelectorAll("iframe").forEach((f) => f.contentWindow?.postMessage({ oneScheme: appearance }, "*"));
  }

  // A tool's result, over what's shown (or in its place: the chat's own); text where there's nothing to draw.
  function show(result, fresh) {
    const s = result?.structuredContent;
    if (fresh) stack.length = 0;
    if (!s) return nothing((result?.content || []).map((c) => c.text || "").join("\n"), result?.isError);
    const el = s.html !== undefined ? mount(s) : widgets(s);
    if (!stack.length) out.className = "", out.replaceChildren(nav);
    if (top()) top().el.hidden = true;
    stack.push({ s, el, args: { ...args } });
    out.append(el);
    bar();
    watch();
    aloneIfLate(top());
  }

  // In place of everything: a grey line, or what went wrong as a problem box.
  function nothing(text, failed) {
    stack.length = 0;
    out.className = failed ? "problem" : "empty";
    out.textContent = failed ? "" : text;
    if (failed) createRoot(out.appendChild(document.createElement("div"))).render(h(ui.Problem, { title: one.plain(text).title }));
    size();
  }

  // Those too slow to come with the rest, each asked for by itself.
  const aloneIfLate = (layer) => (layer?.s.widgets || []).filter((w) => w.late).forEach((w) => redraw(layer, w).catch(() => {}));

  function widgets(s) {
    if (!(s.widgets || []).length) return Object.assign(document.createElement("div"), { className: "empty", textContent: "No widgets." });
    const el = Object.assign(document.createElement("div"), { className: "cards" });
    el.replaceChildren(...s.widgets.map(card));
    return el;
  }

  function bar() {
    nav.hidden = stack.length < 2;
    navRoot.render(h("div", { className: "nav" },
      h(ui.Button, { variant: "ghost", size: "sm", className: "-ml-2", onClick: back }, h(ui.Icon, { name: "caret-left" }), "Back"),
      h("div", { className: "title" }, top()?.s.title || ""),
      h("span")));
    size();
  }

  function back() {
    if (stack.length < 2) return;
    stack.pop().el.remove();
    top().el.hidden = false;
    bar();
  }

  // A widget's card, drawn by @one/ui as the pages draw it, in an element of its own that's drawn again in place, at
  // once, so the placeholder gives way to it without the view shrinking first.
  function card(w) {
    const el = document.createElement("div");
    el.__root = createRoot(el);
    draw(el, w);
    return el;
  }
  function draw(el, w) {
    el.__w = w;
    flushSync(() => el.__root.render(h(ui.WidgetCard, { w, host: { run: act, follow }, className: "h-full" })));
  }
  const cardOf = (w) => [...(top()?.el.children || [])].find((el) => el.__w === w);

  // A button or toggle: runs the app's tool as the user, then draws its widget again, the others left as they
  // are; → the error's text.
  async function act(app, tool, input, w) {
    try {
      await run(app, tool, input);
      await redraw(top(), w);
    } catch (err) {
      return err.message;
    }
  }

  // Widgets drawn again as their apps have them now: `only` that one, else all of a layer's.
  async function redraw(layer, only) {
    const s = layer?.s;
    if (!s?.widgets) return;
    const scope = layer.args.scope ? { scope: layer.args.scope } : {};
    const fresh = (await call("widgets_show", only ? { app: only.app, widget: only.widget, ...scope } : { ...layer.args }))?.widgets || [];
    for (const w of only ? [only] : [...s.widgets]) {
      const now = fresh.find((x) => x.app === w.app && x.widget === w.widget), i = s.widgets.indexOf(w);
      const el = [...layer.el.children].find((c) => c.__w === w);
      if (!now || !el || i < 0) continue;
      // Too slow to come with the rest: it stays as it was, and comes by itself.
      if (now.late && !only) { if (!w.late) redraw(layer, w).catch(() => {}); continue; }
      s.widgets[i] = now;
      draw(el, now);
    }
    size();
  }

  // A link: a web page through the chat, or one of the app's screens, opened over the widgets, its card dimmed meanwhile.
  async function follow(link, w) {
    if (typeof link === "string") return request("ui/open-link", { url: link }).catch(() => {});
    const el = cardOf(w);
    el?.classList.add("wait");
    try {
      show({ structuredContent: await call("screens_open", { app: w.app, screen: link.screen, params: link.params || {}, ...(top()?.args.scope ? { scope: top().args.scope } : {}) }) });
    } catch (err) {
      if (el) el.title = err.message;
    }
    el?.classList.remove("wait");
  }

  // A chat's default policy for a view (MCP Apps' `script-src 'self' 'unsafe-inline'`) refuses the data: modules a
  // screen's import map gives, and a frame takes its page's policy: so a screen's first imports read what ui.js has
  // already put on the page.
  const fromGlobals = (html) => html.replace(/(<script\b[^>]*\btype="module"[^>]*>)((?:\s*import\b[^;"']*?\bfrom\s*"[^"]+"\s*;?)+)/g, (_, tag, imports) =>
    tag + imports.replace(/import\s+([^;"']*?)\s*from\s*"([^"]+)"\s*;?/g, (_, what, from) => {
      const mod = `OneUI[${JSON.stringify(from)}]`, [, dflt, ns, names] = what.match(/^(?:([\w$]+)\s*,?\s*)?(?:\*\s*as\s+([\w$]+))?(?:\{([^}]*)\})?$/) || [];
      return [
        dflt && `const ${dflt} = ${mod}.default ?? ${mod};`,
        ns && `const ${ns} = ${mod};`,
        names !== undefined && `const { ${names.replace(/\bas\b/g, ":")} } = ${mod};`,
      ].filter(Boolean).join("");
    }));

  // An app's screen, in a sandboxed frame of its own, so it reaches nothing here and acts only as its app, through
  // its bridge (src/screen/bridge.js): `sheet` when it's in one.
  function mount(s, sheet) {
    // Its height is what it draws, not the frame's, so an empty page says it's empty.
    const shim = `<script>new ResizeObserver(() => parent.postMessage({ oneHeight: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*")).observe(document.documentElement);<\/script>`;
    const box = Object.assign(document.createElement("div"), { className: "frame", innerHTML: `<div class="ph" role="status" aria-label="Loading"></div>` });
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts allow-forms");
    frame.__screen = { s, sheet, frame };
    frame.srcdoc = oneHost.look(fromGlobals(s.html), appearance, !!sheet).replace("<head>", "<head>" + shim);
    box.append(frame);
    // Shown once it draws something, or a moment after it loads if it draws little.
    frame.onload = () => setTimeout(() => ready(box), 2000);
    return box;
  }

  function ready(box) {
    box.classList.add("ready");
    box.querySelector(".ph")?.remove();
  }

  // A screen opened in a sheet over this one → what it gave `one.close` once it's gone, else null.
  function sheet(s) {
    let value = null;
    const handle = ui.showSheet({ title: s.title || "" });
    handle.body.append(mount(s, { close: (v) => { value = v ?? null; handle.close(); }, setTitle: handle.setTitle }));
    return handle.closed.then(() => value);
  }

  // What the app's `vault` declares as `need`, asked for as an agent asks: the user picks or makes the item on their
  // own device, from the link → true once it's set.
  async function vault(s, need) {
    const said = String(await call("vault_request", { app: s.app, need, ...(s.scope ? { scope: s.scope } : {}) }));
    const link = said.match(/https?:\/\/\S+/)?.[0], id = said.match(/with id (\S+)/)?.[1];
    if (!link || !id) throw new Error(said);
    await request("ui/open-link", { url: link });
    for (const until = Date.now() + 10 * 60_000; Date.now() < until;) {
      await sleep(2000);
      const state = (await call("vault_status", { id }))?.state;
      if (state && state !== "waiting") return state === "set";
    }
    return false;
  }

  // The bridge's messages from a screen's frame, each acting as the screen's app, answered as the web client answers
  // them (src/screen/host.js).
  async function fromScreen(screen, m) {
    if (!screen) return;
    const { s, frame } = screen;
    if (m?.oneHeight !== undefined) {
      if (m.oneHeight > 40) (frame.__tall = m.oneHeight), tall(frame), ready(frame.parentElement);
      return size();
    }
    if (!m?.one) return;
    const reply = (ok, error) => frame.contentWindow?.postMessage({ oneReply: m.id, ok: ok ?? null, error }, "*");
    try {
      reply(await oneHost.answer(m.one, {
        frame,
        call: (tool, input) => run(s.app, tool, input),
        open: async (msg) => {
          const scope = msg.scope || s.scope;
          const to = await call("screens_open", { app: msg.app || s.app, screen: msg.screen || "main", params: msg.params || {}, ...(scope ? { scope } : {}) });
          if (msg.sheet) return sheet(to);
          // From a sheet, the sheet goes and it opens where the view is.
          screen.sheet?.close(null);
          show({ structuredContent: to });
          return null;
        },
        close: (value) => (screen.sheet ? screen.sheet.close(value) : back(), null),
        title: (title) => {
          s.title = title;
          if (screen.sheet) screen.sheet.setTitle(s.title);
          else if (top()?.s === s) bar();
          return null;
        },
        vault: (need) => vault(s, need),
        link: async (url) => (await request("ui/open-link", { url }), null),
        thrown: (msg) => call("screens_thrown", { app: s.app, screen: s.screen, exception: msg.exception }).catch(() => null),
        icons,
        // A chat's frame can't save a file or open one in a tab: the web client, with this screen, can.
        elsewhere: async () => {
          if (!s.web) throw new Error("Open this in the app to get this file.");
          await request("ui/open-link", { url: s.web });
          return null;
        },
      }));
    } catch (err) {
      reply(undefined, err.message);
    }
  }

  // What's shown keeps up with what changes, the agent's own calls in this chat too, while it's on screen: a chat
  // sends a view nothing it isn't asked for, so it asks again each time it's answered.
  let seen = true, watching = false;
  new IntersectionObserver(([e]) => { seen = e.isIntersecting; watch(); }).observe(document.body);
  document.addEventListener("visibilitychange", () => watch());
  async function watch() {
    if (watching) return;
    watching = true;
    try {
      while (!torn && seen && !document.hidden) {
        const apps = [...new Set(stack.flatMap(({ s }) => (s.html !== undefined ? [s.app] : (s.widgets || []).map((w) => w.app))))];
        if (!apps.length) break;
        let events;
        try {
          events = (await call("screens_changes", { apps }))?.events || [];
        } catch {
          // A chat or node that can't wait: asked again a while later.
          await sleep(30_000);
          continue;
        }
        for (const event of events) {
          document.querySelectorAll("iframe").forEach((f) => f.contentWindow?.postMessage({ oneEvent: event }, "*"));
          for (const layer of stack) redraw(layer).catch(() => {});
        }
      }
    } finally {
      watching = false;
    }
  }

  // A sheet or menu open makes room for itself (body.over).
  new MutationObserver(() => document.body.classList.toggle("over", !!document.querySelector('[role="dialog"], [role="alertdialog"], [role="menu"]')))
    .observe(document.body, { childList: true });

  function size() {
    // What it draws, not the frame it's in (scrollHeight), so it shrinks again once a sheet's gone.
    requestAnimationFrame(() => notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height: Math.ceil(document.documentElement.getBoundingClientRect().height) }));
  }
  new ResizeObserver(size).observe(document.body);

  request("ui/initialize", { appInfo: { name: "view", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
    .then((init) => { context(init?.hostContext); notify("ui/notifications/initialized"); })
    .catch(() => {});
})();
</script>
</body>
</html>
