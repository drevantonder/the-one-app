# What the app runtime does for Widgets: draws every widget and badge of the apps a page shows, for who's looking, through
# `api::AppRuntime`.
[package]
name = "widgets-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
widgets = { path = ".." }
api = { path = "../../api" }
scope = { path = "../../scope" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }
tracing = "0.1"
