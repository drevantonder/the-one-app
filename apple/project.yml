# The One App for iPhone, iPad and Mac. Generate the Xcode project with
# `xcodegen` in this directory. macos/build.sh builds the Mac target and adds
# the node and the Apple plugins' helpers to it.
name: TheOneApp
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
settings:
  DEVELOPMENT_TEAM: X96JC3HCV7
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: 0.1.0
  CURRENT_PROJECT_VERSION: 1
targets:
  TheOneApp:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    dependencies:
      - target: TheOneAppWidgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.theoneapp
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: The One App
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Nodes serve plain HTTP on the tailnet, which only admits this user's devices.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  TheOneAppMac:
    type: application
    platform: macOS
    sources: [Shared, ../macos/menubar.swift]
    dependencies:
      - target: TheOneAppWidgetsMac
    settings:
      PRODUCT_NAME: TheOneApp
      PRODUCT_BUNDLE_IDENTIFIER: dev.theoneapp
      INFOPLIST_FILE: ../macos/Info.plist
      # macos/build.sh signs the finished bundle with the Developer ID.
      CODE_SIGNING_ALLOWED: NO
  TheOneAppWidgets:
    type: app-extension
    platform: iOS
    sources: &widgetSources [Shared/MCPClient.swift, Shared/Network.swift, Shared/Widget, WidgetKit/Widgets.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.theoneapp.widgets
      TARGETED_DEVICE_FAMILY: "1,2"
    info: &widgetInfo
      path: WidgetKit/Info-iOS.plist
      properties:
        CFBundleDisplayName: The One App
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  TheOneAppWidgetsMac:
    type: app-extension
    platform: macOS
    sources: *widgetSources
    settings:
      PRODUCT_NAME: TheOneAppWidgets
      PRODUCT_BUNDLE_IDENTIFIER: dev.theoneapp.widgets
      CODE_SIGN_ENTITLEMENTS: WidgetKit/Widgets.entitlements
      CODE_SIGNING_ALLOWED: NO
    info:
      path: WidgetKit/Info-macOS.plist
      properties:
        CFBundleDisplayName: The One App
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
