# The native shells. project.sh fills in config.toml's fields and runs xcodegen.
name: Shells
options:
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Mac:
    type: application
    platform: macOS
    sources: [Shared, Mac, build/Client/one_client_ffi.swift, build/Artwork.xcassets, {path: ../vendor/phosphor/icons.json, buildPhase: resources}]
    dependencies:
      # The client library (client/ffi), which project.sh builds.
      - framework: build/Client/Client.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_NAME: ${CONFIG_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: app.${CONFIG_CLI}.mac
        CODE_SIGNING_ALLOWED: NO
        # Apple silicon only, as the node inside it and the client library are built.
        ARCHS: arm64
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: ${CONFIG_NAME}
        CFBundleName: ${CONFIG_NAME}
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CLI: ${CONFIG_CLI}
        Yours: ${CONFIG_YOURS}
        NodePort: "${CONFIG_PORT}"
        BuildCommit: ${BUILD_COMMIT}
        CFBundleVersion: "${BUILD_NUMBER}"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # <cli>://signed-in/: back from signing in; <cli>://vault?id=…&scope=…: an agent's request for a Vault item.
        CFBundleURLTypes:
          - CFBundleURLName: app.${CONFIG_CLI}.mac
            CFBundleURLSchemes:
              - ${CONFIG_CLI}
        # Asked for on the first call that needs each (Mac/Services).
        NSRemindersFullAccessUsageDescription: Your agents and other devices read and change your reminders through this Mac.
        NSCalendarsFullAccessUsageDescription: Your agents and other devices read and change your calendars through this Mac.
        NSContactsUsageDescription: Your agents and other devices look up your contacts through this Mac.
        NSAppleEventsUsageDescription: Your agents send iMessages you ask them to through Messages on this Mac.

  # The iPhone and iPad sign in at the install's address, as the web client does, and ask its nodes there.
  Phone:
    type: application
    platform: iOS
    sources: [Shared, Phone, Widget/Cache.swift, Widget/Intents.swift, build/Client/one_client_ffi.swift, build/Phone.xcassets, build/Artwork.xcassets, {path: ../vendor/phosphor/icons.json, buildPhase: resources}]
    dependencies:
      - target: Widgets
      - framework: build/Client/Client.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_NAME: ${CONFIG_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: app.${CONFIG_CLI}.phone
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${APPLE_TEAM}
    entitlements:
      path: build/Phone.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.${CONFIG_CLI}.phone"]
        # aps-environment, for apps' pushes, is added by project.sh only once push is on (see there).
    info:
      path: build/Phone-Info.plist
      properties:
        CFBundleDisplayName: ${CONFIG_NAME}
        CLI: ${CONFIG_CLI}
        Yours: ${CONFIG_YOURS}
        BuildCommit: ${BUILD_COMMIT}
        CFBundleVersion: "${BUILD_NUMBER}"
        AppGroup: group.app.${CONFIG_CLI}.phone
        # <cli>://signed-in/: back from signing in; <cli>://vault?id=…&scope=…: an agent's request for a Vault item.
        CFBundleURLTypes:
          - CFBundleURLName: app.${CONFIG_CLI}.join
            CFBundleURLSchemes:
              - ${CONFIG_CLI}
        # Asked for the first time an app scans a document (Shared/Views/ScreenFiles.swift).
        NSCameraUsageDescription: Scan documents for your apps.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]

  Widgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared/Views/Style.swift, Shared/Views/WidgetTree.swift, Shared/Views/SVGPath.swift, build/Artwork.xcassets]
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: app.${CONFIG_CLI}.phone.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # WidgetTree draws buttons, toggles and links as intents and links, and images from the app group.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${APPLE_TEAM}
    entitlements:
      path: build/Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.app.${CONFIG_CLI}.phone"]
    info:
      path: build/Widgets-Info.plist
      properties:
        # An extension carries its app's build number.
        CFBundleVersion: "${BUILD_NUMBER}"
        CFBundleDisplayName: ${CONFIG_NAME}
        CLI: ${CONFIG_CLI}
        AppGroup: group.app.${CONFIG_CLI}.phone
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
