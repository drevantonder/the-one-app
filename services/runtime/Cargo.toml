# What the app runtime does for services: switching one on or off on a device, what a computer's oned keeps its parts
# by, what an app declares its service may reach and listing a part, through `api::AppRuntime`.
[package]
name = "services-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
services = { path = ".." }
devices-runtime = { path = "../../devices/runtime" }
api = { path = "../../api" }
scope = { path = "../../scope" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
