# The `one` program: its CLI and MCP (src/), the node it serves, which is the root crate `one`, and the computer's onet
# (`onet`, run as `<cli>t`). A package of its own, not the root's, since it runs onet, which depends on `one` itself, and
# Cargo allows no package to depend on its own dependent.
[package]
name = "one-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[[bin]]
name = "one"
path = "src/main.rs"
doctest = false

# The tests are one binary, here so they can run the program (CARGO_BIN_EXE_one) and `cargo test` builds it.
[[test]]
name = "main"
path = "../tests/main.rs"

[dependencies]
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
key = { path = "../key" }
bucket = { path = "../bucket" }
database = { path = "../database" }
scope = { path = "../scope" }
api = { path = "../api" }
groups = { path = "../groups" }
vault = { path = "../vault" }
devices = { path = "../devices" }
services = { path = "../services" }
device-logs = { path = "../device-logs" }
deploy = { path = "../deploy" }
insights = { path = "../insights" }
notifications = { path = "../notifications" }
backups = { path = "../backups" }
# `backups check --folder`: a backup on a disk opened with the recovery key alone, with no network.
backups-runtime = { path = "../backups/runtime" }
one = { path = ".." }
# `<cli>t`, this computer's onet (onet/src/computer/), is this program run by that name.
onet = { path = "../onet", features = ["computer"] }
anyhow = "1"
axum = "0.8"
data-encoding = "2"
jiff = "0.2"
libc = "0.2"
rand = "0.8"
serde_json = "1"
sha2 = "0.11"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# AI Gateway's own code, run against a stand-in node (ai-gateway/tests/ai_gateway.rs).
ai-gateway = { path = "../ai-gateway" }
ai-gateway-runtime = { path = "../ai-gateway/runtime" }
# The Vault as the tests' devices run it: an item set or a request answered as a user (tests/e2e.rs).
vault-runtime = { path = "../vault/runtime" }
# Devices as the tests' devices run them: who holds the recovery key (tests/e2e.rs).
devices-runtime = { path = "../devices/runtime" }
# Deploying and adding apps as the tests' devices run it (tests/e2e.rs).
deploy-runtime = { path = "../deploy/runtime" }
# What a test device recorded, taken before it's sent (tests/e2e.rs).
insights-runtime = { path = "../insights/runtime" }
# What a browser's push service does with a push (RFC 8291's decryption, tests/contracts.rs): the node's own crypto.
aes-gcm = "0.10"
hkdf = "0.13"
ring = "0.17"
blake3 = "1"
ciborium = "0.2"
ed25519-dalek = "3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
