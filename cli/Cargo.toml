# The `one` program: its CLI and MCP (src/), the node it serves, which is the root crate `one`, and the computer's onet
# (`onet`, run as `<cli>t`). A package of its own, not the root's, since it runs onet, which depends on `one` itself, and
# Cargo allows no package to depend on its own dependent.
[package]
name = "one-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[[bin]]
name = "one"
path = "src/main.rs"
doctest = false

# The tests are one binary, here so they can run the program (CARGO_BIN_EXE_one) and `cargo test` builds it.
[[test]]
name = "main"
path = "../tests/main.rs"

[dependencies]
one = { path = ".." }
# `<cli>t`, this computer's onet (onet/src/computer/), is this program run by that name.
onet = { path = "../onet", features = ["computer"] }
anyhow = "1"
axum = "0.8"
data-encoding = "2"
jiff = "0.2"
libc = "0.2"
rand = "0.8"
serde_json = "1"
sha2 = "0.11"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
# What a browser's push service does with a push (RFC 8291's decryption, tests/contracts.rs): the node's own crypto.
aes-gcm = "0.10"
hkdf = "0.13"
ring = "0.17"
blake3 = "1"
ciborium = "0.2"
ed25519-dalek = "3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
