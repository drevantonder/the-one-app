[package]
name = "shell"
description = "The app: a window on the client's Rust half, and with no window its CLI and MCP."
version.workspace = true
edition.workspace = true
license.workspace = true

# A phone starts the app from this library, and a computer from the program.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
client = { path = ".." }
serde_json.workspace = true
tokio.workspace = true
# `custom-protocol` builds the app with its page inside it, however it's built.
tauri = { version = "2", features = ["custom-protocol"] }
# Opens the sign-in page in the device's own browser, where a passkey works.
tauri-plugin-opener = "2"

# A computer shows a notification while the app runs, as the system's own, and hears it tapped.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-notification = "2.8"

# A phone is woken by its push service, Apple's or Google's, which it gives the network its token for. Tauri's own
# notification plugin has no push; this one does.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-notifications = { version = "0.4", default-features = false, features = ["push-notifications"] }

# libc after 0.2.189 has no `in6_ifreq` on iOS, which netdev 0.46, through iroh, uses there.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
