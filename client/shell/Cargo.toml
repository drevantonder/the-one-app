[package]
name = "shell"
description = "The app: a window on the client's Rust half, and with no window its CLI and MCP."
version.workspace = true
edition.workspace = true
license.workspace = true

# A phone starts the app from this library, and a computer from the program.
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
client = { path = ".." }
serde_json.workspace = true
# `custom-protocol` builds the app with its page inside it, however it's built.
tauri = { version = "2", features = ["custom-protocol"] }
