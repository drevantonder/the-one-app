# The iPhone app's Xcode project, which build.sh generates with XcodeGen into target/iphone, filling in config.toml's
# fields from its environment: the app (Tauri's window, its Rust built by build.sh into target/iphone/lib), the
# home-screen widget, and with push (push.yml) the notification extension, sharing an App Group and its Keychain group.
name: Phone
include:
  - path: push.yml
    enable: ${PUSH}
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    DEVELOPMENT_TEAM: ${APPLE_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ARCHS: arm64
targets:
  Phone:
    type: application
    platform: iOS
    sources:
      - App
      # Its widget's buttons and toggles, which run in the app.
      - Widget/Intents.swift
      - Widget/JSONValue.swift
      - ../target/iphone/Phone.xcassets
    dependencies:
      - target: Widgets
      - sdk: AuthenticationServices.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: QuickLook.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: UserNotifications.framework
      - sdk: VisionKit.framework
      - sdk: WebKit.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_NAME: ${CONFIG_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: ${CONFIG_IPHONE}
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The intents call the app's Rust as C, which Swift 6's checks can't follow.
        SWIFT_VERSION: "5.0"
        # The app's Rust, with its Swift (iphone/Sources) and Tauri's in it, as build.sh made it.
        LIBRARY_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../target/iphone/lib $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        OTHER_LDFLAGS: $(inherited) -lone_native
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        ENABLE_BITCODE: NO
    entitlements:
      path: ../target/iphone/Phone.entitlements
      properties:
        com.apple.security.application-groups: ["group.${CONFIG_IPHONE}"]
    info:
      path: ../target/iphone/Phone-Info.plist
      properties:
        CFBundleDisplayName: ${CONFIG_NAME}
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "${BUILD_NUMBER}"
        CLI: ${CONFIG_CLI}
        Yours: ${CONFIG_YOURS}
        BuildCommit: ${BUILD_COMMIT}
        AppGroup: group.${CONFIG_IPHONE}
        # Where its device keys are kept (src/secrets.rs), which its notification extension reads too.
        KeychainGroup: group.${CONFIG_IPHONE}
        # <cli>://open?…, the links it takes (web.js `opened`); <cli>://signed-in/ is auth's, the sheet's own.
        CFBundleURLTypes:
          - CFBundleURLName: app.${CONFIG_CLI}.join
            CFBundleURLSchemes:
              - ${CONFIG_CLI}
        # Asked the first time an app scans a document.
        NSCameraUsageDescription: Scan documents for your apps.
        # Standard algorithms, not offered in France: what App Store Connect records for that answer, so it doesn't ask of each build.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]

  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - ../target/iphone/Artwork.xcassets
    settings:
      base:
        PRODUCT_NAME: Widgets
        PRODUCT_BUNDLE_IDENTIFIER: ${CONFIG_IPHONE}.widgets
        # It draws buttons, toggles and links as intents and links, and images from the App Group.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET
    entitlements:
      path: ../target/iphone/Widgets.entitlements
      properties:
        com.apple.security.application-groups: ["group.${CONFIG_IPHONE}"]
    info:
      path: ../target/iphone/Widgets-Info.plist
      properties:
        CFBundleShortVersionString: 0.1.0
        # An extension carries its app's build number.
        CFBundleVersion: "${BUILD_NUMBER}"
        CFBundleDisplayName: ${CONFIG_NAME}
        CLI: ${CONFIG_CLI}
        AppGroup: group.${CONFIG_IPHONE}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
