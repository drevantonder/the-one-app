# The native app, one for every platform (Linux, Windows, Mac, iPhone, Android): a window that is the web client's own
# (cloudflare/web, through one::web), on the client itself (one-client, ../) with this device's key in the OS's secret
# store. Its own workspace, so the repo's `cargo build` and `cargo test` never build Tauri.
[package]
name = "one-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "one_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one-native"
path = "src/main.rs"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The web client's files and the custom build's name, which the window shows from and the app is called by.
one = { path = "../..", default-features = false }
serde_json = "1"
# Windows' program icon (an .ico, which tauri-build requires there), drawn from the custom build's icon at each size:
# both already built for Tauri's own icons.
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.6"
# The iPhone's Swift (iphone/), a plugin of the app's own, linked into it as Tauri's own plugins link theirs: already
# built for tauri-build, which takes it with the same feature.
tauri-utils = { version = "2", features = ["build"] }

[dependencies]
# The app: the system's web view (WebKitGTK, WKWebView, WebView2, Android's) in a window, the same on every platform,
# with a tray or menu bar item on computers. Its plugins: opening links and files outside, and notifications (below).
# `custom-protocol`: the window's files are the app's own, built in, as the Tauri CLI's builds have them; without it,
# Tauri takes every build for development, which on a phone fetches them from a dev server.
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol"] }
# What a screen copies, which a web view takes only with a tap.
tauri-plugin-clipboard-manager = "2"
# Links that open the app (`<cli>://open?…`), and on computers, one app at a time, a second start (with a link or none)
# showing the first; the window as big and where it was left.
tauri-plugin-deep-link = "2"
one-client = { path = ".." }
one = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sign-in's requests, as the client's own.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
data-encoding = "2"
rand = "0.8"
url = "2"
tokio = { version = "1", features = ["sync", "time", "macros"] }

# Windows' own, beside the window (src/windows.rs): the taskbar button's count (BadgeUpdateManager), opening at login
# (StartupTask), the links to the network's address (AppUriHandler), and the machine's id in the registry. Both already built for Tauri and iroh.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "ApplicationModel", "System", "Win32_Foundation", "Win32_Graphics_Dwm"] }
windows-collections = "0.3"
windows-registry = "0.6"

# The OS's secret store for the device key and the refresh token: the Secret Service, the Credential Manager (Android's
# is its Keystore, through Kotlin: src/android.rs).
[target.'cfg(not(any(target_os = "macos", target_os = "ios", target_os = "android")))'.dependencies]
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

# Apple's own (src/secrets.rs, src/mac.rs): the Keychain in the group the extensions read, Info.plist, and the Mac's
# login item, node and defaults. All already built for Tauri (wry, tao) and keyring.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString", "NSObject", "NSArray"] }

# Notifications, but on a phone, whose are its own (src/iphone.rs, src/android.rs): the plugin's would take them from it.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-notification = "2"

# Where a file a screen gives is saved, and links opened outside; Android's are its own (src/android.rs).
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Android's own (src/android.rs): Kotlin's Keystore, widgets and pushes call the app's library, and it calls them back,
# through JNI. Tauri already builds it (wry).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
