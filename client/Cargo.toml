[package]
name = "one-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A library for every client (the CLI, native apps by FFI), and WebAssembly for browsers, built alone as a cdylib (with
# an rlib beside it, LTO leaves a quarter more), as `update` builds it (src/update.rs, `client`):
#   cargo rustc -p one-client --profile web --target wasm32-unknown-unknown --crate-type cdylib
# then wasm-bindgen --target web, and wasm-opt -Oz.
[lib]
doctest = false

[features]
# A client with no socket, in a Worker's Durable Object (src/relayed.rs): the remote MCP server's devices.
relayed = ["iroh/unstable-custom-transports", "dep:iroh-base", "dep:n0-watcher", "dep:noq-udp"]

[dependencies]
# A client reaches nodes over iroh, as they reach each other (src/node/net.rs): only ring's TLS, no n0 discovery or
# metrics. Pinned with the node's, since the relay runs iroh-relay's own code of this version.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
# iroh's own task and timer abstraction, which works the same natively (tokio) and in browsers.
n0-future = "0.3"
# Reads a response's head (hyper's own parser, already built).
httparse = "1"
data-encoding = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
# A client checks the network's signed entries itself with the nodes' own Rust (src/members.rs): who's who as they say
# it, never as a node does, asked of the scope database they build (`one`'s `db`, SQLite) and its permissions; and a
# new device's sign-in, before letting it in (`sign-in-proof`).
one = { path = "..", default-features = false, features = ["sign-in-proof"] }
rusqlite = "0.41"
anyhow = "1"
serde_json = "1"
# A transport of its own, as the Cloudflare node's (src/relayed.rs): iroh's custom transports, at the node's iroh.
iroh-base = { version = "=1.4.1", default-features = false, features = ["key", "relay"], optional = true }
n0-watcher = { version = "1", optional = true }
noq-udp = { version = "1.4", optional = true }

# Natively, the app is a device of its person (src/device.rs), with the node's own formats and rules (entries, members,
# logs, keys); ureq, which that crate's node uses too, to ask sign-in, the relay and the URL signer at the network's
# address.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ed25519-dalek = "3"
rand = "0.8"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

# In browsers: how the page's JavaScript calls it (src/wasm.rs); and SQLite, built into its WebAssembly as the
# Cloudflare node's is, with its clock and randomness from JavaScript (a third more on the wire: 776 KB brotli to 1.1 MB).
[target.'cfg(target_family = "wasm")'.dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
# iroh's and ring's randomness, from the browser's crypto.getRandomValues, for each version of getrandom they build.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[build-dependencies]
toml = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
