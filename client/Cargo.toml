[package]
name = "client"
description = "The client's Rust half: its key, reaching a server by key, what servers answered, and the CLI and MCP."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# What an encrypted blob is encrypted with: XChaCha20-Poly1305, whose nonce is long enough to be random.
chacha20poly1305 = "0.11"
data-encoding = "2"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# What this device is called, which its person is shown before they let it in.
gethostname = "1"
# One key from another: an artifact's from its owner's (RFC 5869).
hkdf = "0.13"
# Encrypting to a machine's key (RFC 9180): X25519, HKDF-SHA256 and ChaCha20-Poly1305.
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
# Reading a folder as git would keep it, leaving out what its .gitignore files do, with no git needed.
ignore = "0.4"
iroh.workspace = true
# Asking the signer at a network's address, with the TLS iroh reaches the relay there with.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
# Restoring from a backup in S3-compatible storage (`backups`): requests signed here, and sent with reqwest.
rusty-s3 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11"
# Names the key file without replacing one that's there, on every system, a phone included.
tempfile = "3"
tokio.workspace = true
url = "2"
# Keys are wiped from memory when they're let go of.
zeroize = "1"

[build-dependencies]
serde_json.workspace = true

# What a phone is called, which only its system says (`name` in `src/lib.rs`).
[target.'cfg(target_os = "ios")'.dependencies]
dispatch2 = "0.3"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIDevice"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
