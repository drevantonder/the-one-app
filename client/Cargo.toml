[package]
name = "one-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A client that keeps no log of its own (a phone) and asks its user's servers to do the work.

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
anyhow = "1"
ciborium = "0.2"
data-encoding = "2"
iroh = "1.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
