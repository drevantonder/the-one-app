# Deploy, as every build has it, WebAssembly too: bundles, add's and remove's specs and what the deploy route says;
# on a machine, building an app with the pinned Bun (and pinning workerd, which runs them). What serves them is the
# runtime's (runtime/).
[package]
name = "deploy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
api = { path = "../api" }
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
anyhow = "1"
data-encoding = "2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rand = "0.8"
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
