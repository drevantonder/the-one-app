# What the app runtime does for Deploy: deploying, forking and adding apps, their code, and the logos of the sites they
# connect to, through `api::AppRuntime`.
[package]
name = "deploy-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
deploy = { path = ".." }
api = { path = "../../api" }
# Blobs, read and put as the app runtime keeps them.
database-runtime = { path = "../../database/runtime" }
scope = { path = "../../scope" }
database = { path = "../../database" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
platform = { path = "../../platform", features = ["machine"] }
anyhow = "1"
axum = "0.8"
data-encoding = "2"
# A site's favicon.ico becomes a PNG for shells (logos.rs); ureq already brings it in.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
