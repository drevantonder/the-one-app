# What the app runtime does for the Vault: its items in each scope, requests for one, which machines open each
# scope's, and filling them into apps' and agents' requests, through `api::AppRuntime`.
[package]
name = "vault-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
vault = { path = ".." }
api = { path = "../../api" }
scope = { path = "../../scope" }
database = { path = "../../database" }
key = { path = "../../key" }
custom-build = { path = "../../custom-build" }
anyhow = "1"
axum = "0.8"
data-encoding = "2"
jiff = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
platform = { path = "../../platform", features = ["machine"] }
ureq = { version = "3", features = ["json"] }
