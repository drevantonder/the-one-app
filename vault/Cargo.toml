# The Vault, as every build has it, WebAssembly too: items and their sealing, filling them into requests, its tools'
# specs, what its routes say and its commands. What serves them is the runtime's (runtime/).
[package]
name = "vault"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
api = { path = "../api" }
scope = { path = "../scope" }
database = { path = "../database" }
key = { path = "../key" }
custom-build = { path = "../custom-build" }
anyhow = "1"
data-encoding = "2"
rand = "0.8"
# A key in the Vault signs a JWT with RS256 on the device that fills it (`rs256`).
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
