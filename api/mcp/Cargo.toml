# MCP's tools and the CLI's commands, made from what the API says: the MCP server (an app runtime's /mcp, `one mcp`),
# its code mode, the skills, and a tool's input, help and answer as both read them. Below the app runtime, which serves
# /mcp and the skills, and the CLI; not in the api crate, since it uses deploy's build, @one/ui's files and Widgets'
# tool, each of which is built on api.
[package]
name = "mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
custom-build = { path = "../../custom-build" }
platform = { path = "../../platform", features = ["machine"] }
scope = { path = "../../scope" }
api = { path = ".." }
# The screens MCP's apps show (src/mcp/apps.rs).
ui = { path = "../../ui" }
# Deploying from MCP builds an app's screens here (src/mcp.rs), and code mode runs with the pinned Bun (src/code.rs).
deploy = { path = "../../deploy" }
# Widgets' tool, which MCP's apps show (src/mcp/apps.rs).
widgets = { path = "../../widgets" }
anyhow = "1"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }
