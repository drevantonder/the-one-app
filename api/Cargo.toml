# The API: what every client asks a device through, at /api/*, what a feature defines itself with, and the interface
# its runtime half reaches its app runtime through.
[package]
name = "api"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
scope = { path = "../scope" }
database = { path = "../database" }
bucket = { path = "../bucket" }
key = { path = "../key" }
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
anyhow = "1"
data-encoding = "2"
rand = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The device signs its app runtime's requests to the relay and auth as they are (`holds::sign_request`).
ed25519-dalek = "3"
tracing = "0.1"

# Serving and asking a device's API, and the runtime's interface: only a machine's.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# What a machine's endpoint is made with (`net`), as the app runtime's (app-runtime/src/net.rs): pinned with it.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
# The runtime's interface names the bucket's place (`runtime::Databases::bucket`).
bucket = { path = "../bucket", features = ["machine"] }
# Telling git on this machine to reach the network's apps through this program (`git_wire`), which a throwaway network's
# programs don't (`platform::mode`).
platform = { path = "../platform", features = ["machine"] }
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
# Times said to users, in their time zone (`feature::say_time`).
jiff = "0.2"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
# A request's trace is a task-local (`trace`); a database a feature opens is behind tokio's lock (`runtime::Databases`).
tokio = { version = "1", features = ["sync", "rt", "net"] }
# This machine's own programs ask its local API with it (`local::agent`).
ureq = { version = "3", features = ["json"] }
# The local token is compared by its digest, in constant time (`local::from_this_machine`).
sha2 = "0.11"
