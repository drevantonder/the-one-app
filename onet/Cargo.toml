[package]
name = "onet"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# A library for every client (a computer's onet, `<cli>t`; native apps by FFI), and WebAssembly for browsers, built alone as a cdylib (with
# an rlib beside it, LTO leaves a quarter more), as `build::onet` builds it (dev/src/build.rs):
#   cargo rustc -p onet --profile web --target wasm32-unknown-unknown --crate-type cdylib
# then wasm-bindgen --target web, and wasm-opt -Oz.
[lib]
doctest = false

[features]
# A client with no socket, in a Worker's Durable Object (src/relayed.rs): the remote MCP server's devices.
relayed = ["iroh/unstable-custom-transports", "dep:iroh-base", "dep:n0-watcher", "dep:noq-udp"]
# A computer's onet (src/computer/), run in the background as `<cli>t`: its loopback API, with what only a computer's
# onet does (its app runtime, home, bucket, harnesses and git, and the skills it writes), and axum, which serves that API
# as the app runtime serves its own.
computer = ["dep:mcp", "platform/machine", "bucket/machine", "dep:jiff", "dep:oned-update", "tokio/net", "tokio/io-util", "tokio/fs", "tokio/rt-multi-thread", "tokio/macros", "tokio/signal", "tokio/time", "dep:axum", "dep:serde", "dep:tracing", "dep:tracing-subscriber", "dep:jsonc-parser", "dep:toml_edit", "dep:blake3"]

[dependencies]
custom-build = { path = "../custom-build" }
platform = { path = "../platform" }
# A computer's onet notes the network's address where `one update` reads it (oned/update/).
oned-update = { path = "../oned/update", features = ["machine"], optional = true }
key = { path = "../key" }
bucket = { path = "../bucket" }
database = { path = "../database" }
scope = { path = "../scope" }
api = { path = "../api" }
insights = { path = "../insights" }
# What Devices' routes take (devices/): the recovery key's, which a computer's onet answers itself.
devices = { path = "../devices" }
# Joining with a pairing code, which a computer's onet does as its device (`onboarding::join`).
onboarding = { path = "../onboarding" }
device-logs = { path = "../device-logs" }
notifications = { path = "../notifications" }
# A client reaches app runtimes over iroh, as they reach each other (app-runtime/src/net.rs): only ring's TLS, no n0 discovery or
# metrics. Pinned with the app runtime's, since the relay runs iroh-relay's own code of this version.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
# iroh's own task and timer abstraction, which works the same natively (tokio) and in browsers.
n0-future = "0.3"
# Reads a response's head (hyper's own parser, already built).
httparse = "1"
data-encoding = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
# The features every client lists (src/features.rs), each defined in its own crate.
deploy = { path = "../deploy" }
vault = { path = "../vault" }
backups = { path = "../backups" }
groups = { path = "../groups" }
widgets = { path = "../widgets" }
ai-gateway = { path = "../ai-gateway" }
# The skills a computer's onet writes into agents' harnesses (src/computer/harnesses.rs).
mcp = { path = "../api/mcp", optional = true }
rusqlite = "0.41"
anyhow = "1"
serde_json = "1"
# A new app key, where a device makes one (src/keyring.rs).
rand = "0.8"
# A transport of its own, as oned on Cloudflare's (src/relayed.rs): iroh's custom transports, at the app runtime's iroh.
iroh-base = { version = "=1.4.1", default-features = false, features = ["key", "relay"], optional = true }
n0-watcher = { version = "1", optional = true }
noq-udp = { version = "1.4", optional = true }
axum = { version = "0.8", optional = true }
serde = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# The agent harnesses' settings, edited in place with their comments kept (src/computer/harnesses.rs), and what was last
# written to each file, by its hash.
jsonc-parser = { version = "0.34", features = ["cst", "serde"], optional = true }
toml_edit = { version = "0.25", optional = true }
blake3 = { version = "1", optional = true }
# A throwaway network's bucket lists its objects with when each was written, as S3 does (src/computer/throwaway.rs).
jiff = { version = "0.2", optional = true }

# Natively, the app is a device of its user (src/device.rs), with the app runtime's own formats and rules (entries, members,
# logs, keys); ureq, which that crate's app runtime uses too, to ask auth, the relay and the URL signer at the network's
# address.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ed25519-dalek = "3"
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }

# In browsers: how the page's JavaScript calls it (src/wasm.rs); and SQLite, built into its WebAssembly as the
# oned on Cloudflare's is, with its clock and randomness from JavaScript (a third more on the wire: 776 KB brotli to 1.1 MB).
[target.'cfg(target_family = "wasm")'.dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
# iroh's and ring's randomness, from the browser's crypto.getRandomValues, for each version of getrandom they build.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
