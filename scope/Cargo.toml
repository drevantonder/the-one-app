# The scope database: who's who, roles, the rules of each kind of step, and what a device asks of it.
[package]
name = "scope"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
database = { path = "../database" }
bucket = { path = "../bucket" }
key = { path = "../key" }
custom-build = { path = "../custom-build" }
anyhow = "1"
blake3 = "1"
ciborium = "0.2"
data-encoding = "2"
ed25519-dalek = "3"
rand = "0.8"
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits", "serialize"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
