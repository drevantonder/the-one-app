<!doctype html>
<meta charset="utf-8">
<!-- What each app screen's frame loads (web.js): the screen's page, as its node made it, is written in once the web
     client sends it. The frame is sandboxed without its own origin, so the screen can't reach the web client or its
     tokens; it talks only through the bridge's messages. Anywhere else (framed by another site without a sandbox,
     say) it has this origin, and does nothing. -->
<script>
  if (self.origin === "null") {
    addEventListener("message", function take(e) {
      if (e.source !== parent || typeof e.data?.oneScreen !== "string") return;
      removeEventListener("message", take);
      document.open();
      document.write(e.data.oneScreen);
      document.close();
      requestAnimationFrame(() => requestAnimationFrame(() => parent.postMessage({ oneWritten: true }, "*")));
    });
    parent.postMessage({ oneFrame: true }, "*");
  }
</script>
