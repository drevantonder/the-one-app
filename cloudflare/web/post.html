<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action https: http://127.0.0.1:*">
<meta name="referrer" content="no-referrer">
<title>Continue</title>
<!-- A sign-up at another site that starts with a form sent there (as a GitHub App's manifest is), which an app's
     screen can't send from its sandbox: `/post.html#to=<https address>&<field>=<value>…` shows where it goes, and
     Continue sends those fields there. It's only a form, as any site could show; nothing of the network's goes with it. -->
<style>
  body { font: 17px/1.4 system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #141414; color: #f2f2f2; } p { color: #9b9b9b; } }
  main { text-align: center; padding: 24px; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #6b6b6b; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 22px; background: #007aff; color: #fff; cursor: pointer; }
</style>
<main><h1 id="title"></h1><p id="where"></p><form id="form" method="post"><button id="go" hidden>Continue</button></form></main>
<script src="/post.js"></script>
