# Backups, as every build has them, WebAssembly too: a place's Vault item kind, the tools' specs and what its route says.
# What runs them is the runtime's (runtime/).
[package]
name = "backups"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
api = { path = "../api" }
custom-build = { path = "../custom-build" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
